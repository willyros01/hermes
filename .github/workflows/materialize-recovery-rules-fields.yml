name: Materialize Recovery Rules Fields

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-recovery-rules-fields.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Materialize validated recovery rule fields
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { default: candidate } = await import('./firestore-e2ee-v1-recovery-fields-candidate.mjs');
          fs.writeFileSync('firestore.rules', candidate);
          NODE
      - name: Commit bounded recovery rule update
        run: |
          if git diff --quiet -- firestore.rules; then
            echo 'No rules change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firestore.rules
          git commit -m 'Allow validated recovery RUK protection metadata fields'
          git push
