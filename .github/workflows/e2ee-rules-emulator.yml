name: E2EE Rules Emulator Gate

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore-e2ee-v1.rules.test.mjs'
      - 'package.json'
      - '.github/workflows/e2ee-rules-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2ee-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: npm install --ignore-scripts
      - name: Run exact repository Firestore emulator security gate
        run: npm run emulator:test:e2ee-rules
