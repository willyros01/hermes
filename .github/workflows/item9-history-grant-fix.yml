name: Item 9 History Grant Fix
on:
  push:
    paths:
      - .github/workflows/item9-history-grant-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch retained-history eligibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('e2ee-account-group-runtime.js'); s=p.read_text()
          old='const rows=(Array.isArray(sourceRows)?sourceRows:[]).map(row=>({row,id:text(row?.id,"Source message ID"),createdAt:asDate(row?.createdAt,"Source message time")})).filter(x=>b.kind==="beginning"||x.createdAt.getTime()>=b.at.getTime()).sort((x,y)=>x.createdAt-y.createdAt||x.id.localeCompare(y.id));if(!rows.length)throw new Error("No retained group messages are eligible for this history grant.");'
          new='const rows=(Array.isArray(sourceRows)?sourceRows:[]).filter(row=>Number(row?.e2ee)===4&&row?.groupFormat==="fidunio-group-message-v1").map(row=>({row,id:text(row?.id,"Source message ID"),createdAt:asDate(row?.createdAt,"Source message time")})).filter(x=>b.kind==="beginning"||x.createdAt.getTime()>=b.at.getTime()).sort((x,y)=>x.createdAt-y.createdAt||x.id.localeCompare(y.id));if(!rows.length)throw new Error("No current encrypted retained history is available to share for this selection.");'
          if s.count(old)!=1: raise SystemExit('history grant source anchor changed')
          p.write_text(s.replace(old,new,1))

          Path('version.js').write_text('globalThis.FIDUNIO_RELEASE = Object.freeze({ version: "1.1.48" });\n')
          p=Path('service-worker.js'); s=p.read_text()
          import re
          s,n=re.subn(r'const SHELL_REVISION="[^"]+";', 'const SHELL_REVISION="1.1.48-history-grant-eligibility";', s, count=1)
          if n!=1: raise SystemExit('service worker revision anchor changed')
          p.write_text(s)

          test=Path('group-history-grant-eligibility.test.mjs')
          test.write_text('''import fs from "node:fs";\nconst runtime=fs.readFileSync("e2ee-account-group-runtime.js","utf8");\nfunction ok(name,value){if(!value)throw new Error(`FAIL: ${name}`);console.log(`PASS: ${name}`);}\nok("grant source filters to current E2EE v4 group envelopes",/filter\\(row=>Number\\(row\\?\\.e2ee\\)===4&&row\\?\\.groupFormat===\\"fidunio-group-message-v1\\"\\)/.test(runtime));\nok("legacy-only selection fails clearly before Firestore write",runtime.includes("No current encrypted retained history is available to share for this selection."));\nok("grant boundary still applies after eligibility filter",/filter\\(x=>b.kind===\\"beginning\\"\\|\\|x.createdAt.getTime\\(\\)>=b.at.getTime\\(\\)\\)/.test(runtime));\nconsole.log("Group history grant eligibility gate passed.");\n''')

          release='''\n\n## FIDUNIO 1.1.48 — Item 9 earlier-history grant eligibility correction\n\nDuring final Item 9 device acceptance, add/remove/re-add and join-time history behavior passed, but an owner attempt to grant a re-added member retained history **From beginning** returned Firestore `Missing or insufficient permissions`. The history-grant Firestore authority intentionally permits copies only from current encrypted group messages (`e2ee == 4`). The runtime had been feeding every retained group row into the grant builder, including legacy pre-v4 rows, so a legacy source could reach the stricter grant rule. 1.1.48 filters retained grant sources to `e2ee == 4` / `fidunio-group-message-v1` before boundary selection, encryption, grant creation, and copy writes. If no eligible encrypted history exists for the requested range, the user gets an explicit safe message instead of a permission error. No Firestore rules/backend, membership transaction, epoch rotation, normal group-message visibility, receipts, notifications, PIN, attachments, deletion, or reaction authority changed. Device acceptance of From beginning and selected-date grants remains required before closing Item 9.\n'''
          for name in ['README.md','hermes-memory.txt','FIDUNIO-BUILD-CHECKLIST.md','CURRENT-REBUILD.md']:
              q=Path(name); q.write_text(q.read_text()+release)
          defect='''\n\n## FDA-GROUP-006 — earlier-history grant can select legacy non-v4 source rows\n\n- **Build/device:** FIDUNIO 1.1.47, iPad owner during Item 9 re-add acceptance.\n- **Observed:** re-add passed, but History access → From beginning → Grant Access returned `Missing or insufficient permissions`.\n- **Cause:** Firestore history-grant authority permits source/copy messages only when the source group message is current E2EE v4. The runtime read every retained group message and did not exclude legacy pre-v4 rows before choosing grant sources.\n- **Repair allocation:** FIDUNIO 1.1.48. Filter history-grant source rows to `e2ee == 4` and `groupFormat == fidunio-group-message-v1` before applying beginning/date boundaries.\n- **Protected boundaries:** no Firebase rules/backend, membership, group epoch, normal message visibility, receipt, notification, PIN, attachment, reaction, or delete behavior changed.\n- **Status:** FIX CANDIDATE — device re-acceptance required.\n- **Exit:** From beginning succeeds when eligible v4 retained history exists; selected-date succeeds for an eligible range; a range with no eligible retained v4 history returns a clear safe message rather than a Firestore permission error.\n'''
          q=Path('DEVICE-ACCEPTANCE-BUGS.md'); q.write_text(q.read_text()+defect)
          q=Path('TODO.md'); s=q.read_text(); s=s.replace('9. **Add or remove members in an existing group conversation — 1.1.47 OWNER-MEMBER-PROJECTION CORRECTION; DEVICE RE-ACCEPTANCE PENDING**','9. **Add or remove members in an existing group conversation — 1.1.48 HISTORY-GRANT ELIGIBILITY CORRECTION; DEVICE RE-ACCEPTANCE PENDING**',1); q.write_text(s)
          PY
          node --check e2ee-account-group-runtime.js
          node group-history-grant-eligibility.test.mjs
      - name: Commit fix
        run: |
          git config user.name "FIDUNIO build"
          git config user.email "actions@users.noreply.github.com"
          git add e2ee-account-group-runtime.js version.js service-worker.js group-history-grant-eligibility.test.mjs README.md hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md CURRENT-REBUILD.md DEVICE-ACCEPTANCE-BUGS.md TODO.md
          git commit -m "Fix Item 9 history grant eligibility in 1.1.48"
          git push origin HEAD:main
