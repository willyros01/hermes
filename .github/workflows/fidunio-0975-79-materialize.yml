name: FIDUNIO 0.9.7.5-0.9.7.9 Materializer
on: {push: {branches: [fidunio-complete-rebuild], paths: [.fidunio-0975-79-trigger]}}
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fidunio-complete-rebuild, fetch-depth: 0}
      - run: python .fidunio-0975-79-materialize.py
      - run: npm run test:attachment-phase-closeout
      - run: |
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add firebase.js package.json version.js
          git commit -m "Build FIDUNIO 0.9.7.5 through 0.9.7.9"
          git push origin HEAD:fidunio-complete-rebuild
