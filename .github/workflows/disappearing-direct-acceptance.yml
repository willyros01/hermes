name: Disappearing direct acceptance closeout
on:
  push:
    paths:
      - '.github/workflows/disappearing-direct-acceptance.yml'
permissions:
  contents: write
jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record direct device acceptance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          note = """## Disappearing text — direct-message device acceptance\n\n**Status: DEVICE ACCEPTED for direct text on FIDUNIO 0.9.9.12 — 2026-09-08.**\n\nFresh real-device acceptance after live scheduler/index recovery passed the complete direct 5-minute path: message sent, recipient opened it and authoritative state advanced to Read, the message physically disappeared on both sender and recipient after the read-based expiry window plus scheduler interval, and after closing/reopening both apps the purged message did not return. This validates the direct-text physical purge and local anti-resurrection path on real devices. Unread-protection and group acceptance remain separate required tests before the overall disappearing-message feature is fully closed.\n\n"""
          p=Path('DEVICE-ACCEPTANCE-BUGS.md'); t=p.read_text()
          if '## Disappearing text — direct-message device acceptance' not in t:
              p.write_text(t.split('\n',1)[0]+'\n\n'+note+t.split('\n',1)[1].lstrip('\n'))

          note2 = """### DISAPPEARING DIRECT DEVICE ACCEPTANCE — 0.9.9.12\n\nFresh direct 5-minute disappearing-text acceptance passed after the live Firestore collection-group index recovery: sent yes, authoritative Read yes, disappeared on sender yes, disappeared on recipient yes, and after close/reopen the message did not return. Direct disappearing text is device accepted. Unread-protection and group behavior remain pending acceptance; attachments remain intentionally non-disappearing in this checkpoint.\n\n"""
          p=Path('CURRENT-REBUILD.md'); t=p.read_text()
          if '### DISAPPEARING DIRECT DEVICE ACCEPTANCE — 0.9.9.12' not in t: p.write_text(note2+t)

          mem = """DISAPPEARING DIRECT DEVICE ACCEPTANCE (2026-09-08): FIDUNIO 0.9.9.12 passed the fresh direct 5-minute real-device test after scheduler/index recovery. Message sent; recipient produced authoritative Read; message physically disappeared on both sender and recipient; after both apps were closed/reopened the message did not return. Direct text disappearance is accepted. Do not mark the entire disappearing feature closed until unread-protection and group acceptance also pass. Attachments remain non-disappearing in this activation checkpoint.\n\n"""
          p=Path('hermes-memory.txt'); t=p.read_text()
          if 'DISAPPEARING DIRECT DEVICE ACCEPTANCE (2026-09-08)' not in t: p.write_text(mem+t)

          p=Path('FIDUNIO-BUILD-CHECKLIST.md'); t=p.read_text()
          old='- [ ] Device-confirm direct 5-minute disappearing text from Read -> physical absence on sender and recipient.'
          new='- [x] Device-confirm direct 5-minute disappearing text from Read -> physical absence on sender and recipient; close/reopen confirmed no resurrection.'
          if old in t: p.write_text(t.replace(old,new,1))

          p=Path('DISAPPEARING-PURGE-AUTHORITY.md'); t=p.read_text()
          add="""\n### Direct real-device acceptance — 0.9.9.12\nAfter the production collection-group index recovery, a fresh 5-minute direct disappearing-text test passed end to end on real devices: authoritative Read established the expiry start, the server scheduler physically deleted the source from Firestore, both sender and recipient converged to absence, and close/reopen did not resurrect the message. This accepts the direct-text purge path. Unread-protection and group acceptance remain required before overall feature closeout.\n"""
          if '### Direct real-device acceptance — 0.9.9.12' not in t: p.write_text(t+add)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEVICE-ACCEPTANCE-BUGS.md CURRENT-REBUILD.md hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md DISAPPEARING-PURGE-AUTHORITY.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record direct disappearing-text device acceptance"
          git push origin HEAD:main
