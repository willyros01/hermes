name: Disappearing unread acceptance closeout
on:
  push:
    paths:
      - '.github/workflows/disappearing-unread-acceptance.yml'
permissions:
  contents: write
jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record unread-protection acceptance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('DEVICE-ACCEPTANCE-BUGS.md'); t=p.read_text()
          old='Fresh real-device acceptance after live scheduler/index recovery passed the complete direct 5-minute path: message sent, recipient opened it and authoritative state advanced to Read, the message physically disappeared on both sender and recipient after the read-based expiry window plus scheduler interval, and after closing/reopening both apps the purged message did not return. This validates the direct-text physical purge and local anti-resurrection path on real devices. Unread-protection and group acceptance remain separate required tests before the overall disappearing-message feature is fully closed.'
          new=old.replace('Unread-protection and group acceptance remain separate required tests before the overall disappearing-message feature is fully closed.','Unread protection also passed on real devices: a 5-minute disappearing message remained present beyond five minutes while the recipient had not Read it, proving expiry does not start from send or delivery time. Group acceptance remains the only outstanding device test before the overall disappearing-text feature is fully closed.')
          if old in t: p.write_text(t.replace(old,new,1))

          p=Path('CURRENT-REBUILD.md'); t=p.read_text()
          note='''### DISAPPEARING UNREAD-PROTECTION DEVICE ACCEPTANCE — 0.9.9.12\n\nReal-device unread protection passed: a 5-minute disappearing text remained present beyond five minutes while the recipient had not Read it. This confirms expiry is not authorized from send or delivery time and begins only after the authoritative Read condition. Direct disappearing text and unread protection are device accepted; group disappearing text remains the only outstanding acceptance test for this activation checkpoint. Attachments remain intentionally non-disappearing.\n\n'''
          if '### DISAPPEARING UNREAD-PROTECTION DEVICE ACCEPTANCE — 0.9.9.12' not in t: p.write_text(note+t)

          p=Path('hermes-memory.txt'); t=p.read_text()
          mem='''DISAPPEARING UNREAD-PROTECTION DEVICE ACCEPTANCE (2026-09-08): FIDUNIO 0.9.9.12 passed the unread-protection real-device test. A 5-minute disappearing text remained present beyond five minutes while the recipient had not Read it, proving expiry does not start from send or delivery time. Direct disappearing-text purge and unread protection are accepted. Do not mark the overall disappearing-text feature closed until group acceptance passes. Attachments remain intentionally non-disappearing in this activation checkpoint.\n\n'''
          if 'DISAPPEARING UNREAD-PROTECTION DEVICE ACCEPTANCE (2026-09-08)' not in t: p.write_text(mem+t)

          p=Path('FIDUNIO-BUILD-CHECKLIST.md'); t=p.read_text()
          old='- [ ] Device-confirm unread message does not disappear and offline/reopen does not resurrect a purged message.'
          new='- [x] Device-confirm unread message does not disappear before authoritative Read; direct close/reopen already confirmed no resurrection after purge.'
          if old in t: p.write_text(t.replace(old,new,1))
          old2='- [ ] Deploy the reviewed Firestore index to live `fidunio-fef13` and verify scheduler invocation returns success.'
          if old2 in t: p.write_text(t.replace(old2,'- [x] Deploy the reviewed Firestore index to live `fidunio-fef13` and verify scheduler invocation returns success.',1))

          p=Path('DISAPPEARING-PURGE-AUTHORITY.md'); t=p.read_text()
          add='''\n### Unread-protection real-device acceptance — 0.9.9.12\nA 5-minute disappearing text remained present beyond five minutes while the recipient had not produced authoritative Read. This validates the first-Read start rule on real devices and proves send/delivery time alone cannot authorize expiry. Direct purge and unread protection are accepted; group acceptance remains pending.\n'''
          if '### Unread-protection real-device acceptance — 0.9.9.12' not in t: p.write_text(t+add)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEVICE-ACCEPTANCE-BUGS.md CURRENT-REBUILD.md hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md DISAPPEARING-PURGE-AUTHORITY.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record disappearing unread-protection acceptance"
          git push origin HEAD:main
