name: Materialize Group UI

on:
  push:
    branches: [fidunio-rebuild-baseline-2026-09-05]
    paths:
      - 'materialize-group-ui.mjs'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize remaining group UI transform
        run: node materialize-group-ui.mjs
      - name: Validate source ownership
        run: |
          node --check app.js
          node --check service-worker.js
          npm run test:runtime-transform-anchors
          npm run test:runtime-authority
          git diff --check
      - name: Commit materialized group UI
        run: |
          git config user.name 'willyros01'
          git config user.email 'willyros01@gmail.com'
          git add app.js service-worker.js runtime-transform-anchor.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize group creation UI'
          git push
