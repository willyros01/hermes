name: Temporary FCM N3 builder
on:
  push:
    paths:
      - '.github/workflows/tmp-fcm-n3.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build N3
        shell: bash
        run: |
          echo '__PAYLOAD__' | base64 -d > /tmp/n3.py
          python3 /tmp/n3.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "Build FCM N3 registration foundation"
          git push
