name: Stabilize E2EE identity lifecycle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stabilize-e2ee-identity.yml'

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded stable-identity repair
        run: |
          python - <<'PY'
          from pathlib import Path

          # app.js owns active E2EE identity material. Replace the two independent
          # create-if-missing paths with one serialized pair initializer so concurrent
          # startup callers can never generate competing keypairs/device IDs.
          p=Path('app.js')
          s=p.read_text()
          start=s.index('async function getOrCreateDeviceKeyPair(){')
          end=s.index('function canonicalPublicJwk', start)
          replacement='''let deviceIdentityMaterialPromise=null;\nasync function ensureStableDeviceIdentityMaterial(){\n  if(deviceIdentityMaterialPromise)return deviceIdentityMaterialPromise;\n  deviceIdentityMaterialPromise=(async()=>{\n    const db=await openDb();\n    const store=db.transaction("meta","readonly").objectStore("meta");\n    const keyReq=store.get("e2ee-device-keypair-v1");\n    const identityReq=store.get("e2ee-device-identity-v1");\n    const [existingKeyPair,existingIdentity]=await Promise.all([idbRequest(keyReq),idbRequest(identityReq)]);\n    const hasKeyPair=!!(existingKeyPair?.privateKey&&existingKeyPair?.publicKey&&existingKeyPair?.publicJwk);\n    const hasIdentity=!!existingIdentity?.deviceId;\n    if(hasKeyPair!==hasIdentity){\n      throw new Error("FIDUNIO E2EE identity is incomplete. A deliberate device reset is required; automatic key rotation is blocked.");\n    }\n    if(hasKeyPair){\n      deviceKeyPair=existingKeyPair;\n      return{keyPair:existingKeyPair,identity:existingIdentity};\n    }\n    const kp=await crypto.subtle.generateKey({name:"ECDH",namedCurve:"P-256"},false,["deriveBits"]);\n    const publicJwk=await crypto.subtle.exportKey("jwk",kp.publicKey);\n    const createdAt=Date.now();\n    const keyPair={privateKey:kp.privateKey,publicKey:kp.publicKey,publicJwk,createdAt};\n    const identity={\n      deviceId:crypto.randomUUID ? crypto.randomUUID() : `dev-${createdAt}-${b64(crypto.getRandomValues(new Uint8Array(12))).replace(/[^a-zA-Z0-9]/g,"")}`,\n      createdAt\n    };\n    const tx=db.transaction("meta","readwrite");\n    const writeStore=tx.objectStore("meta");\n    writeStore.put(keyPair,"e2ee-device-keypair-v1");\n    writeStore.put(identity,"e2ee-device-identity-v1");\n    await txDone(tx);\n    deviceKeyPair=keyPair;\n    return{keyPair,identity};\n  })().catch(err=>{deviceIdentityMaterialPromise=null;throw err;});\n  return deviceIdentityMaterialPromise;\n}\nasync function getOrCreateDeviceKeyPair(){\n  return (await ensureStableDeviceIdentityMaterial()).keyPair;\n}\n'''
          s=s[:start]+replacement+s[end:]

          start=s.index('async function getOrCreateDeviceIdentity(){')
          end=s.index('async function deriveDirectKey', start)
          replacement='''async function getOrCreateDeviceIdentity(){\n  const {keyPair:kp,identity}=await ensureStableDeviceIdentityMaterial();\n  const fingerprint=await publicKeyFingerprint(kp.publicJwk);\n  deviceSecurityInfo={\n    ...identity,\n    publicJwk:kp.publicJwk,\n    fingerprint,\n    label:"FIDUNIO Web device"\n  };\n  return deviceSecurityInfo;\n}\n'''
          s=s[:start]+replacement+s[end:]

          # Serialize duplicate startup publication calls. Publishing the same device
          # stays idempotent, while concurrent callers join one promise.
          start=s.index('async function publishMyE2EEKey(){')
          end=s.index('\n\nfunction beginCloudMessageSubscription', start)
          replacement='''async function publishMyE2EEKey(){\n  if(!firebaseUser)return;\n  if(e2eePublishPromise)return e2eePublishPromise;\n  const publishingUid=firebaseUser.uid;\n  e2eePublishPromise=(async()=>{\n    const identity=await getOrCreateDeviceIdentity();\n    if(!firebaseUser||firebaseUser.uid!==publishingUid)return;\n\n    // Compatibility publication updates the same authenticated account only.\n    await publishCloudE2EEPublicKey(publishingUid,identity.publicJwk);\n\n    // Device registration is idempotent because the stable deviceId is the\n    // Firestore document ID. App restarts/updates update this record; they do\n    // not create a replacement device identity.\n    try{\n      await publishCloudE2EEDevice(publishingUid,identity);\n      myRegisteredDevices=await getCloudUserDevices(publishingUid);\n      deviceRegistryStatus="registered";\n    }catch(err){\n      deviceRegistryStatus=err?.message||String(err);\n      console.warn("Device registry publication failed",err);\n    }\n    if(state.route==="settings")renderSettings();\n  })().finally(()=>{e2eePublishPromise=null;});\n  return e2eePublishPromise;\n}'''
          s=s[:start]+replacement+s[end:]

          anchor='let deviceKeyPair=null;\n'
          if anchor not in s: raise SystemExit('device keypair state anchor missing')
          s=s.replace(anchor,anchor+'let e2eePublishPromise=null;\n',1)
          p.write_text(s)

          # 0.9.5.5 quarantine recovery could replace an already-working active
          # identity during ordinary startup. Disable that automatic overwrite path.
          p=Path('auth-ui-clean.js')
          s=p.read_text()
          block='''  try{\n    const recovery=await recoverVerifiedQuarantinedIdentity(user.uid);\n    if(recovery?.recovered)console.info("FIDUNIO restored the verified pre-v3 E2EE device identity",recovery.deviceId);\n  }catch(err){console.warn("FIDUNIO could not recover the quarantined E2EE identity",err);}\n'''
          if block not in s: raise SystemExit('automatic quarantine recovery block missing')
          s=s.replace(block,'  // Stable-identity invariant: ordinary startup never overwrites the active E2EE identity from quarantine.\n',1)
          p.write_text(s)

          # Visible test version.
          p=Path('version.js')
          s=p.read_text().replace('version: "0.9.5.6"','version: "0.9.5.7"')
          p.write_text(s)

          # Durable project memory.
          p=Path('hermes-memory.txt')
          s=p.read_text()
          marker='CURRENT CRITICAL ARCHITECTURAL DISCOVERY — SEPTEMBER 4, 2026\n'
          note='''PERMANENT E2EE DEVICE-IDENTITY INVARIANT — SEPTEMBER 4, 2026\n- Mandatory reference: `E2EE-IDENTITY-LIFECYCLE.md`.\n- One authenticated FIDUNIO account on one browser installation has one stable E2EE device ID + ECDH keypair.\n- App updates, refreshes, logout/login, reconnects, service-worker updates, and normal account switching MUST NOT rotate or regenerate that identity.\n- A fresh identity is created only when BOTH identity and keypair are absent, or after an explicit user-approved reset/revocation. Partial identity state must fail safely; never silently manufacture a replacement half.\n- Concrete race found in 0.9.5.6: `initializeFirebaseLayer()` can call `publishMyE2EEKey()` twice during startup, while keypair/device creation previously had no shared mutex. Concurrent first-start calls could therefore create competing keys/device IDs.\n- 0.9.5.7 serializes keypair+device-ID creation as one pair and serializes cloud publication. Duplicate startup callers join the same promise.\n- 0.9.5.5 automatic quarantine identity restoration is disabled during ordinary startup because it could replace a valid current identity. Recovery/reset must be explicit.\n- Historical vault/message data is test data and need not be recovered. After 0.9.5.7 identity stability passes, perform one deliberate cleanup of stale cloud device registrations and obsolete local vault/history/Outbox test data, then establish a fresh baseline.\n\n'''
          if note not in s:
            if marker not in s: raise SystemExit('memory insertion anchor missing')
            s=s.replace(marker,note+marker,1)
          p.write_text(s)

          # Bug list / test gate.
          p=Path('BUG-LIST.md')
          s=p.read_text()
          marker='### E2EE historical identity continuity\n'
          note='''### E2EE device identity proliferation / startup race\n- **Root cause confirmed in 0.9.5.6 audit:** `initializeFirebaseLayer()` can request E2EE publication from both the auth-state callback and again after Firebase initialization resolves. The old keypair and device-ID create-if-missing functions were not protected by one initialization mutex, so concurrent first-start callers could generate competing ECDH keypairs/device IDs.\n- This explains the large number of historical device IDs/envelopes seen in the diagnostic.\n- **0.9.5.7 focused prevention build:** creates the keypair + device ID as one serialized pair, blocks silent repair of partial identity state, and serializes duplicate cloud publication. Ordinary startup no longer restores/replaces the active identity from quarantine.\n- Cloud publication remains idempotent for the same device ID; stale historical device cleanup will be a separate explicit reset step after stability validation.\n- Test gate: record the current diagnostic device ID, refresh/reopen several times and sign out/in once; the device ID and fingerprint must remain exactly unchanged and new messages must still send/decrypt/transition to Read.\n- Status: **awaiting iPad/iPhone validation before cleanup/reset.**\n\n'''
          if note not in s:
            if marker not in s: raise SystemExit('bug list insertion anchor missing')
            s=s.replace(marker,note+marker,1)
          p.write_text(s)

          # Runtime recovery plan progress note.
          p=Path('RUNTIME-CONSOLIDATION-PLAN.md')
          s=p.read_text()
          progress='''\n- **0.9.5.7 — E2EE identity safety gate before further transformation:** fixed the startup race that could create multiple device identities and disabled automatic quarantine overwrite. Historical test keys are no longer a recovery requirement; after identity stability validation, perform a controlled test-data/device-registry reset before continuing E2EE-v2 materialization.\n'''
          if progress.strip() not in s:
            s=s.rstrip()+progress
          p.write_text(s)
          PY
      - name: Verify bounded change
        run: |
          grep -q 'ensureStableDeviceIdentityMaterial' app.js
          grep -q 'automatic key rotation is blocked' app.js
          grep -q 'if(e2eePublishPromise)return e2eePublishPromise' app.js
          grep -q 'ordinary startup never overwrites the active E2EE identity from quarantine' auth-ui-clean.js
          grep -q 'version: "0.9.5.7"' version.js
          grep -q 'E2EE-IDENTITY-LIFECYCLE.md' hermes-memory.txt
          git diff --check
          test -z "$(git diff --name-only | grep -E '^(service-worker.js|settings-lifecycle.js|local-security.js)$' || true)"
      - name: Commit stable identity build
        run: |
          git config user.name 'willyros01'
          git config user.email 'willyros01@gmail.com'
          git add app.js auth-ui-clean.js version.js hermes-memory.txt BUG-LIST.md RUNTIME-CONSOLIDATION-PLAN.md
          git commit -m 'Stabilize E2EE device identity lifecycle'
          git push
