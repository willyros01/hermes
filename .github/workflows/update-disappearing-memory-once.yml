name: Repair Group History Rules Test Once
on:
  push:
    branches: [fidunio-complete-rebuild]
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message == 'Run group history rules test repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-complete-rebuild
          fetch-depth: 0
      - name: Repair test chronology
        run: python fix-group-history-rules-test.py
      - name: Commit repair
        run: |
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add firestore-group-e2ee-v1.rules.test.mjs
          git commit -m "Repair group history rules test chronology"
          git push origin HEAD:fidunio-complete-rebuild
