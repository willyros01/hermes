name: Update Disappearing Content Memory Once
on:
  push:
    branches: [fidunio-complete-rebuild]
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message == 'Queue disappearing-content memory update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-complete-rebuild
          fetch-depth: 0
      - name: Append disappearing-content purge requirement
        run: |
          cat >> hermes-memory.txt <<'EOF'

DISAPPEARING CONTENT — NON-NEGOTIABLE PURGE REQUIREMENT
- FIDUNIO must support disappearing messages and disappearing attachments for direct and group conversations.
- When such content expires, every application-controlled trace must be physically purged. This includes the Firestore message document itself, ciphertext/plaintext fields, per-message receipts/references, attachment metadata, encrypted attachment chunks/blobs, thumbnails/previews, notification payload copies, local IndexedDB/history/cache entries, decrypted object URLs, and any Outbox copy.
- Do not implement expiry as hide-only, soft-delete, `expired:true`, or a per-message tombstone. After purge, no application-owned per-message record may remain in Firestore or local app storage.
- Purge must converge across all devices/accounts participating in the direct or group conversation and expired content must not resurrect through stale snapshots, offline state, Outbox replay, cache restoration, or reconnect reconciliation.
- Provider-managed infrastructure outside FIDUNIO application control (for example provider service logs or backups, if enabled) must be separately audited/configured. FIDUNIO itself must never intentionally archive disappearing content after expiry.
EOF
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add hermes-memory.txt
          git commit -m "Record trace-free disappearing content requirement"
          git push origin HEAD:fidunio-complete-rebuild
