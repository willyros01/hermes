name: Disappearing live closeout one-shot
on:
  push:
    paths:
      - '.github/workflows/disappearing-live-closeout.yml'
permissions:
  contents: write
jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reconcile durable docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              s=p.read_text()
              if old not in s:
                  raise SystemExit(f'missing expected anchor in {path}: {old!r}')
              p.write_text(s.replace(old,new,1))

          replace_once('CURRENT-REBUILD.md',
              '**Status: REPOSITORY CANDIDATE; LIVE SCHEDULER DEPLOYMENT REQUIRED.**',
              '**Status: LIVE BACKEND DEPLOYED AND VERIFIED; DEVICE ACCEPTANCE REQUIRED.**')
          replace_once('CURRENT-REBUILD.md',
              'Live Firebase rules/Function/IAM remain unchanged until the reviewed deployment handoff is run and verified.',
              'Live activation completed through the reviewed Cloud Shell handoff. `purgeDisappearingMessagesV1` is ACTIVE in `us-central1` under `fidunio-disappearing-purge@fidunio-fef13.iam.gserviceaccount.com`; scheduler `firebase-schedule-purgeDisappearingMessagesV1-us-central1` exists; reviewed Firestore rules were deployed successfully. Device acceptance is still required before the feature is closed.')

          replace_once('FIDUNIO-BUILD-CHECKLIST.md',
              '- [ ] Deploy/verify reviewed Firestore rules, dedicated purge IAM, and scheduled Function to live `fidunio-fef13`.',
              '- [x] Deploy/verify reviewed Firestore rules, dedicated purge IAM, and scheduled Function to live `fidunio-fef13`. Evidence: Cloud Shell SUCCESS; Function `purgeDisappearingMessagesV1` ACTIVE; dedicated runtime SA verified; scheduler present; Firestore rules deployed.')

          replace_once('hermes-memory.txt',
              'Repository code does not equal live activation: live rules, dedicated purge IAM and scheduled Function must be deployed and verified through the controlled Firebase handoff.',
              'LIVE BACKEND ACTIVATION COMPLETE: reviewed Firestore rules, dedicated purge IAM/runtime identity, and scheduled Function `purgeDisappearingMessagesV1` were deployed and verified through the controlled Cloud Shell handoff. Function state is ACTIVE in `us-central1`; runtime SA is `fidunio-disappearing-purge@fidunio-fef13.iam.gserviceaccount.com`; scheduler `firebase-schedule-purgeDisappearingMessagesV1-us-central1` is present. Do not mark disappearing text fully accepted until the direct/group/unread/offline device matrix passes.')

          replace_once('DISAPPEARING-PURGE-AUTHORITY.md',
              '**STATUS: BINDING REBUILD SECURITY CONTRACT — REPOSITORY FOUNDATION ONLY**',
              '**STATUS: BINDING SECURITY CONTRACT — LIVE TEXT PURGE BACKEND DEPLOYED; DEVICE ACCEPTANCE PENDING**')
          replace_once('DISAPPEARING-PURGE-AUTHORITY.md',
              'This document defines the single physical-deletion ownership boundary for disappearing content. It does not authorize a live Firebase deployment.',
              'This document defines the single physical-deletion ownership boundary for disappearing content. Live text-only activation is now deployed for `disappearingPurgeVersion: 1` through the reviewed server scheduler/Firestore path. Attachments remain intentionally non-disappearing until server Storage trace cleanup satisfies the same source-delete-last contract.')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CURRENT-REBUILD.md FIDUNIO-BUILD-CHECKLIST.md hermes-memory.txt DISAPPEARING-PURGE-AUTHORITY.md
          git commit -m 'Record live disappearing-text backend activation'
          git push origin main
