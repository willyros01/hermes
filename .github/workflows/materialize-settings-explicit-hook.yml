name: Materialize Settings Explicit Hook

on:
  push:
    branches: [fidunio-rebuild-baseline-2026-09-05]
    paths:
      - 'materialize-settings-explicit-hook.mjs'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize Settings explicit lifecycle hook
        run: node materialize-settings-explicit-hook.mjs
      - name: Validate deterministic Settings ownership
        run: |
          node --check app.js
          node --check settings-lifecycle.js
          npm run test:runtime-transform-anchors
          npm run test:runtime-authority
          git diff --check
      - name: Commit explicit Settings hook
        run: |
          git config user.name 'willyros01'
          git config user.email 'willyros01@gmail.com'
          git add app.js runtime-authority-gate.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize explicit Settings lifecycle hook'
          git push
