name: HELP server log read (read-only)
# Owner-approved 25 Nov 2026 08:50: read-only check of the live HELP server log for the 08:39 HELP test.
# Uses the existing read-only audit identity. Reads only; prints no tokens, ids or message text.
on:
  push:
    branches: [simulator-tests]
    paths: [".github/workflows/help-log-read.yml"]
permissions:
  contents: read
  id-token: write
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/130339622893/locations/global/workloadIdentityPools/fidunio-github-audit/providers/hermes-ios-audit
          service_account: fidunio-ci-audit@fidunio-fef13.iam.gserviceaccount.com
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: fidunio-fef13
      - name: HELP functions as deployed
        run: gcloud functions list --regions=us-central1 --format='table(name,state,updateTime)' 2>&1 | grep -i help || echo "cannot list functions"
      - name: HELP server log 13:30-14:30 UTC (08:30-09:30 Toronto)
        run: |
          gcloud logging read 'timestamp>="2026-11-25T13:30:00Z" AND timestamp<="2026-11-25T14:30:00Z" AND (resource.labels.service_name=~"helpalert" OR resource.labels.function_name=~"helpAlert")' \
            --project fidunio-fef13 --limit 300 --order asc \
            --format='value(timestamp,severity,resource.labels.service_name,textPayload,jsonPayload.message,jsonPayload.realerted,jsonPayload.error,httpRequest.status)' 2>&1 \
            | sed -E 's/[A-Za-z0-9_-]{40,}/<long-id>/g' | head -300
      - name: HELP alerts today (fields only, no names or ids)
        run: |
          TOKEN=$(gcloud auth print-access-token)
          curl -s -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            "https://firestore.googleapis.com/v1/projects/fidunio-fef13/databases/(default)/documents:runQuery" \
            -d '{"structuredQuery":{"from":[{"collectionId":"helpAlerts"}],"where":{"fieldFilter":{"field":{"fieldPath":"createdAt"},"op":"GREATER_THAN_OR_EQUAL","value":{"timestampValue":"2026-11-25T13:00:00Z"}}},"limit":20}}' \
          | python3 -c 'import json,sys
          rows=json.load(sys.stdin)
          if isinstance(rows,dict): print("query refused:",rows.get("error",{}).get("status")); sys.exit()
          for r in rows:
            d=r.get("document")
            if not d: continue
            f=d["fields"]; g=lambda k:list(f.get(k,{}).values())[0] if k in f else None
            print("alert created",g("createdAt"),"state",g("state"),"test",g("test"),"helpers",len(f.get("helperUids",{}).get("arrayValue",{}).get("values",[])),
                  "acks",len(f.get("acks",{}).get("mapValue",{}).get("fields",{})),"realertCount",g("realertCount"),"nextAlertAtMs",g("nextAlertAtMs"),"lastAlertAtMs",g("lastAlertAtMs"),
                  "other fields",sorted(k for k in f if k not in ("senderUid","helperUids","state","test","acks","createdAt","realertCount","nextAlertAtMs","lastAlertAtMs")))'
