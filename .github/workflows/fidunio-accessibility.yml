name: FIDUNIO App Store accessibility
on:
  push:
    branches: [fidunio-accessibility]
    paths: ['.github/workflows/fidunio-accessibility.yml']
permissions:
  contents: read
concurrency:
  group: fidunio-app-store-accessibility
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish verified FIDUNIO Dark Interface support
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          node --input-type=module <<'JS'
          import crypto from 'node:crypto';
          const enc = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          for (const name of ['ASC_KEY_ID', 'ASC_ISSUER_ID', 'ASC_KEY_P8']) {
            if (!process.env[name]) throw new Error('Missing secret ' + name);
          }
          const now = Math.floor(Date.now() / 1000);
          const unsigned = enc({alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'}) + '.' +
            enc({iss:process.env.ASC_ISSUER_ID,iat:now,exp:now+900,aud:'appstoreconnect-v1'});
          const signature = crypto.sign('sha256',Buffer.from(unsigned),{
            key:process.env.ASC_KEY_P8,dsaEncoding:'ieee-p1363'
          }).toString('base64url');
          const token = unsigned + '.' + signature;
          async function api(path, method='GET', body) {
            const response = await fetch('https://api.appstoreconnect.apple.com'+path,{
              method, headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
              body:body ? JSON.stringify(body) : undefined
            });
            const result = await response.json();
            if (!response.ok) throw new Error(method+' '+path+' '+response.status+' '+JSON.stringify(result.errors));
            return result;
          }
          const appId = '6818880685';
          const app = (await api('/v1/apps/'+appId)).data;
          if (app.attributes.bundleId !== 'io.github.willyros01.fidunio') throw new Error('Unexpected app');
          console.log('Verified app', app.id, app.attributes.name, app.attributes.bundleId);
          const versions = await api('/v1/apps/'+appId+'/appStoreVersions?filter[platform]=IOS&limit=10');
          console.log('App Store versions', JSON.stringify(versions.data.map(v=>({id:v.id,version:v.attributes.versionString,state:v.attributes.appStoreState}))));
          const declarations = await api('/v1/apps/'+appId+'/accessibilityDeclarations');
          console.log('Accessibility declarations',JSON.stringify(declarations.data));
          if (!versions.data.some(v => v.attributes.versionString === '1.1.81' && ['READY_FOR_SALE','READY_FOR_DISTRIBUTION'].includes(v.attributes.appStoreState))) {
            throw new Error('Expected live 1.1.81 release');
          }
          const desired = {
            supportsDarkInterface:true,
            supportsLargerText:false,
            supportsVoiceover:false,
            supportsVoiceControl:false,
            supportsSufficientContrast:false,
            supportsDifferentiateWithoutColorAlone:false,
            supportsReducedMotion:false,
            supportsCaptions:false,
            supportsAudioDescriptions:false
          };
          for (const deviceFamily of ['IPHONE','IPAD']) {
            const familyDeclarations = declarations.data.filter(d => d.attributes.deviceFamily === deviceFamily);
            let declaration = familyDeclarations.find(d => d.attributes.state === 'DRAFT');
            const published = familyDeclarations.find(d => d.attributes.state === 'PUBLISHED');
            if (!declaration && published) {
              if (!published.attributes.supportsDarkInterface) throw new Error('Existing published declaration requires review');
              console.log('Already published',deviceFamily,JSON.stringify(published.attributes));
              continue;
            }
            if (declaration) {
              if (Object.entries(desired).some(([key,value]) => declaration.attributes[key] !== value)) {
                declaration = (await api('/v1/accessibilityDeclarations/'+declaration.id,'PATCH',{
                  data:{type:'accessibilityDeclarations',id:declaration.id,attributes:desired}
                })).data;
              }
            } else {
              declaration = (await api('/v1/accessibilityDeclarations','POST',{
                data:{type:'accessibilityDeclarations',attributes:{deviceFamily,...desired},
                  relationships:{app:{data:{type:'apps',id:appId}}}}
              })).data;
            }
            console.log('Prepared',deviceFamily,declaration.id,JSON.stringify(declaration.attributes));
            await api('/v1/accessibilityDeclarations/'+declaration.id,'PATCH',{
              data:{type:'accessibilityDeclarations',id:declaration.id,attributes:{publish:true}}
            });
            const confirmed = (await api('/v1/accessibilityDeclarations/'+declaration.id)).data;
            console.log('Confirmed',deviceFamily,JSON.stringify(confirmed.attributes));
            if (!confirmed.attributes.supportsDarkInterface || confirmed.attributes.state !== 'PUBLISHED') {
              throw new Error('Publication not confirmed for '+deviceFamily);
            }
          }
          JS
