name: Item 9 Exact History Timestamp Fix
on:
  push:
    paths:
      - .github/workflows/item9-history-timestamp-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve exact Firestore history timestamps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('e2ee-account-group-runtime.js'); s=p.read_text()
          old='const rows=(Array.isArray(sourceRows)?sourceRows:[]).filter(row=>Number(row?.e2ee)===4&&row?.groupFormat==="fidunio-group-message-v1").map(row=>({row,id:text(row?.id,"Source message ID"),createdAt:asDate(row?.createdAt,"Source message time")})).filter(x=>b.kind==="beginning"||x.createdAt.getTime()>=b.at.getTime()).sort((x,y)=>x.createdAt-y.createdAt||x.id.localeCompare(y.id));if(!rows.length)throw new Error("No current encrypted retained history is available to share for this selection.");'
          new='const rows=(Array.isArray(sourceRows)?sourceRows:[]).filter(row=>Number(row?.e2ee)===4&&row?.groupFormat==="fidunio-group-message-v1").map(row=>({row,id:text(row?.id,"Source message ID"),sourceCreatedAt:row?.createdAt,createdAt:asDate(row?.createdAt,"Source message time")})).filter(x=>b.kind==="beginning"||x.createdAt.getTime()>=b.at.getTime()).sort((x,y)=>x.createdAt-y.createdAt||x.id.localeCompare(y.id));if(!rows.length)throw new Error("No current encrypted retained history is available to share for this selection.");'
          if s.count(old)!=1: raise SystemExit('history source mapping anchor changed')
          s=s.replace(old,new,1)
          old2='copies.push({format:"fidunio-group-history-grant-copy-v1",version:1,groupId:gid,grantId:grant,sourceMessageId:item.id,sourceCreatedAt:item.createdAt,grantorUid:id.uid,grantorKeyId:id.keyId,targetUid:target,targetKeyId:targetKey.keyId,envelope});'
          new2='copies.push({format:"fidunio-group-history-grant-copy-v1",version:1,groupId:gid,grantId:grant,sourceMessageId:item.id,sourceCreatedAt:item.sourceCreatedAt,grantorUid:id.uid,grantorKeyId:id.keyId,targetUid:target,targetKeyId:targetKey.keyId,envelope});'
          if s.count(old2)!=1: raise SystemExit('history copy timestamp anchor changed')
          s=s.replace(old2,new2,1)
          old3='return{grantId:grant,targetUid:target,boundaryKind:b.kind,boundaryAt:b.at,totalCopies:copies.length,firstSharedMessageId:first.sourceMessageId,firstSharedAt:first.sourceCreatedAt};'
          new3='return{grantId:grant,targetUid:target,boundaryKind:b.kind,boundaryAt:b.at,totalCopies:copies.length,firstSharedMessageId:first.sourceMessageId,firstSharedAt:asDate(first.sourceCreatedAt,"First shared message time")};'
          if s.count(old3)!=1: raise SystemExit('history grant return anchor changed')
          p.write_text(s.replace(old3,new3,1))

          p=Path('e2ee-account-group-runtime.test.mjs'); t=p.read_text()
          old='const sourceTime=new Date("2026-09-06T12:00:00Z");authoritativeHistoryRows=[{id:"m1",createdAt:sourceTime,...sent.envelope,senderUid:A.uid}];const grant=await ra.createHistoryGrant({groupId:"g1",grantId:"grant-001",targetUid:C.uid,boundary:{kind:"beginning"},sourceRows:[{id:"forged-local-row",createdAt:new Date(0)}]});ok(historyReadCount===1&&grant.firstSharedMessageId==="m1","history grant selects retained rows through transport authority, not caller rows");ok(grant.totalCopies===1&&historyGrant?.status==="active"&&historyCopies.length===1,"admin creates active message-granular history grant");'
          new='const sourceTime=new Date("2026-09-06T12:00:00Z"),sourceTimestamp={seconds:sourceTime.getTime()/1000,nanoseconds:987654000,toDate:()=>sourceTime};authoritativeHistoryRows=[{id:"m1",createdAt:sourceTimestamp,...sent.envelope,senderUid:A.uid}];const grant=await ra.createHistoryGrant({groupId:"g1",grantId:"grant-001",targetUid:C.uid,boundary:{kind:"beginning"},sourceRows:[{id:"forged-local-row",createdAt:new Date(0)}]});ok(historyReadCount===1&&grant.firstSharedMessageId==="m1","history grant selects retained rows through transport authority, not caller rows");ok(historyGrant?.firstSharedAt===sourceTimestamp&&historyCopies[0]?.sourceCreatedAt===sourceTimestamp,"history grant preserves exact authoritative Firestore timestamp objects");ok(grant.totalCopies===1&&historyGrant?.status==="active"&&historyCopies.length===1,"admin creates active message-granular history grant");'
          if t.count(old)!=1: raise SystemExit('runtime history test anchor changed')
          t=t.replace(old,new,1).replace('console.log("15/15 group runtime assertions passed.");','console.log("16/16 group runtime assertions passed.");',1)
          p.write_text(t)

          Path('version.js').write_text('globalThis.FIDUNIO_RELEASE = Object.freeze({ version: "1.1.49" });\n')
          p=Path('service-worker.js'); sw=p.read_text()
          import re
          sw,n=re.subn(r'const SHELL_REVISION="[^"]+";', 'const SHELL_REVISION="1.1.49-history-grant-exact-timestamp";', sw, count=1)
          if n!=1: raise SystemExit('service worker revision anchor changed')
          p.write_text(sw)

          release='''\n\n## FIDUNIO 1.1.49 — Item 9 exact history timestamp correction\n\nReal-device retest proved 1.1.48 still returned Firestore `Missing or insufficient permissions` for History access → From beginning. Further review found the grant builder converted each authoritative Firestore `createdAt` Timestamp through JavaScript `Date` before writing `firstSharedAt` and copy `sourceCreatedAt`. Firestore history-grant rules intentionally require exact equality with the retained source message timestamp; Date conversion can discard sub-millisecond Timestamp precision and therefore fail the rule even for a valid E2EE-v4 source. 1.1.49 keeps a Date only for local boundary comparison/sorting, while preserving the original authoritative Firestore Timestamp object for all grant/copy writes. The public runtime return remains a Date. No Firestore rules/backend, membership transaction, epoch rotation, message visibility, receipts, notifications, PIN, attachments, deletion, reaction, or normal E2EE send path changed. Device re-acceptance remains required.\n'''
          for name in ['README.md','hermes-memory.txt','FIDUNIO-BUILD-CHECKLIST.md','CURRENT-REBUILD.md']:
              q=Path(name); q.write_text(q.read_text()+release)
          defect='''\n\n### FDA-GROUP-006 follow-up — 1.1.49 exact timestamp repair\n\nThe 1.1.48 source-format filter did not clear the device failure. Root cause review found exact Timestamp authority was being weakened by `Timestamp -> Date -> Timestamp` conversion before history grant writes. Firestore rules compare `firstSharedAt` / `sourceCreatedAt` to the retained source message `createdAt` exactly, so lost sub-millisecond precision can produce the observed generic permission denial. 1.1.49 preserves the original Firestore Timestamp for grant and copy writes and uses a derived Date only for local sorting/boundary checks. Status remains FIX CANDIDATE; repeat From beginning on the same real-device group before any selected-date testing.\n'''
          q=Path('DEVICE-ACCEPTANCE-BUGS.md'); q.write_text(q.read_text()+defect)
          q=Path('TODO.md'); s=q.read_text(); s=s.replace('9. **Add or remove members in an existing group conversation — 1.1.48 HISTORY-GRANT ELIGIBILITY CORRECTION; DEVICE RE-ACCEPTANCE PENDING**','9. **Add or remove members in an existing group conversation — 1.1.49 EXACT HISTORY-TIMESTAMP CORRECTION; DEVICE RE-ACCEPTANCE PENDING**',1); q.write_text(s)
          PY
          node --check e2ee-account-group-runtime.js
          node e2ee-account-group-runtime.test.mjs
      - name: Commit fix
        run: |
          git config user.name "FIDUNIO build"
          git config user.email "actions@users.noreply.github.com"
          git add e2ee-account-group-runtime.js e2ee-account-group-runtime.test.mjs version.js service-worker.js README.md hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md CURRENT-REBUILD.md DEVICE-ACCEPTANCE-BUGS.md TODO.md
          git commit -m "Fix exact Item 9 history timestamps in 1.1.49"
          git push origin HEAD:main
