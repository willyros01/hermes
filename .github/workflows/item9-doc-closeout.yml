name: Item 9 Documentation Closeout
on:
  push:
    paths:
      - .github/workflows/item9-doc-closeout.yml
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile Item 9 release documents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('TODO.md'); s=p.read_text()
          old='9. **Add or remove members in an existing group conversation — 1.1.37 AUTHORITY-RECOVERY CANDIDATE; RULES DEPLOYMENT + DEVICE RE-ACCEPTANCE PENDING**'
          new='9. **Add or remove members in an existing group conversation — 1.1.47 OWNER-MEMBER-PROJECTION CORRECTION; DEVICE RE-ACCEPTANCE PENDING**'
          if old not in s: raise SystemExit('TODO item 9 anchor changed')
          s=s.replace(old,new,1)
          old2='Deploy the corrected rules and complete new/re-added-member iPhone/iPad acceptance before re-closing item 9.'
          new2='The corrected 1.1.37 rules were already carried into the later successful 1.1.43 Firestore-rules deployment. Final device acceptance passed Add Member and join-time-history messaging, then FDA-GROUP-005 exposed an owner-side projection defect: owner Group Info showed 0 members while the newly added member showed the full list. FIDUNIO 1.1.47 prevents an incomplete server-authority shell (`members: []`) from erasing an already-populated subscribed member projection. Complete remove/re-add and PIN/background re-acceptance before closing item 9.'
          if old2 in s: s=s.replace(old2,new2,1)
          s=s.replace('item 9 remains reopened by FDA-GROUP-003/FDA-GROUP-004 until the 1.1.37 authority-recovery rules are deployed and device re-acceptance passes.','item 9 remains open for FDA-GROUP-005 device re-acceptance after the 1.1.47 owner-member-projection correction. The corrected group rules are already deployed.',1)
          p.write_text(s)

          defect='''\n\n## FDA-GROUP-005 — owner Group Info member projection erased by incomplete authority shell\n\n- **Build/device:** FIDUNIO 1.1.46 during final Item 9 device acceptance.\n- **Observed:** Add Member and join-time-history/bidirectional messaging passed. Immediately afterward, the owner Group Info displayed 0 members, while the newly added member Group Info correctly listed all current members. Testing stopped before remove/re-add.\n- **Expected:** every current member device keeps the authoritative subscribed member projection; a server lookup that intentionally does not load the member directory must not replace it with an empty placeholder.\n- **Cause:** `getCloudGroupFromServer()` intentionally returns an authority shell with `members: []`; `mergeCloudGroup()` treated that incomplete shell as authoritative and overwrote the owner conversation's populated member projection.\n- **Repair allocation:** FIDUNIO 1.1.47. `mergeCloudGroup()` now preserves the existing subscribed member list when the incoming authority shell is empty. A genuine non-empty subscribed member projection can still replace it normally.\n- **Protected boundaries:** no membership transaction, E2EE epoch rotation, join-time history rule, Firestore rule, message, receipt, notification, PIN, attachment, delete, or backend owner changes.\n- **Status:** FIX CANDIDATE — device re-acceptance required.\n- **Exit:** owner and member Group Info both show the complete member list after add/message/receipt activity; remove, re-add, join-time boundary, and PIN/background tests then pass.\n'''
          p=Path('DEVICE-ACCEPTANCE-BUGS.md'); p.write_text(p.read_text()+defect)

          release='''\n\n## FIDUNIO 1.1.47 — Item 9 owner member-projection correction\n\nFinal Item 9 device acceptance passed Add Member and join-time-history messaging, then exposed FDA-GROUP-005: owner Group Info showed zero members while the newly added member showed the complete list. The membership/epoch authority remained intact. The defect was a projection overwrite: `getCloudGroupFromServer()` intentionally returns `members: []`, and `mergeCloudGroup()` allowed that incomplete server-authority shell to replace the existing subscribed member directory. 1.1.47 preserves an existing populated member projection when the incoming shell is empty; genuine non-empty subscription results still replace it. Targeted syntax and group-membership lifecycle regression checks passed before publication. No Firebase rules/backend, E2EE epoch, membership transaction, history grant, messaging, receipt, notification, PIN, attachment, or deletion authority changed. Device re-acceptance remains required before closing TODO Item 9.\n'''
          for name in ['README.md','hermes-memory.txt','FIDUNIO-BUILD-CHECKLIST.md','CURRENT-REBUILD.md']:
              p=Path(name); p.write_text(p.read_text()+release)
          PY
      - name: Commit documentation
        run: |
          git config user.name "FIDUNIO build"
          git config user.email "actions@users.noreply.github.com"
          git add TODO.md DEVICE-ACCEPTANCE-BUGS.md README.md hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md CURRENT-REBUILD.md
          git commit -m "Document Item 9 projection defect and 1.1.47 correction"
          git push origin HEAD:main
