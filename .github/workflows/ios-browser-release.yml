name: iOS browser release regressions
on:
  push:
    branches: [ios]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run ios:prepare
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run isolated real browser release regressions
        env:
          TEST_BROWSER: ${{ matrix.browser }}
        run: node build/ios-browser-release.test.mjs
      - name: Save release regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-release-${{ matrix.browser }}
          path: browser-release-evidence/
