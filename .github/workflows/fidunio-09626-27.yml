name: FIDUNIO 0.9.6.26-27 materialize
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fidunio-complete-rebuild}
      - run: python .fidunio-09626-27.py
      - run: node disappearing-multi-device-convergence.test.mjs
      - run: node disappearing-compose-policy.test.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js version.js
          git diff --cached --quiet || git commit -m "Build FIDUNIO 0.9.6.26 and 0.9.6.27"
          git push
