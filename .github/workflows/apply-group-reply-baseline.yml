name: Integrate Group Reply Baseline
on:
  push:
    branches: [main]
    paths:
      - patch-group-reply-baseline.py
      - .github/workflows/apply-group-reply-baseline.yml
permissions:
  contents: write
  actions: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch permanent baseline
        run: python3 patch-group-reply-baseline.py
      - name: Verify focused reply gate
        run: npm run test:group-reply
      - name: Commit permanent gate integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Gate FIDUNIO group message replies"
          git push origin main
      - name: Dispatch full baseline against final head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rebuild-baseline-security.yml --ref main
