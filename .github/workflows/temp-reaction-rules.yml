name: Temporary reaction rules
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-reaction-rules.yml'
permissions:
  contents: write
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts
      - name: Apply rules patch
        run: python3 .github/reaction-rules-patch.py
      - name: Direct rules emulator
        run: npm run emulator:test:account-message-rules
      - name: Group rules emulator
        run: npm run emulator:test:group-e2ee-rules
      - name: Publish rules candidate
        run: |
          rm -f .github/reaction-rules-patch.py .github/workflows/temp-reaction-rules.yml
          git diff --check
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Secure FIDUNIO 1.1.43 message reactions"
          git push origin HEAD:main
