name: FIDUNIO 0.9.6.23 final docs
on:
  push:
    branches: [fidunio-complete-rebuild]
    paths: ['.fidunio-09623-final-docs-trigger']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-complete-rebuild
      - name: Reconcile final 0.9.6.23 docs
        run: python .fidunio-09623-final-docs.py
      - name: Commit docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md CURRENT-REBUILD.md DISAPPEARING-PURGE-AUTHORITY.md
          git diff --cached --quiet || git commit -m "Finalize 0.9.6.23 documentation"
          git push
