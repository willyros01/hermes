name: FIDUNIO 0.9.6.24 docs
on:
  push:
    branches: [fidunio-complete-rebuild]
    paths: ['.fidunio-09624-docs-trigger']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fidunio-complete-rebuild}
      - run: python .fidunio-09624-docs.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md CURRENT-REBUILD.md DISAPPEARING-PURGE-AUTHORITY.md
          git diff --cached --quiet || git commit -m "Close FIDUNIO 0.9.6.24 documentation"
          git push
