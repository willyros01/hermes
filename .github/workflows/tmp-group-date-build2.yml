name: Temporary group date separator build retry
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-group-date-build2.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded 0.9.9.14 build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def rep(path,old,new,count=1):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'anchor missing: {path}')
              p.write_text(s.replace(old,new,count))
          p=Path('app.js'); s=p.read_text()
          anchor='''function groupSenderDisplayName(m,c){\n  if(c?.type!=="group"&&!c?.cloudGroup)return "";\n  const senderUid=String(m?.senderUid||(m?.mine?firebaseUser?.uid:"")||"");\n  const member=(Array.isArray(c?.members)?c.members:[]).find(row=>String(row?.id||row?.uid||"")===senderUid);\n  return member?.name||m?.sender||(m?.mine?"You":"FIDUNIO member");\n}\n\nfunction renderBubble(m,c){'''
          new='''function groupSenderDisplayName(m,c){\n  if(c?.type!=="group"&&!c?.cloudGroup)return "";\n  const senderUid=String(m?.senderUid||(m?.mine?firebaseUser?.uid:"")||"");\n  const member=(Array.isArray(c?.members)?c.members:[]).find(row=>String(row?.id||row?.uid||"")===senderUid);\n  return member?.name||m?.sender||(m?.mine?"You":"FIDUNIO member");\n}\n\nfunction messageCalendarDate(value){\n  const d=value instanceof Date?value:value?.toDate?.()||new Date(value);\n  return d instanceof Date&&!Number.isNaN(d.getTime())?d:null;\n}\nfunction messageDayKey(value){\n  const d=messageCalendarDate(value);\n  return d?`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`:"";\n}\nfunction messageDayLabel(value){\n  const d=messageCalendarDate(value);\n  return d?new Intl.DateTimeFormat("en-US",{month:"long",day:"numeric",year:"numeric"}).format(d):"";\n}\nfunction renderConversationMessages(msgs,c){\n  if(c?.type!=="group"&&!c?.cloudGroup)return msgs.map(m=>renderBubble(m,c)).join("");\n  let priorDay="";\n  return msgs.map(m=>{\n    const day=m?.system?"":messageDayKey(m?.createdAt);\n    const separator=day&&day!==priorDay?`<div class="chat-date-separator"><span>${esc(messageDayLabel(m.createdAt))}</span></div>`:"";\n    if(day)priorDay=day;\n    return separator+renderBubble(m,c);\n  }).join("");\n}\n\nfunction renderBubble(m,c){'''
          if anchor not in s: raise SystemExit('group sender anchor missing')
          s=s.replace(anchor,new,1)
          s=s.replace('<section class="chat" id="chatArea">${msgs.map(m=>renderBubble(m,c)).join("")}</section>','<section class="chat" id="chatArea">${renderConversationMessages(msgs,c)}</section>',1)
          s=s.replace('    time:nowTime(),\n    state:(state.online && (!cloud || firebaseUser))?"sending":"queued",','    time:nowTime(),\n    createdAt:new Date(),\n    state:(state.online && (!cloud || firebaseUser))?"sending":"queued",',1)
          s=s.replace('const stagedMessage=stampOutgoingDisappearSelection({id:messageId,mine:true,text:previewText,time:nowTime(),state:"sending",cloud:true,attachment:{kind,name:originalName,type:originalType,size:file.size}},state.settings.disappearingTextSeconds??null);','const stagedMessage=stampOutgoingDisappearSelection({id:messageId,mine:true,text:previewText,time:nowTime(),createdAt:new Date(),state:"sending",cloud:true,attachment:{kind,name:originalName,type:originalType,size:file.size}},state.settings.disappearingTextSeconds??null);',1)
          p.write_text(s)
          css=Path('styles.css'); c=css.read_text(); c+='''\n\n/* 0.9.9.14 group date separators */\n.chat-date-separator{display:flex;align-items:center;gap:12px;margin:18px 4px 14px;color:var(--muted,#8a969b);font-size:.88rem;font-weight:700;letter-spacing:.01em;clear:both}\n.chat-date-separator::before,.chat-date-separator::after{content:"";height:1px;background:currentColor;opacity:.32;flex:1}\n.chat-date-separator span{white-space:nowrap}\n'''; css.write_text(c)
          rep('version.js','version: "0.9.9.13"','version: "0.9.9.14"')
          rep('service-worker.js','SHELL_REVISION="0.9.9.13-group-sender-label"','SHELL_REVISION="0.9.9.14-group-date-separators"')
          for f in ['outbox-reconciliation-boundary.test.mjs','direct-message-basic-path.test.mjs']:
              q=Path(f); q.write_text(q.read_text().replace('0.9.9.13-group-sender-label','0.9.9.14-group-date-separators'))
          Path('group-date-separator.test.mjs').write_text('''import assert from "node:assert/strict";\nimport {readFileSync} from "node:fs";\nconst app=readFileSync("app.js","utf8"),css=readFileSync("styles.css","utf8");\nassert.ok(app.includes('function renderConversationMessages(msgs,c)'));\nassert.ok(app.includes('messageDayKey(m?.createdAt)'));\nassert.ok(app.includes('month:"long",day:"numeric",year:"numeric"'));\nassert.ok(app.includes('renderConversationMessages(msgs,c)'));\nassert.ok(app.includes('createdAt:new Date()'));\nassert.ok(css.includes('.chat-date-separator::before,.chat-date-separator::after'));\nassert.ok(app.includes('<div class="msg-meta"><span>${esc(m.time)}</span>'));\nconsole.log("Group date separator gate passed");\n''')
          prefixes={
          'CURRENT-REBUILD.md':'### GROUP DATE SEPARATOR CANDIDATE — 0.9.9.14\n\nGroup conversations now insert a centered `Month D, YYYY` date demarcation with horizontal lines before the first visible dated message and whenever the next message falls on a different local calendar day. Individual messages continue to show time only. The accepted 0.9.9.13 sender-name labels remain unchanged. This is presentation-only: no Firebase, E2EE, receipt, Outbox, disappearing-content, attachment, or membership authority changed.\n\n',
          'hermes-memory.txt':'GROUP DATE SEPARATOR CANDIDATE (0.9.9.14): Group chats render a horizontal-line date demarcation (`Month D, YYYY`) at the first visible dated message and each calendar-day change. Every individual message retains its existing time-only metadata. Sender-name labels remain unchanged. Date grouping uses projected `createdAt`; optimistic outgoing rows receive a local `createdAt` immediately. No send/E2EE/Firebase authority changed.\n\n',
          'DEVICE-ACCEPTANCE-BUGS.md':'## Group date separators — 0.9.9.14\n\n**Status: DEVICE CANDIDATE.** Confirm on iPhone/iPad that a line-and-date separator appears between different calendar dates, the date is `Month D, YYYY`, every message still shows time only, same-day messages do not repeat the date, sender-name labels remain correct, and reopen preserves the layout.\n\n'}
          for f,x in prefixes.items(): q=Path(f); q.write_text(x+q.read_text())
          q=Path('FIDUNIO-BUILD-CHECKLIST.md'); t=q.read_text(); old='- [ ] **Group chat sender label — 0.9.9.13 candidate:** implementation and permanent regression gate complete; sender UID resolves through the existing group member projection; direct-message bubbles unchanged. Pending iPhone/iPad device acceptance.\n'; new='- [x] **Group chat sender label — 0.9.9.13:** device evidence confirmed sender names display correctly across tested group devices; the one observed reconciliation timeout subsequently completed delivery after Close and a repeat send from another device completed normally.\n- [ ] **Group date separators — 0.9.9.14 candidate:** horizontal-line `Month D, YYYY` demarcation at group calendar-day boundaries while every message keeps time only; pending iPhone/iPad device acceptance.\n';
          if old not in t: raise SystemExit('checklist anchor missing')
          q.write_text(t.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js styles.css version.js service-worker.js group-date-separator.test.mjs CURRENT-REBUILD.md hermes-memory.txt DEVICE-ACCEPTANCE-BUGS.md FIDUNIO-BUILD-CHECKLIST.md outbox-reconciliation-boundary.test.mjs direct-message-basic-path.test.mjs
          git commit -m "Add group date separators"
          git push
