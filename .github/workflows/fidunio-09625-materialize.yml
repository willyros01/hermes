name: FIDUNIO 0.9.6.25 materialize
on:
  push:
    branches: [fidunio-complete-rebuild]
    paths: ['.fidunio-09625-trigger']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fidunio-complete-rebuild}
      - run: python .fidunio-09625-materialize.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js firebase.js package.json version.js
          git diff --cached --quiet || git commit -m "Materialize FIDUNIO 0.9.6.25 reconnect barrier"
          git push
