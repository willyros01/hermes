name: Temporary reaction patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-reaction-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 .github/reaction-patch.py
      - name: Syntax and policy checks
        run: |
          node --check app.js
          node --check firebase.js
          node --check e2ee-account-group-conversation.js
          node --check message-reaction-policy.js
          git diff --check
      - name: Publish patch
        run: |
          rm -f .github/reaction-patch.py .github/workflows/temp-reaction-patch.yml
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Wire FIDUNIO 1.1.43 message reactions"
          git push origin HEAD:main
