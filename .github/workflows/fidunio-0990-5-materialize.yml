name: FIDUNIO 0.9.9.0-0.9.9.5 Materialize
on:
  push:
    branches: [fidunio-complete-rebuild]
    paths: [.fidunio-0990-5-trigger]
permissions: {contents: write}
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fidunio-complete-rebuild, fetch-depth: 0}
      - run: python .fidunio-0990-5-materialize.py
      - run: node release-candidate-ui.test.mjs
      - run: |
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add app.js styles.css release-candidate-ui.test.mjs package.json version.js
          git commit -m "Build FIDUNIO 0.9.9.0 through 0.9.9.5 candidate"
          git push origin HEAD:fidunio-complete-rebuild
