name: Finalize v3 Documentation
on:
  push:
    branches: [fidunio-rebuild-baseline-2026-09-05]
    paths: [.github/workflows/finalize-v3-docs.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-rebuild-baseline-2026-09-05
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node finalize-v3-docs.mjs
      - run: rm finalize-v3-docs.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record account E2EE v3 validated repository checkpoint"
          git push
