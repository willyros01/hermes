name: FIDUNIO input probe (released vs fix branch)

# INVESTIGATION + FIX CHECK (Willy, 24 Nov 2026). Same steps on the released
# FIDUNIO and on the fix branches, Android emulator (Pixel) and iPhone simulator.
# Disposable debug apps, local demo Firebase only. No release, no production.
on:
  push:
    branches: [simulator-tests]
    paths:
      - 'build/probe/**'
      - '.github/workflows/input-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fidunio-input-probe
  cancel-in-progress: true

jobs:
  # build/probe/PLATFORMS lists which platforms a push re-runs (avoids repeating passed runs).
  plan:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.p.outputs.android }}
      ios: ${{ steps.p.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          # PLATFORMS lines: android-released android-fix ios-released ios-fix
          P="$(cat build/probe/PLATFORMS 2>/dev/null || echo 'android-released android-fix ios-released ios-fix')"
          mk(){ out="["; sep=""; for l in released fix; do case " $P " in *" $1-$l "*) r=$2; [ $l = fix ] && r=$3; out="$out$sep{\"label\":\"$l\",\"ref\":\"$r\"}"; sep=",";; esac; done; echo "$out]"; }
          echo "android=$(mk android Android fix/nov24-android)" >> "$GITHUB_OUTPUT"
          echo "ios=$(mk ios ios fix/nov24-ios)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
  android:
    needs: plan
    if: needs.plan.outputs.android != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.android) }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: willyros01/hermes
          ref: ${{ matrix.ref }}
          path: app-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build disposable Android app (${{ matrix.label }})
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          cd app-src
          echo "Source ${{ matrix.ref }}: $(git rev-parse HEAD)"
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund @capacitor/android@8.5.2
          npm run ios:prepare
          node ../build/simulator/patch-sandbox.mjs . android
          npx cap add android
          npx cap sync android
          if [ -f build/install-fidunio-input.mjs ]; then node build/install-fidunio-input.mjs; fi
          node ../build/simulator/permit-emulator-http.mjs .
          java build/AndroidIcons.java icon-512.png android/app/src/main/res
          chmod +x android/gradlew
          ( cd android && ./gradlew --no-daemon assembleDebug )
      - name: Permit hardware-assisted Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probe on Pixel emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          script: bash build/probe/run.sh android out-probe app-src/android/app/build/outputs/apk/debug/app-debug.apk ${{ matrix.label }}
      - name: Publish evidence to the probe-evidence branch
        if: always()
        run: |
          set -Eeuo pipefail
          test -d out-probe || exit 0
          D="$RUNNER_TEMP/ev"; rm -rf "$D"; mkdir -p "$D"; cd "$D"; git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          for i in 1 2 3 4 5; do
            rm -rf ./* .git/index 2>/dev/null || true
            if git fetch -q --depth 1 origin probe-evidence; then git checkout -q -B probe-evidence FETCH_HEAD; else git checkout -q --orphan probe-evidence; fi
            rm -rf "android-${{ matrix.label }}"; mkdir -p "android-${{ matrix.label }}"
            cp -R "$GITHUB_WORKSPACE/out-probe/." "android-${{ matrix.label }}/"
            rm -f android-${{ matrix.label }}/native-fixture.json android-${{ matrix.label }}/*.log
            git add -A && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "[skip ci] probe evidence run ${{ github.run_id }} android ${{ matrix.label }}" || true
            git push -q origin HEAD:probe-evidence && break; sleep $((i*3))
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-android-${{ matrix.label }}
          path: out-probe/
          retention-days: 90

  ios:
    needs: plan
    if: needs.plan.outputs.ios != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.ios) }}
    runs-on: macos-26
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: willyros01/hermes
          ref: ${{ matrix.ref }}
          path: ios-src
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build disposable iPhone app (${{ matrix.label }})
        run: |
          set -Eeuo pipefail
          brew install ios-webkit-debug-proxy
          brew tap facebook/fb
          brew trust --formula facebook/fb/idb-companion
          brew install facebook/fb/idb-companion
          python3 -m pip install --break-system-packages --quiet fb-idb
          npm ci --no-audit --no-fund
          cd ios-src
          echo "Source ${{ matrix.ref }}: $(git rev-parse HEAD)"
          npm ci --no-audit --no-fund
          npm run ios:prepare
          node ../build/simulator/patch-sandbox.mjs . ios
          npx cap add ios
          npx cap sync ios
          node ../build/simulator/patch-ios-key-clone.mjs ios/App/App/public
          plutil -replace NSFaceIDUsageDescription -string 'Test FIDUNIO simulator' ios/App/App/Info.plist
          plutil -replace NSCameraUsageDescription -string 'Test FIDUNIO simulator camera' ios/App/App/Info.plist
          UDID="$(xcrun simctl list devices available -j | node -e 'const d=JSON.parse(require("fs").readFileSync(0)).devices;const all=Object.entries(d).filter(([rt])=>/iOS/.test(rt)).flatMap(([,list])=>list);const pick=all.reverse().find(x=>/^iPhone \d+$/.test(x.name));if(!pick)process.exit(1);console.log(pick.udid)')"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/xcb.log" 2>&1 || { tail -60 "$RUNNER_TEMP/xcb.log"; exit 1; }
      - name: Boot iPhone, Web Inspector and touch layer
        run: |
          set -Eeuo pipefail
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          SOCKET="$(lsof -aUc launchd_sim 2>/dev/null | grep -o '/private/tmp/com.apple.launchd[^ ]*/com.apple.webinspectord_sim.socket' | head -1)"
          test -n "$SOCKET"
          mkdir -p out-probe
          nohup ios_webkit_debug_proxy -s "unix:$SOCKET" -F > out-probe/inspector.log 2>&1 &
          idb connect "$UDID" || true
          sleep 3
      - name: Probe on iPhone simulator
        run: |
          APP="$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name App.app | head -1)"
          bash build/probe/run.sh ios out-probe "$APP" ${{ matrix.label }}
      - name: Publish evidence to the probe-evidence branch
        if: always()
        run: |
          set -Eeuo pipefail
          test -d out-probe || exit 0
          D="$RUNNER_TEMP/ev"; rm -rf "$D"; mkdir -p "$D"; cd "$D"; git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          for i in 1 2 3 4 5; do
            rm -rf ./* .git/index 2>/dev/null || true
            if git fetch -q --depth 1 origin probe-evidence; then git checkout -q -B probe-evidence FETCH_HEAD; else git checkout -q --orphan probe-evidence; fi
            rm -rf "ios-${{ matrix.label }}"; mkdir -p "ios-${{ matrix.label }}"
            cp -R "$GITHUB_WORKSPACE/out-probe/." "ios-${{ matrix.label }}/"
            rm -f ios-${{ matrix.label }}/native-fixture.json ios-${{ matrix.label }}/*.log
            git add -A && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "[skip ci] probe evidence run ${{ github.run_id }} ios ${{ matrix.label }}" || true
            git push -q origin HEAD:probe-evidence && break; sleep $((i*3))
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-ios-${{ matrix.label }}
          path: out-probe/
          retention-days: 90
