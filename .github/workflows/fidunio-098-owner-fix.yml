name: FIDUNIO Invitation Owner Cleanup
on: {push: {branches: [fidunio-complete-rebuild], paths: [.fidunio-098-owner-fix-trigger]}}
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fidunio-complete-rebuild, fetch-depth: 0}
      - run: python .fidunio-098-owner-fix.py
      - run: npm run test:invitation-install-closeout
      - run: |
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add settings-lifecycle.js invitation-install-closeout.test.mjs
          git commit -m "Keep invitation writes on one serialized owner"
          git push origin HEAD:fidunio-complete-rebuild
