name: FIDUNIO HELP backend tests
# HELP server logic and database rules, on the local Firestore emulator only.
on:
  push:
    branches: [fix/nov24-android]
    paths: ['functions-help/**','firestore-help.rules','firestore-help.rules.test.mjs','build/merge-help-rules.mjs','.github/workflows/help-backend-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  help:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: HELP server logic
        run: node functions-help/help-core.test.mjs
      - name: HELP rules on the Firestore emulator
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          node build/merge-help-rules.mjs firestore.rules firestore-help.rules /tmp/merged.rules
          HELP_RULES=/tmp/merged.rules ./node_modules/.bin/firebase emulators:exec --only firestore --project demo-fidunio-help-rules "node firestore-help.rules.test.mjs"
