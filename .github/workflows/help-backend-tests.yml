name: FIDUNIO HELP backend tests
# HELP server logic and database rules, on the local Firestore emulator only.
on:
  push:
    branches: [fix/nov24-android]
    paths: ['functions-help/**','firestore.rules','firestore-help.rules','firestore-help.rules.test.mjs','build/merge-help-rules.mjs','.github/workflows/help-backend-tests.yml','functions-help/package-lock.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  help:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: HELP server logic
        run: node functions-help/help-core.test.mjs
      - name: HELP functions install and load
        run: |
          npm --prefix functions-help ci --ignore-scripts --no-audit --no-fund
          node --input-type=module -e "const m=await import('./functions-help/index.mjs');for(const n of ['helpAlertCreatedV1','helpAlertUpdatedV1','helpAlertSweepV1'])if(typeof m[n]!=='function')throw new Error('missing '+n);console.log('PASS: HELP functions load')"
      - name: HELP rules on the Firestore emulator
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          # Since 25 Nov the full rules file already carries the HELP block: it must equal firestore-help.rules.
          node -e "const fs=require('fs');const r=fs.readFileSync('firestore.rules','utf8'),h=fs.readFileSync('firestore-help.rules','utf8');if(!r.includes(h))throw new Error('firestore.rules HELP block differs from firestore-help.rules');console.log('PASS: HELP block in firestore.rules matches')"
          HELP_RULES=firestore.rules ./node_modules/.bin/firebase emulators:exec --only firestore --project demo-fidunio-help-rules "node firestore-help.rules.test.mjs"
