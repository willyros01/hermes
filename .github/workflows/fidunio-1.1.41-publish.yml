name: FIDUNIO 1.1.41 exact-tree publisher

on:
  push:
    branches: [main]
    paths:
      - 'fidunio-1.1.41.patch.part1'
      - 'fidunio-1.1.41.patch.part2'
      - 'fidunio-1.1.41.patch.part3'
      - 'fidunio-1.1.41.patch.part4'
      - '.github/workflows/fidunio-1.1.41-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout transport commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm expected 1.1.40 base
        run: |
          set -euo pipefail
          grep -F 'version: "1.1.40"' version.js
          test "$(git hash-object firebase-config.js)" = "b81026dcc07b7374d1f48d0cb094764ce28319bd"
          test ! -e config-firestore.js

      - name: Apply exact tested 1.1.41 patch
        run: |
          set -euo pipefail
          cat fidunio-1.1.41.patch.part{1,2,3,4} | base64 -d | gunzip > /tmp/fidunio-1.1.41.patch
          git apply --check /tmp/fidunio-1.1.41.patch
          git apply /tmp/fidunio-1.1.41.patch

      - name: Verify exact candidate blob hashes
        run: |
          set -euo pipefail
          verify() { test "$(git hash-object "$1")" = "$2" || { echo "HASH MISMATCH: $1"; exit 1; }; }
          verify ATTACHMENT-AUTHORITY.md 2230e2d2ebb8d48776efbe487a64b654f390e316
          verify CURRENT-REBUILD.md 747639f621d2b9249efc8d4bcc9a7e65146ef3e5
          verify DEVICE-ACCEPTANCE-BUGS.md 617b1a36b417228acff97a0848ab28359d67a8fb
          verify FIDUNIO-BUILD-CHECKLIST.md 291c288bae10f32bfcf1550fdc6a8f08585d60d8
          verify INVITATION-INSTALL-AUTHORITY.md 5895c7dfac75292fc662c897af27e3de702887ce
          verify README.md e7ca9e95deefd7525126b0847797449f81790151
          verify TODO.md 8a61bb9e2b4ef5e4b6de591e27f20587c7b94e50
          verify app.js cf0b76faf23ed53d0a0b490a4c478bdade2b91ea
          verify attachment-ui-wiring.test.mjs 9ecd626e5be6bb940c7a17664fcd983107a08ff1
          verify direct-message-basic-path.test.mjs d6719ae17393c60873d02ea7d04fac5ace66d445
          verify hermes-memory.txt b101633749e4d69fb9528f06c511559751556679
          verify invitation-letter-restoration.test.mjs 415bdc935ec0907300d6801be67689e955d54d95
          verify large-attachment-network-policy.js abf44491baa224357d02fabbaaa1f194325b47bd
          verify large-attachment-network-policy.test.mjs caad835df053e75315a060f22d76e473bb74ca82
          verify notification-n3.test.mjs 7d5465c2ebb066da20756ac532f8a4ada5ab7cc0
          verify notification-n4.test.mjs 4c8816e1e7a01851b2fb62c740695e6205413091
          verify notification-n5.test.mjs 0d406c8cd71b271cbe90d1f24e343c1ddf1d2894
          verify notification-priority-delivery.test.mjs 86e0742deb19f634ce5f7bccfc8cd87a5ab69763
          verify optimistic-outgoing-projection.test.mjs 84fc7c9640dac4da01c2ba0331296901a259e110
          verify outbox-reconciliation-boundary.test.mjs 3d978230ad46fec4b126091990be67a979061a8c
          verify pin-attachment-forward-progress.test.mjs 47135e4ac02c160aaca61edd398ec74797fa0f1f
          verify service-worker.js d763ab4545037953b22b0392f468ac66a18eef2a
          verify version.js 789e4ea6f02e13ab9ffb2767c081588ca3b6d963
          verify .github/workflows/rebuild-baseline-security.yml a12e507cf1644f4ef0a45fd2091ae10570c835ee
          test "$(git hash-object firebase-config.js)" = "b81026dcc07b7374d1f48d0cb094764ce28319bd"
          test ! -e config-firestore.js

      - name: Re-run focused publication checks
        run: |
          set -euo pipefail
          node --check app.js
          node --check service-worker.js
          node --check large-attachment-network-policy.js
          node --check large-attachment-network-policy.test.mjs
          node large-attachment-network-policy.test.mjs
          node attachment-ui-wiring.test.mjs
          node direct-message-basic-path.test.mjs
          node invitation-letter-restoration.test.mjs

      - name: Remove transport and commit exact candidate
        run: |
          set -euo pipefail
          rm -f fidunio-1.1.41.patch.part{1,2,3,4} .github/workflows/fidunio-1.1.41-publish.yml
          git add -A
          git config user.name "willyros01"
          git config user.email "willyros01@gmail.com"
          git commit -m "Enforce large attachment network preference"
          git push origin HEAD:main
