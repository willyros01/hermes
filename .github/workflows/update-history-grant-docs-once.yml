name: Update History Grant Docs Once
on:
  push:
    branches: [fidunio-complete-rebuild]
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message == 'Queue history grant documentation reconciliation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-complete-rebuild
          fetch-depth: 0
      - name: Reconcile durable docs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('FIDUNIO-BUILD-CHECKLIST.md'); s=p.read_text()
          s=s.replace('| Group history policy/admin controls | IN PROGRESS | `historyPolicy:"fromJoin"` contract exists; real management UI/backend controls unfinished. |','| Group history policy/admin controls | IN PROGRESS | Date/message-bounded earlier-history policy approved; isolated per-message account-E2EE grant crypto is gated. Firestore schema/rules/runtime/UI and purge linkage remain unfinished. |')
          s=s.replace('| Group Info real management UI | IN PROGRESS | Rename/add/remove/leave are real; explicit earlier-history/admin-role controls and unrelated tool placeholders remain. |','| Group Info real management UI | IN PROGRESS | Rename/add/remove/leave are real. Earlier-history grant policy + crypto foundation exist, but the control remains disabled until schema/rules/runtime/purge validation. Admin-role controls and unrelated placeholders remain. |')
          s=s.replace('- 2026-09-06 — Group administration validation checkpoint: materializer group runtime/app/rules/authority tests passed, then full Rebuild Baseline Security Gate run `34045259037` passed on the cleaned authoritative branch. Temporary group-administration materializer/trigger workflows were removed.','- 2026-09-06 — Group administration validation checkpoint: materializer group runtime/app/rules/authority tests passed, then full Rebuild Baseline Security Gate run `34045259037` passed on the cleaned authoritative branch. Temporary group-administration materializer/trigger workflows were removed.\n- 2026-09-06 — Earlier-history grant foundation: user approved an admin-selected starting point/date including Beginning of conversation. `e2ee-account-group-history-crypto.js` now provides message-granular account-to-account grant encryption so a date boundary never requires disclosure of an entire historical epoch. Dedicated crypto tests are part of the security gate. Overall first-rebuild estimate remains approximately 65% until Firestore/runtime/UI/purge integration completes.')
          p.write_text(s)
          p=Path('RUNTIME-AUTHORITY-MAP.md'); s=p.read_text(); s+='''\n\n## Group earlier-history grant foundation — 2026-09-06\n- `e2ee-account-group-history-crypto.js`: isolated message-granular grant cryptographic transform only.\n- Existing group runtime remains the only authorized path that may decrypt source group messages; the grant crypto owner never reads Firestore or epochs itself.\n- Future grant creation path remains `app.js intent -> group app controller -> serialized group runtime/service -> firebase.js opaque persistence`.\n- Historical epoch keys are never handed to the target merely to satisfy a date boundary.\n- Group Info history-grant UI remains disabled until Firestore schema/rules, runtime integration, source-boundary selection, purge linkage and emulator tests are green.\n'''; p.write_text(s)
          p=Path('hermes-setup.txt'); s=p.read_text(); s=s.replace('Major unfinished first-release areas include real group administration, complete attachment transport/UI/lifecycle, disappearing-content implementation, invitations, safe install integration, remaining placeholder/simulation removal, final full-product gate, and final deployment.','Major unfinished first-release areas include completion of group earlier-history/admin-role controls, complete attachment transport/UI/lifecycle, disappearing-content implementation, invitations, safe install integration, remaining placeholder/simulation removal, final full-product gate, and final deployment.')
          s=s.replace('- New members receive only the new epoch by default; historyPolicy is fromJoin unless an explicit later history-grant feature is implemented.','- New members receive only the new epoch by default; historyPolicy is fromJoin. Explicit earlier-history sharing uses an admin-selected starting point/date (including Beginning of conversation) and must be message-granular so no content before the chosen boundary becomes decryptable.')
          p.write_text(s)
          with Path('hermes-memory.txt').open('a') as f: f.write('''\n\n2026-09-06 — GROUP EARLIER-HISTORY GRANT FOUNDATION\n- User approved administrator-selected starting point/date for explicit earlier-history sharing; Beginning of conversation is a valid choice and resolves to the earliest still-retained eligible message.\n- Security boundary: an exact date/message grant must not disclose a whole historical epoch key when that would expose older messages.\n- Added isolated `e2ee-account-group-history-crypto.js`: account ECDH P-256 + HKDF-SHA256 + AES-256-GCM re-encrypts one selected source message to one target account. Grant/group/source-message/grantor/target identities are cryptographically bound; device IDs are absent.\n- Added dedicated crypto test and security-gate step. This is foundation only: Firestore grant schema/rules, runtime/service/transport integration, Group Info control, disappearing-content purge linkage and emulator tests remain required.\n- Version checkpoint advanced to 0.9.6.5.\n- Overall first complete rebuild estimate remains approximately 65%; do not inflate it for this isolated foundation.\n- Reporting rule reinforced by user: after every substantive build run report the overall rebuild percentage even when unchanged, and reconcile all affected durable docs.\n''')
          PY
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md RUNTIME-AUTHORITY-MAP.md hermes-setup.txt
          git commit -m "Reconcile history grant foundation documentation"
          git push origin HEAD:fidunio-complete-rebuild
