name: Materialize Main Projection

on:
  push:
    branches: [fidunio-rebuild-baseline-2026-09-05]
    paths:
      - 'materialize-main-projection.mjs'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize peer-name and Sign Out ownership
        run: node materialize-main-projection.mjs
      - name: Validate deterministic runtime ownership
        run: |
          node --check firebase.js
          node --check app.js
          node --check bootstrap.js
          npm run test:runtime-transform-anchors
          npm run test:runtime-authority
          npm run test:firebase-e2ee-adapter
          git diff --check
      - name: Commit main projection ownership
        run: |
          git config user.name 'willyros01'
          git config user.email 'willyros01@gmail.com'
          git add firebase.js app.js bootstrap.js runtime-authority-gate.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize main-screen account projection'
          git push
