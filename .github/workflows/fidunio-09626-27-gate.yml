name: FIDUNIO 0.9.6.26-27 gate scripts
on:
  push:
    branches: [fidunio-complete-rebuild]
    paths: ['.fidunio-09626-27-gate-trigger']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fidunio-complete-rebuild}
      - run: python .fidunio-09626-27-gate.py
      - run: npm run test:disappearing-multi-device-convergence
      - run: npm run test:disappearing-compose-policy
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json
          git diff --cached --quiet || git commit -m "Permanently gate FIDUNIO 0.9.6.26 and 0.9.6.27"
          git push
