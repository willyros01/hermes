name: Reconcile 0.9.6.7 Validation Docs Once
on:
  push:
    branches: [fidunio-complete-rebuild]
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message == 'Reconcile 0.9.6.7 validation documentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-complete-rebuild
          fetch-depth: 0
      - name: Reconcile validated group-history persistence docs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('README.md'); s=p.read_text()
          old='''The usable feature is not yet complete. Firestore grant/copy schema, authorization rules, runtime/service/transport integration, Group Info date-selection controls, disappearing-content purge linkage, and emulator tests are still required before the control can be enabled.'''
          new='''The persistence/runtime foundation is now repository-validated in 0.9.6.7: exact Firestore grant/copy schema, authorization rules, serialized runtime/service/transport integration, message-granular target re-encryption, and emulator coverage are present. The usable feature is still not complete because Group Info date-selection controls, granted-history conversation projection, disappearing-content physical purge/anti-resurrection linkage, and real-app/device validation remain required before the control can be enabled.'''
          if old in s: s=s.replace(old,new,1)
          validation='''\n### 0.9.6.7 validation and build-process note\n\nThe first 0.9.6.7 materialization used a newly added one-shot workflow that GitHub did not register for execution on the same creation push, producing zero-job/failure noise; it was not an application or security-test failure. The materialization was then performed through a previously registered bounded runner. Repository inspection caught a rules-test chronology fixture defect before final validation: the valid group message had been given a fixed timestamp despite the rule requiring `createdAt == request.time`, and the history-grant matrix ran after its target member had been removed. The test fixture was repaired to use the authoritative server timestamp and an isolated restored-member setup for the separate grant matrix.\n\nAfter temporary materializer/repair files were removed, the cleaned-branch **Rebuild Baseline Security Gate run 34047570212 passed completely**, including Firestore E2EE rules, direct-message rules, expanded group E2EE/history-grant rules, group crypto/runtime/service/Outbox/conversation/controller/integration gates, recovery, App Check ownership, Functions scaffold, and runtime authority/transform gates. This validates the 0.9.6.7 repository foundation; it does not enable the unfinished Group Info history-sharing UI and does not deploy the changed rules to live Firebase.\n'''
          if '### 0.9.6.7 validation and build-process note' not in s:
              s=s.rstrip()+validation+'\n'
          p.write_text(s)

          p=Path('FIDUNIO-BUILD-CHECKLIST.md'); s=p.read_text()
          log='- 2026-09-06 — 0.9.6.7 cleaned-branch validation GREEN: after correcting a test-only chronology fixture caught during review and removing all temporary group-history materializer/repair files, Rebuild Baseline Security Gate run `34047570212` passed every substantive step. Group-history persistence/runtime foundation is repository-validated, but the feature remains IN PROGRESS pending Group Info date selection, granted-history projection, disappearing-content physical purge/anti-resurrection, and real-app/device validation. Live Firebase and htest remain untouched. Overall estimate remains approximately 65%.'
          if log not in s: s=s.rstrip()+'\n'+log+'\n'
          p.write_text(s)

          p=Path('hermes-memory.txt'); s=p.read_text()
          block='''\n\n2026-09-06 — 0.9.6.7 GROUP HISTORY PERSISTENCE VALIDATION GREEN\n- Materialized persistence/runtime foundation commit: `3c43c60834f95848b1f1cb5141b88e5efa2704d4`.\n- Review caught a test-only chronology fixture defect before final validation: valid group message test incorrectly used a fixed `createdAt` although rules require request time, and the history-grant matrix executed after removing its target member. The fixture was corrected to capture the authoritative server timestamp and restore target membership under disabled rules for the independent history-policy matrix.\n- A newly created branch-only one-shot workflow also produced zero-job/failure noise because GitHub had not registered it for same-push execution. This was workflow-registration noise, not a security/application test failure. The actual bounded materializer/repair ran through registered workflows and succeeded.\n- All temporary group-history workflows, scripts and trigger files were removed before the final clean validation.\n- Cleaned-branch Rebuild Baseline Security Gate run `34047570212` PASSED all substantive steps, including the expanded group E2EE/history-grant rule matrix and group history crypto/runtime integration gates.\n- 0.9.6.7 therefore has a repository-validated earlier-history persistence/runtime foundation. Do NOT mark the user-facing feature DONE: Group Info date selection, granted-history conversation projection, disappearing-content physical purge/anti-resurrection, and real-app/device proof remain unfinished.\n- Repository Firestore rules changed, but LIVE Firebase rules were NOT deployed. htest was NOT touched. App Check enforcement remains OFF; FCM remains deferred to 1.1.\n- Overall first complete rebuild estimate remains approximately 65%.\n'''
          if '2026-09-06 — 0.9.6.7 GROUP HISTORY PERSISTENCE VALIDATION GREEN' not in s: s+=block
          p.write_text(s)

          for path,title,body in [
            ('FIRESTORE-E2EE-V1-EMULATOR-TESTS.md','## 0.9.6.7 cleaned-branch group-history validation','The expanded group E2EE/history-grant rules matrix was validated as part of Rebuild Baseline Security Gate run `34047570212`, which passed completely after the test fixture was corrected to use the authoritative server timestamp and an isolated restored-member setup for history-grant authorization. This confirms repository-rule behavior only; it does not deploy these rules to live Firebase.'),
            ('FIRESTORE-GROUP-E2EE-V1-RULES.md','## 0.9.6.7 repository validation','Cleaned-branch Rebuild Baseline Security Gate run `34047570212` passed the expanded group E2EE/history-grant rule matrix. The changed repository rules remain undeployed to live Firebase pending the controlled Firebase handoff.')
          ]:
              p=Path(path); x=p.read_text(); block='\n\n'+title+'\n'+body+'\n'
              if title not in x: p.write_text(x.rstrip()+block)
          PY
      - name: Commit documentation reconciliation
        run: |
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add README.md hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md FIRESTORE-E2EE-V1-EMULATOR-TESTS.md FIRESTORE-GROUP-E2EE-V1-RULES.md
          git commit -m "Record 0.9.6.7 group history validation"
          git push origin HEAD:fidunio-complete-rebuild
