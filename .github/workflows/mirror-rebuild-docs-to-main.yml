name: Mirror Rebuild Recovery Docs to Main

on:
  push:
    branches: [fidunio-complete-rebuild]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fidunio-rebuild-doc-mirror
  cancel-in-progress: false

jobs:
  materialize-09619:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Trigger 0.9.6.19 receipt barrier materialization' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-complete-rebuild
          fetch-depth: 0
      - name: Materialize receipt barrier
        run: python3 .fidunio-09619-materialize.py
      - name: Commit candidate
        run: |
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add firebase.js firestore.rules firestore-group-e2ee-v1.rules.test.mjs package.json .github/workflows/rebuild-baseline-security.yml
          git commit -m "Materialize group receipt purge barrier"
          git push origin HEAD:fidunio-complete-rebuild

  mirror:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Normal mirror temporarily paused for bounded 0.9.6.19 materialization."
