name: Mirror Rebuild Recovery Docs to Main

on:
  push:
    branches: [fidunio-complete-rebuild]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fidunio-rebuild-doc-mirror
  cancel-in-progress: false

jobs:
  reconcile-10-roadmap:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Trigger detailed 1.0 build allocation roadmap' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-complete-rebuild
          fetch-depth: 0
      - name: Add detailed 1.0 allocations
        run: python3 .fidunio-10-roadmap-docs.py
      - name: Commit roadmap
        run: |
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add FIDUNIO-BUILD-CHECKLIST.md hermes-memory.txt
          git commit -m "Allocate detailed FIDUNIO 1.0 build roadmap"
          git push origin HEAD:fidunio-complete-rebuild

  mirror:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Normal mirror temporarily paused for bounded 1.0 roadmap reconciliation."
