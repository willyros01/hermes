name: Mirror Rebuild Recovery Docs to Main

on:
  push:
    branches: [fidunio-complete-rebuild]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fidunio-rebuild-doc-mirror
  cancel-in-progress: false

jobs:
  reconcile-09614:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Trigger 0.9.6.14 docs reconciliation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-complete-rebuild
          fetch-depth: 0
      - name: Reconcile 0.9.6.14 durable docs
        run: python3 .fidunio-reconcile-09614.py
      - name: Commit reconciliation
        run: |
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md architecture-ownership.txt RUNTIME-AUTHORITY-MAP.md ACCOUNT-E2EE-DIRECT-MESSAGE-FORMAT.md ACCOUNT-E2EE-GROUP-MESSAGE-FORMAT.md hermes-setup.txt
          git commit -m "Reconcile 0.9.6.14 purge executor docs"
          git push origin HEAD:fidunio-complete-rebuild

  mirror:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Normal mirror temporarily paused during bounded 0.9.6.14 reconciliation; restore immediately after completion."
