name: Mirror Rebuild Recovery Docs to Main

on:
  push:
    branches: [fidunio-complete-rebuild]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Run 0.9.6.10 doc reconciliation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-complete-rebuild
          fetch-depth: 0
      - name: Reconcile durable docs
        run: python3 .fidunio-reconcile-09610.py
      - name: Commit reconciliation
        run: |
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md hermes-setup.txt RUNTIME-AUTHORITY-MAP.md architecture-ownership.txt ACCOUNT-E2EE-DIRECT-MESSAGE-FORMAT.md ACCOUNT-E2EE-GROUP-MESSAGE-FORMAT.md FIRESTORE-GROUP-E2EE-V1-RULES.md FIRESTORE-E2EE-V1-EMULATOR-TESTS.md
          git commit -m "Reconcile 0.9.6.10 first-read documentation"
          git push origin HEAD:fidunio-complete-rebuild

  mirror:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Normal mirror temporarily paused during bounded reconciliation; workflow will be restored immediately afterward."
