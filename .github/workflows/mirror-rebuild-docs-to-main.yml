name: Mirror Rebuild Recovery Docs to Main

on:
  push:
    branches: [fidunio-complete-rebuild]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fidunio-rebuild-doc-mirror
  cancel-in-progress: false

jobs:
  reconcile-09619:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Trigger 0.9.6.19 documentation reconciliation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-complete-rebuild
          fetch-depth: 0
      - name: Reconcile 0.9.6.19 docs
        run: python3 .fidunio-09619-materialize.py
      - name: Commit reconciliation
        run: |
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add version.js README.md hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md DISAPPEARING-PURGE-AUTHORITY.md architecture-ownership.txt RUNTIME-AUTHORITY-MAP.md ACCOUNT-E2EE-GROUP-MESSAGE-FORMAT.md FIRESTORE-E2EE-V1-EMULATOR-TESTS.md hermes-setup.txt CURRENT-REBUILD.md
          git commit -m "Reconcile 0.9.6.19 group receipt purge barrier"
          git push origin HEAD:fidunio-complete-rebuild

  mirror:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Normal mirror temporarily paused during bounded 0.9.6.19 reconciliation."
