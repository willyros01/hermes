name: Mirror Rebuild Recovery Docs to Main
on:
  push:
    branches: [fidunio-complete-rebuild]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fidunio-rebuild-doc-mirror
  cancel-in-progress: false
jobs:
  weighted-ledger:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Trigger weighted 1.0 completion ledger' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-complete-rebuild
          fetch-depth: 0
      - run: python3 .fidunio-progress-ledger.py
      - run: |
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add FIDUNIO-BUILD-CHECKLIST.md hermes-memory.txt
          git commit -m "Adopt weighted FIDUNIO 1.0 completion ledger"
          git push origin HEAD:fidunio-complete-rebuild
  mirror:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Normal mirror temporarily paused for weighted-ledger reconciliation."
