name: Mirror Rebuild Recovery Docs to Main

on:
  push:
    branches: [fidunio-complete-rebuild]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fidunio-rebuild-doc-mirror
  cancel-in-progress: false

jobs:
  materialize-09617:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Trigger 0.9.6.17 grant barrier materialization' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-complete-rebuild
          fetch-depth: 0
      - name: Materialize 0.9.6.17 grant barrier
        run: python3 .fidunio-materialize-09617.py
      - name: Commit materialization
        run: |
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add firebase.js firestore.rules firestore-group-e2ee-v1.rules.test.mjs
          git commit -m "Materialize group history-grant purge barrier"
          git push origin HEAD:fidunio-complete-rebuild

  mirror:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Normal mirror temporarily paused during bounded 0.9.6.17 materialization; restore immediately after completion."
