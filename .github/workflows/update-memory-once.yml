name: Update Rebuild Memory Once
on:
  push:
    branches: [fidunio-complete-rebuild]
    paths: ['.github/workflows/update-memory-once.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-complete-rebuild
      - name: Record validated group administration checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('FIDUNIO-BUILD-CHECKLIST.md');s=p.read_text()
          s=s.replace('| Group rename | DONE | Cloud-authoritative admin rename through serialized group owner; repository group tests/gate required. |','| Group rename | DONE | Cloud-authoritative admin rename through serialized group owner; group tests and full Rebuild Baseline Security Gate green. |')
          entry='- 2026-09-06 — Group administration validation checkpoint: materializer group runtime/app/rules/authority tests passed, then full Rebuild Baseline Security Gate run `34045259037` passed on the cleaned authoritative branch. Temporary group-administration materializer/trigger workflows were removed.'
          if entry not in s:s=s.rstrip()+"\n"+entry+"\n"
          p.write_text(s)
          p=Path('hermes-memory.txt');s=p.read_text()
          entry='''2026-09-06 — GROUP ADMINISTRATION REPOSITORY VALIDATION GREEN\n- Materialized group administration commit: `c62db46bc8646f68beb54fd5038ae0d38bac1170`.\n- Focused materializer validation passed group runtime, group service/controller/integration ownership, Firestore group E2EE rules, and runtime authority tests.\n- Full Rebuild Baseline Security Gate run `34045259037` then passed every substantive step on the cleaned authoritative branch after temporary group-administration workflows were removed.\n- Group rename/add/remove/non-owner leave are therefore repository-validated DONE. Explicit earlier-history grants/admin-role controls remain IN PROGRESS; no `htest` deployment was performed.'''
          if entry not in s:s=s.rstrip()+"\n\n"+entry+"\n"
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add FIDUNIO-BUILD-CHECKLIST.md hermes-memory.txt
          git commit -m "Record green group administration checkpoint"
          git push origin HEAD:fidunio-complete-rebuild
