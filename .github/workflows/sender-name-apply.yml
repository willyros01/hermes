name: Apply sender-name notification enhancement
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sender-name-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply bounded notification enhancement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); s=p.read_text();
              if old not in s: raise SystemExit(f'missing expected anchor in {path}: {old[:100]}')
              p.write_text(s.replace(old,new,1))
          def app(path, text):
              p=Path(path); s=p.read_text();
              if text.strip() not in s: p.write_text(s.rstrip()+"\n\n"+text.strip()+"\n")

          # Client Firestore owner: persist installation-scoped privacy preference.
          rep('firebase.js',
          'export async function upsertCloudNotificationDevice({installationId,fcmToken,platform,enabled=true}={}){const s=await ensureServices();if(!authUser)throw new Error("Sign in first.");const id=notificationDeviceId(installationId),token=String(fcmToken||"").trim(),kind=notificationPlatform(platform);if(token.length<20||token.length>4096)throw new Error("Invalid FCM registration token.");const ref=s.fsSdk.doc(s.db,"users",authUser.uid,"notificationDevices",id),snap=await s.fsSdk.getDoc(ref),row={installationId:id,fcmToken:token,platform:kind,enabled:enabled===true,updatedAt:s.fsSdk.serverTimestamp(),lastSeenAt:s.fsSdk.serverTimestamp()};if(snap.exists())await s.fsSdk.updateDoc(ref,row);else await s.fsSdk.setDoc(ref,{...row,createdAt:s.fsSdk.serverTimestamp()});return{id,...row};}',
          'export async function upsertCloudNotificationDevice({installationId,fcmToken,platform,enabled=true,showSenderName=false}={}){const s=await ensureServices();if(!authUser)throw new Error("Sign in first.");const id=notificationDeviceId(installationId),token=String(fcmToken||"").trim(),kind=notificationPlatform(platform);if(token.length<20||token.length>4096)throw new Error("Invalid FCM registration token.");const ref=s.fsSdk.doc(s.db,"users",authUser.uid,"notificationDevices",id),snap=await s.fsSdk.getDoc(ref),row={installationId:id,fcmToken:token,platform:kind,enabled:enabled===true,showSenderName:showSenderName===true,updatedAt:s.fsSdk.serverTimestamp(),lastSeenAt:s.fsSdk.serverTimestamp()};if(snap.exists())await s.fsSdk.updateDoc(ref,row);else await s.fsSdk.setDoc(ref,{...row,createdAt:s.fsSdk.serverTimestamp()});return{id,...row};}')

          # Firestore exact schema: add only one bounded boolean preference.
          rep('firestore.rules',
          'function validNotificationDevice(uid,installationId,d){return request.auth.uid==uid&&d.keys().hasAll(["installationId","fcmToken","platform","enabled","createdAt","updatedAt","lastSeenAt"])&&d.keys().hasOnly(["installationId","fcmToken","platform","enabled","createdAt","updatedAt","lastSeenAt"])&&d.installationId==installationId&&d.installationId is string&&d.installationId.size()>=8&&d.installationId.size()<=128&&d.fcmToken is string&&d.fcmToken.size()>=20&&d.fcmToken.size()<=4096&&d.platform in ["ios-pwa","ios-browser","android-browser","desktop-browser"]&&d.enabled is bool&&d.createdAt is timestamp&&d.updatedAt==request.time&&d.lastSeenAt==request.time;}',
          'function validNotificationDevice(uid,installationId,d){return request.auth.uid==uid&&d.keys().hasAll(["installationId","fcmToken","platform","enabled","showSenderName","createdAt","updatedAt","lastSeenAt"])&&d.keys().hasOnly(["installationId","fcmToken","platform","enabled","showSenderName","createdAt","updatedAt","lastSeenAt"])&&d.installationId==installationId&&d.installationId is string&&d.installationId.size()>=8&&d.installationId.size()<=128&&d.fcmToken is string&&d.fcmToken.size()>=20&&d.fcmToken.size()<=4096&&d.platform in ["ios-pwa","ios-browser","android-browser","desktop-browser"]&&d.enabled is bool&&d.showSenderName is bool&&d.createdAt is timestamp&&d.updatedAt==request.time&&d.lastSeenAt==request.time;}')

          # Rules emulator fixture and preference coverage.
          rep('firestore-notification.rules.test.mjs',
          "const valid=()=>({installationId:ID,fcmToken:'x'.repeat(80),platform:'ios-pwa',enabled:true,createdAt:serverTimestamp(),updatedAt:serverTimestamp(),lastSeenAt:serverTimestamp()});",
          "const valid=()=>({installationId:ID,fcmToken:'x'.repeat(80),platform:'ios-pwa',enabled:true,showSenderName:false,createdAt:serverTimestamp(),updatedAt:serverTimestamp(),lastSeenAt:serverTimestamp()});")
          rep('firestore-notification.rules.test.mjs',
          "await t('owner rotates own token',()=>assertSucceeds(updateDoc(refA,{fcmToken:'y'.repeat(90),platform:'ios-pwa',enabled:true,updatedAt:serverTimestamp(),lastSeenAt:serverTimestamp()})));",
          "await t('owner enables sender-name presentation',()=>assertSucceeds(updateDoc(refA,{showSenderName:true,updatedAt:serverTimestamp(),lastSeenAt:serverTimestamp()})));await t('non-boolean sender-name preference denied',()=>assertFails(updateDoc(refA,{showSenderName:'yes',updatedAt:serverTimestamp(),lastSeenAt:serverTimestamp()})));await t('owner rotates own token',()=>assertSucceeds(updateDoc(refA,{fcmToken:'y'.repeat(90),platform:'ios-pwa',enabled:true,showSenderName:true,updatedAt:serverTimestamp(),lastSeenAt:serverTimestamp()})));" )

          # Settings UI: private by default, explicit per-installation opt in.
          rep('settings-lifecycle.js',
          'function notificationStatusText(status){return({ready:"Enabled",off:"Off",denied:"Permission denied",unsupported:"Unsupported on this device/browser","config-required":"Web Push setup required"})[status]||status;}\nasync function renderNotifications(notificationsHost,info){\n  notificationsHost.innerHTML=\'<div class="card" id="fidunioNotificationsCard"><h2>Notifications</h2><p class="small-note">Loading notification status…</p></div>\';\n  const card=notificationsHost.querySelector("#fidunioNotificationsCard");\n  try{const state=await notificationRegistrationOwner.getStatus(info.user.uid);if(!card.isConnected)return;const canEnable=state.supported&&state.permission!=="denied"&&state.configured&&!state.enabled;card.innerHTML=`<h2>Notifications</h2><p class="small-note"><strong>Status:</strong> ${esc(notificationStatusText(state.status))}</p><p class="small-note">FIDUNIO notifications contain only <strong>FIDUNIO — New message</strong>. Message text, attachment names, and decrypted content are never placed in the push payload.</p>${!state.configured?\'<p class="warning-note">Web Push configuration must be completed before notifications can be enabled.</p>\':""}<button class="primary" id="enableNotificationsBtn" ${canEnable?"":"disabled"}>Enable Notifications</button><button class="secondary" id="disableNotificationsBtn" ${state.enabled?"":"disabled"} style="margin-top:10px">Turn Off Notifications</button><div id="notificationNote"></div>`;\n    const enable=card.querySelector("#enableNotificationsBtn"),disable=card.querySelector("#disableNotificationsBtn"),note=card.querySelector("#notificationNote");\n    enable.onclick=async()=>{enable.disabled=true;enable.textContent="Enabling…";try{await notificationRegistrationOwner.enableFromUserGesture({uid:info.user.uid,vapidKey:FIDUNIO_WEB_PUSH_PUBLIC_VAPID_KEY});await renderNotifications(notificationsHost,info);}catch(err){note.innerHTML=`<p class="warning-note">${esc(err?.message||String(err))}</p>`;enable.disabled=false;enable.textContent="Enable Notifications";}};\n    disable.onclick=async()=>{disable.disabled=true;disable.textContent="Turning off…";try{await notificationRegistrationOwner.disable({uid:info.user.uid});await renderNotifications(notificationsHost,info);}catch(err){note.innerHTML=`<p class="warning-note">${esc(err?.message||String(err))}</p>`;disable.disabled=false;disable.textContent="Turn Off Notifications";}};\n  }catch(err){card.innerHTML=`<h2>Notifications</h2><p class="warning-note">${esc(err?.message||String(err))}</p>`;}\n}',
          'function notificationStatusText(status){return({ready:"Enabled",off:"Off",denied:"Permission denied",unsupported:"Unsupported on this device/browser","config-required":"Web Push setup required"})[status]||status;}\nasync function renderNotifications(notificationsHost,info){\n  notificationsHost.innerHTML=\'<div class="card" id="fidunioNotificationsCard"><h2>Notifications</h2><p class="small-note">Loading notification status…</p></div>\';\n  const card=notificationsHost.querySelector("#fidunioNotificationsCard");\n  try{const state=await notificationRegistrationOwner.getStatus(info.user.uid);if(!card.isConnected)return;const canEnable=state.supported&&state.permission!=="denied"&&state.configured&&!state.enabled;card.innerHTML=`<h2>Notifications</h2><p class="small-note"><strong>Status:</strong> ${esc(notificationStatusText(state.status))}</p><p class="small-note">Private is the default: <strong>FIDUNIO — New message</strong>. You may optionally show only the sender\'s FIDUNIO display name. Message text, attachment names, email addresses, UIDs, and decrypted content are never placed in the notification.</p>${state.enabled?`<label class="form-label" style="display:flex;gap:10px;align-items:center;margin-top:14px"><input type="checkbox" id="showNotificationSenderName" ${state.showSenderName?"checked":""}> Show sender\'s FIDUNIO display name</label><p class="small-note">When enabled on this installation, the card may say <strong>New message from Display Name</strong>.</p>`:""}${!state.configured?\'<p class="warning-note">Web Push configuration must be completed before notifications can be enabled.</p>\':""}<button class="primary" id="enableNotificationsBtn" ${canEnable?"":"disabled"}>Enable Notifications</button><button class="secondary" id="disableNotificationsBtn" ${state.enabled?"":"disabled"} style="margin-top:10px">Turn Off Notifications</button><div id="notificationNote"></div>`;\n    const enable=card.querySelector("#enableNotificationsBtn"),disable=card.querySelector("#disableNotificationsBtn"),senderToggle=card.querySelector("#showNotificationSenderName"),note=card.querySelector("#notificationNote");\n    if(senderToggle)senderToggle.onchange=async()=>{senderToggle.disabled=true;try{await notificationRegistrationOwner.setShowSenderName({uid:info.user.uid,showSenderName:senderToggle.checked});await renderNotifications(notificationsHost,info);}catch(err){note.innerHTML=`<p class="warning-note">${esc(err?.message||String(err))}</p>`;senderToggle.disabled=false;}};\n    enable.onclick=async()=>{enable.disabled=true;enable.textContent="Enabling…";try{await notificationRegistrationOwner.enableFromUserGesture({uid:info.user.uid,vapidKey:FIDUNIO_WEB_PUSH_PUBLIC_VAPID_KEY});await renderNotifications(notificationsHost,info);}catch(err){note.innerHTML=`<p class="warning-note">${esc(err?.message||String(err))}</p>`;enable.disabled=false;enable.textContent="Enable Notifications";}};\n    disable.onclick=async()=>{disable.disabled=true;disable.textContent="Turning off…";try{await notificationRegistrationOwner.disable({uid:info.user.uid});await renderNotifications(notificationsHost,info);}catch(err){note.innerHTML=`<p class="warning-note">${esc(err?.message||String(err))}</p>`;disable.disabled=false;disable.textContent="Turn Off Notifications";}};\n  }catch(err){card.innerHTML=`<h2>Notifications</h2><p class="warning-note">${esc(err?.message||String(err))}</p>`;}\n}')

          # Server repositories add authoritative sender profile lookup.
          Path('functions/notification/direct-message-notification-firestore-admin-adapter.mjs').write_text('''export function createDirectNotificationAdminRepositories({db}={}){\n  if(!db?.doc||!db?.collection||!db?.runTransaction)throw new Error("Firestore Admin database is required.");\n  const conversationRepo=Object.freeze({\n    async get(conversationId){const snap=await db.doc(`conversations/${conversationId}`).get();return snap.exists?{id:snap.id,...snap.data()}:null;}\n  });\n  const profileRepo=Object.freeze({\n    async getDisplayName(uid){const snap=await db.doc(`users/${uid}`).get();if(!snap.exists)return"";const name=String(snap.data()?.displayName||"").trim();return name.length>0&&name.length<=80?name:"";}\n  });\n  const deviceRepo=Object.freeze({\n    async listActive(uid){const snap=await db.collection(`users/${uid}/notificationDevices`).where("enabled","==",true).get();return snap.docs.map(doc=>({installationId:doc.id,...doc.data()}));},\n    async deleteIfTokenMatches(uid,installationId,fcmToken){const ref=db.doc(`users/${uid}/notificationDevices/${installationId}`);return db.runTransaction(async tx=>{const snap=await tx.get(ref);if(!snap.exists)return false;const row=snap.data();if(row.enabled!==true||row.fcmToken!==fcmToken)return false;tx.delete(ref);return true;});}\n  });\n  return Object.freeze({conversationRepo,profileRepo,deviceRepo});\n}\n''')

          # Server core: profile-authoritative name, per-installation opt-in, no content leakage.
          Path('functions/notification/direct-message-notification-core.mjs').write_text('''export const FIDUNIO_NOTIFICATION_TITLE="FIDUNIO";\nexport const FIDUNIO_NOTIFICATION_BODY="New message";\nconst INVALID_TOKEN_CODES=new Set(["messaging/registration-token-not-registered","messaging/invalid-registration-token"]);\nfunction boundedId(value,label,max=256){const text=String(value||"").trim();if(!text||text.length>max)throw new Error(`${label} is invalid.`);return text;}\nfunction normalizedMembers(value){return Array.isArray(value)?[...new Set(value.map(x=>String(x||"").trim()).filter(Boolean))]:[];}\nfunction senderBody(name){const safe=String(name||"").trim();return safe&&safe.length<=80?`New message from ${safe}`:FIDUNIO_NOTIFICATION_BODY;}\nexport function deriveDirectRecipientUid({conversation,message}={}){const members=normalizedMembers(conversation?.members),senderUid=String(message?.senderUid||"").trim();if(conversation?.type!=="direct"||members.length!==2||!senderUid||!members.includes(senderUid))throw new Error("Direct notification authority is invalid.");return members.find(uid=>uid!==senderUid)||"";}\nexport function isInvalidNotificationTokenError(error){return INVALID_TOKEN_CODES.has(String(error?.code||""));}\nexport function createDirectMessageNotificationCore({conversationRepo,profileRepo,deviceRepo,messaging,logger=console}={}){\n  if(typeof conversationRepo?.get!=="function"||typeof profileRepo?.getDisplayName!=="function"||typeof deviceRepo?.listActive!=="function"||typeof deviceRepo?.deleteIfTokenMatches!=="function"||typeof messaging?.sendEachForMulticast!=="function")throw new Error("Direct notification core dependencies are incomplete.");\n  return Object.freeze({async handleCreatedMessage({conversationId,messageId,message}={}){\n    conversationId=boundedId(conversationId,"Conversation ID");messageId=boundedId(messageId,"Message ID");if(!message||typeof message!=="object")throw new Error("Accepted message snapshot is required.");\n    const conversation=await conversationRepo.get(conversationId);if(!conversation)return{status:"conversation-missing",sent:0,failed:0,pruned:0};\n    const recipientUid=deriveDirectRecipientUid({conversation,message}),senderUid=String(message.senderUid||"").trim();\n    const devices=(await deviceRepo.listActive(recipientUid)).filter(row=>row?.enabled===true&&typeof row?.fcmToken==="string"&&row.fcmToken.length>=20);\n    if(!devices.length)return{status:"no-active-installations",recipientUid,sent:0,failed:0,pruned:0};\n    const senderDisplayName=await profileRepo.getDisplayName(senderUid);\n    let sent=0,failed=0;const stale=[];\n    async function sendBatch(batch,body){if(!batch.length)return;const result=await messaging.sendEachForMulticast({tokens:batch.map(row=>row.fcmToken),notification:{title:FIDUNIO_NOTIFICATION_TITLE,body},data:{type:"direct-message",conversationId,messageId},webpush:{headers:{Urgency:"high"}}});const responses=Array.isArray(result?.responses)?result.responses:[];for(let i=0;i<responses.length;i++)if(responses[i]?.success!==true&&isInvalidNotificationTokenError(responses[i]?.error))stale.push(batch[i]);sent+=Number(result?.successCount||responses.filter(x=>x?.success===true).length||0);failed+=Number(result?.failureCount||responses.filter(x=>x?.success!==true).length||0);}\n    const privateDevices=devices.filter(row=>row.showSenderName!==true),namedDevices=devices.filter(row=>row.showSenderName===true);\n    await sendBatch(privateDevices,FIDUNIO_NOTIFICATION_BODY);await sendBatch(namedDevices,senderBody(senderDisplayName));\n    await Promise.all(stale.filter(Boolean).map(row=>deviceRepo.deleteIfTokenMatches(recipientUid,row.installationId,row.fcmToken)));\n    if(failed>stale.length)logger.warn?.("FIDUNIO direct notification partial failure",{conversationId,messageId,recipientUid,failed,pruned:stale.length});\n    return{status:"sent",recipientUid,sent,failed,pruned:stale.length};\n  }});\n}\n''')

          # Wire profile repository into the existing one notification owner.
          rep('functions/index.mjs',
          'const {conversationRepo:notificationConversationRepo,deviceRepo:notificationDeviceRepo}=createDirectNotificationAdminRepositories({db});\nconst directNotificationCore=createDirectMessageNotificationCore({conversationRepo:notificationConversationRepo,deviceRepo:notificationDeviceRepo,messaging:getMessaging()});',
          'const {conversationRepo:notificationConversationRepo,profileRepo:notificationProfileRepo,deviceRepo:notificationDeviceRepo}=createDirectNotificationAdminRepositories({db});\nconst directNotificationCore=createDirectMessageNotificationCore({conversationRepo:notificationConversationRepo,profileRepo:notificationProfileRepo,deviceRepo:notificationDeviceRepo,messaging:getMessaging()});')

          # Server gate proves opt-in split and profile authority; message.senderName must never be used.
          Path('functions/notification/direct-message-notification-core.test.mjs').write_text('''import assert from "node:assert/strict";\nimport {createDirectMessageNotificationCore,deriveDirectRecipientUid,isInvalidNotificationTokenError} from "./direct-message-notification-core.mjs";\nassert.equal(deriveDirectRecipientUid({conversation:{type:"direct",members:["u1","u2"]},message:{senderUid:"u1"}}),"u2");assert.throws(()=>deriveDirectRecipientUid({conversation:{type:"group",members:["u1","u2"]},message:{senderUid:"u1"}}));assert.equal(isInvalidNotificationTokenError({code:"messaging/registration-token-not-registered"}),true);\nconst calls=[],deleted=[];const core=createDirectMessageNotificationCore({conversationRepo:{get:async id=>({id,type:"direct",members:["sender","recipient"]})},profileRepo:{getDisplayName:async uid=>uid==="sender"?"Authoritative Alice":""},deviceRepo:{listActive:async()=>[{installationId:"install-a",fcmToken:"a".repeat(80),enabled:true,showSenderName:false},{installationId:"install-b",fcmToken:"b".repeat(80),enabled:true,showSenderName:true}],deleteIfTokenMatches:async(...args)=>{deleted.push(args);return true;}},messaging:{sendEachForMulticast:async payload=>{calls.push(payload);return payload.tokens[0][0]==="a"?{successCount:1,failureCount:0,responses:[{success:true}]}:{successCount:0,failureCount:1,responses:[{success:false,error:{code:"messaging/registration-token-not-registered"}}]};}},logger:{warn(){}}});\nconst result=await core.handleCreatedMessage({conversationId:"dm-1",messageId:"m-1",message:{senderUid:"sender",ciphertext:"SECRET-CIPHERTEXT",senderName:"Untrusted Message Name",text:"PLAINTEXT-MUST-NOT-LEAK"}});assert.equal(result.recipientUid,"recipient");assert.equal(result.sent,1);assert.equal(result.pruned,1);assert.equal(calls.length,2);assert.deepEqual(calls[0].notification,{title:"FIDUNIO",body:"New message"});assert.deepEqual(calls[1].notification,{title:"FIDUNIO",body:"New message from Authoritative Alice"});for(const payload of calls){assert.deepEqual(payload.data,{type:"direct-message",conversationId:"dm-1",messageId:"m-1"});const serialized=JSON.stringify(payload);assert.doesNotMatch(serialized,/PLAINTEXT-MUST-NOT-LEAK|SECRET-CIPHERTEXT|Untrusted Message Name/);}assert.deepEqual(deleted,[["recipient","install-b","b".repeat(80)]]);\nlet sent=false;const noDevices=createDirectMessageNotificationCore({conversationRepo:{get:async()=>({type:"direct",members:["s","r"]})},profileRepo:{getDisplayName:async()=>"Sender"},deviceRepo:{listActive:async()=>[],deleteIfTokenMatches:async()=>false},messaging:{sendEachForMulticast:async()=>{sent=true;}}});const noResult=await noDevices.handleCreatedMessage({conversationId:"c",messageId:"m",message:{senderUid:"s"}});assert.equal(noResult.status,"no-active-installations");assert.equal(sent,false);console.log("FCM direct notification sender-name privacy gate passed");\n''')

          # Service worker renders only approved generic/name body from FCM notification envelope.
          sw=Path('service-worker.js').read_text()
          sw=sw.replace('const SHELL_REVISION="1.1.8-fcm-n5-openwindow-routing";','const SHELL_REVISION="1.1.9-fcm-sender-name";')
          old='function pushRoute(event){try{const payload=event.data?.json?.()||{},data=payload?.data||payload?.message?.data||{};if(data?.type!=="direct-message")return null;const conversationId=String(data.conversationId||""),messageId=String(data.messageId||"");if(!conversationId||!messageId)return null;return{type:"direct-message",conversationId,messageId};}catch{return null;}}\nself.addEventListener("push",event=>{event.waitUntil((async()=>{const route=pushRoute(event);if(!route)return;const windows=await self.clients.matchAll({type:"window",includeUncontrolled:true});if(windows.some(client=>client.visibilityState==="visible"))return;await self.registration.showNotification("FIDUNIO",{body:"New message",icon:"./icon-192.png",badge:"./icon-192.png",tag:`fidunio-${route.messageId}`,data:route});})());});'
          new='function pushEnvelope(event){try{const payload=event.data?.json?.()||{},data=payload?.data||payload?.message?.data||{};if(data?.type!=="direct-message")return null;const conversationId=String(data.conversationId||""),messageId=String(data.messageId||"");if(!conversationId||!messageId)return null;const proposed=String(payload?.notification?.body||payload?.message?.notification?.body||"New message").trim();const body=proposed==="New message"||(/^New message from .{1,80}$/u).test(proposed)?proposed:"New message";return{route:{type:"direct-message",conversationId,messageId},body};}catch{return null;}}\nself.addEventListener("push",event=>{event.waitUntil((async()=>{const envelope=pushEnvelope(event);if(!envelope)return;const {route,body}=envelope;const windows=await self.clients.matchAll({type:"window",includeUncontrolled:true});if(windows.some(client=>client.visibilityState==="visible"))return;await self.registration.showNotification("FIDUNIO",{body,icon:"./icon-192.png",badge:"./icon-192.png",tag:`fidunio-${route.messageId}`,data:route});})());});'
          if old not in sw: raise SystemExit('service-worker push anchor missing')
          Path('service-worker.js').write_text(sw.replace(old,new,1))

          # Release ledger and gates.
          Path('version.js').write_text('globalThis.FIDUNIO_RELEASE = Object.freeze({ version: "1.1.9" });\n')
          for path in ['notification-n3.test.mjs','notification-n4.test.mjs','notification-n5.test.mjs','direct-message-basic-path.test.mjs','outbox-reconciliation-boundary.test.mjs']:
              p=Path(path); s=p.read_text().replace('1.1.8-fcm-n5-openwindow-routing','1.1.9-fcm-sender-name').replace('version: "1.1.8"','version: "1.1.9"'); p.write_text(s)
          # N3 focused expectations for default false and explicit opt-in owner method.
          p=Path('notification-n3.test.mjs'); s=p.read_text();
          s=s.replace("assert.equal(writes[0].enabled,true);assert.equal(writes[0].installationId,'install-12345678');await owner.disable({uid:'u1'});", "assert.equal(writes[0].enabled,true);assert.equal(writes[0].showSenderName,false);assert.equal(writes[0].installationId,'install-12345678');await owner.setShowSenderName({uid:'u1',showSenderName:true});assert.equal(writes.at(-1).showSenderName,true);await owner.disable({uid:'u1'});")
          s=s.replace("assert.match(settings,/Enable Notifications/);", "assert.match(settings,/Enable Notifications/);assert.match(settings,/Show sender\\'s FIDUNIO display name/);assert.match(settings,/setShowSenderName/);")
          p.write_text(s)
          # N4 focused SW gate permits only sender display presentation, never content.
          p=Path('notification-n4.test.mjs'); s=p.read_text();s=s.replace('assert.match(sw,/showNotification\\(\\"FIDUNIO\\",\\{body:\\"New message\\"/);','assert.match(sw,/showNotification\\(\\"FIDUNIO\\",\\{body,/);assert.match(sw,/New message from/);');p.write_text(s)

          # Architecture approval and durable reconciliation.
          rep('FCM-NOTIFICATION-ARCHITECTURE.md','Sender names are not required for the first implementation because lock-screen social metadata is also a privacy concern.','Sender identity remains private by default. A user may explicitly enable **Show sender name** per installation. When enabled, the server may place only the authoritative `users/{senderUid}.displayName` value in the OS-visible body (`New message from <FIDUNIO display name>`). The message document\'s `senderName` is not notification authority. No message text, attachment name, email, UID, phone number, key material, or decrypted content may be added.')
          rep('FCM-NOTIFICATION-ARCHITECTURE.md','- `enabled`\n- `createdAt`','- `enabled`\n- `showSenderName` — boolean, default `false`, installation-scoped privacy preference\n- `createdAt`')
          checkpoint='''## FIDUNIO 1.1.9 — optional sender display-name notifications — 2026-09-09\n\n**Status: REPOSITORY CANDIDATE; live Firestore rules + N4 Function deployment and device acceptance required.** Private notifications remain the default. Each notification installation may explicitly opt in with `showSenderName: true`. The server resolves the sender only from authoritative `users/{senderUid}.displayName`, never from message `senderName`, and sends `FIDUNIO — New message from <display name>` only to opted-in installations. Non-opted installations remain `FIDUNIO — New message`. Message text, attachment names, email, UID, phone, ciphertext and decrypted content remain excluded. This changes no Firestore/E2EE/message/receipt authority.\n'''
          for path in ['FCM-NOTIFICATION-ARCHITECTURE.md','CURRENT-REBUILD.md','hermes-memory.txt','README.md','FIDUNIO-BUILD-CHECKLIST.md','RUNTIME-AUTHORITY-MAP.md','architecture-ownership.txt','FIREBASE-RECOVERY-PROJECT-CONFIG.md','DEVICE-ACCEPTANCE-BUGS.md']:
              app(path,checkpoint)
          PY
      - name: Commit product change
        run: |
