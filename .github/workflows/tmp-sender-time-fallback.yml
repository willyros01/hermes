name: Temporary sender time fallback build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-sender-time-fallback.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 0.9.9.16 sender time fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'anchor missing: {path}')
              p.write_text(s.replace(old,new,count))

          p=Path('app.js'); s=p.read_text()
          old='''function messageDayLabel(value){\n  const d=messageCalendarDate(value);\n  return d?new Intl.DateTimeFormat("en-US",{month:"long",day:"numeric",year:"numeric"}).format(d):"";\n}\nfunction renderConversationMessages(msgs,c){'''
          new='''function messageDayLabel(value){\n  const d=messageCalendarDate(value);\n  return d?new Intl.DateTimeFormat("en-US",{month:"long",day:"numeric",year:"numeric"}).format(d):"";\n}\nfunction messageDisplayTime(m){\n  const explicit=String(m?.time||"").trim();\n  if(explicit)return explicit;\n  const d=messageCalendarDate(m?.createdAt);\n  return d?new Intl.DateTimeFormat("en-US",{hour:"numeric",minute:"2-digit"}).format(d):"";\n}\nfunction renderConversationMessages(msgs,c){'''
          if old not in s: raise SystemExit('time helper anchor missing')
          s=s.replace(old,new,1)
          old='''  const groupSender=groupSenderDisplayName(m,c);\n  return `<div class="msg-row ${m.mine?"mine":""} ${hasMessageAction?"pending-message-action":""}" ${hasMessageAction?`data-message-id="${esc(m.id)}" data-conversation-id="${esc(c.id)}" role="button" tabindex="0" aria-label="${label} message. Press and hold for actions."`:""}>\n    ${groupSender?`<div class="sender-label"><span class="sender-name">${esc(groupSender)}</span><span class="sender-time">${esc(m.time)}</span></div>`:""}'''
          new='''  const groupSender=groupSenderDisplayName(m,c);\n  const displayTime=messageDisplayTime(m);\n  return `<div class="msg-row ${m.mine?"mine":""} ${hasMessageAction?"pending-message-action":""}" ${hasMessageAction?`data-message-id="${esc(m.id)}" data-conversation-id="${esc(c.id)}" role="button" tabindex="0" aria-label="${label} message. Press and hold for actions."`:""}>\n    ${groupSender?`<div class="sender-label"><span class="sender-name">${esc(groupSender)}</span><span class="sender-time">${esc(displayTime)}</span></div>`:""}'''
          if old not in s: raise SystemExit('sender time render anchor missing')
          p.write_text(s.replace(old,new,1))

          replace('version.js','version: "0.9.9.15"','version: "0.9.9.16"')
          replace('service-worker.js','SHELL_REVISION="0.9.9.15-group-sender-time"','SHELL_REVISION="0.9.9.16-group-sender-time-fallback"')
          for f in ['outbox-reconciliation-boundary.test.mjs','direct-message-basic-path.test.mjs']:
              q=Path(f); t=q.read_text()
              if '0\\.9\\.9\\.15-group-sender-time' in t:
                  t=t.replace('0\\.9\\.9\\.15-group-sender-time','0\\.9\\.9\\.16-group-sender-time-fallback')
              elif '0.9.9.15-group-sender-time' in t:
                  t=t.replace('0.9.9.15-group-sender-time','0.9.9.16-group-sender-time-fallback')
              else: raise SystemExit(f'cache anchor missing: {f}')
              q.write_text(t)

          test=Path('group-sender-time.test.mjs')
          test.write_text('''import assert from "node:assert/strict";\nimport {readFileSync} from "node:fs";\nconst app=readFileSync("app.js","utf8");\nconst css=readFileSync("styles.css","utf8");\nassert.ok(app.includes('const groupSender=groupSenderDisplayName(m,c)'),"group sender identity owner must remain unchanged");\nassert.ok(app.includes('function messageDisplayTime(m)'),"group sender time must have one display-time resolver");\nassert.ok(app.includes('const explicit=String(m?.time||"").trim()'),"existing explicit message time remains first choice");\nassert.ok(app.includes('messageCalendarDate(m?.createdAt)'),"server-projected historical rows must fall back to createdAt");\nassert.ok(app.includes('hour:"numeric",minute:"2-digit"'),"createdAt fallback must format a human message time");\nassert.ok(app.includes('<span class="sender-name">${esc(groupSender)}</span><span class="sender-time">${esc(displayTime)}</span>'),"group creator name must show resolved message time beside it");\nassert.ok(app.includes('function renderConversationMessages(msgs,c)'),"date separators must remain intact");\nassert.ok(css.includes('.sender-label .sender-time'),"sender-line time styling must remain intact");\nconsole.log("Group sender-time gate passed");\n''')

          prefixes={
            'CURRENT-REBUILD.md':'### GROUP SENDER TIME CORRECTION — 0.9.9.16\n\n0.9.9.15 exposed that server-projected/historical group rows may have an empty legacy `time` display field even though authoritative `createdAt` is present. 0.9.9.16 keeps the accepted date separators and sender labels, uses the existing time when present, and otherwise derives `h:mm AM/PM` from `createdAt` beside the sender name. No Firebase, E2EE, Outbox, receipt, disappearing-content, attachment, or membership authority changed.\n\n',
            'hermes-memory.txt':'GROUP SENDER TIME CORRECTION (0.9.9.16): Device evidence showed 0.9.9.15 sender names but no sender-line time on existing group messages. Root cause: some projected group rows have empty legacy `time` while authoritative `createdAt` remains available. The display now resolves explicit `time` first and falls back to `createdAt` formatted as h:mm AM/PM. Date separators and messaging authority are unchanged.\n\n',
            'DEVICE-ACCEPTANCE-BUGS.md':'## Group sender time — 0.9.9.16 correction\n\n**Status: DEVICE CANDIDATE.** 0.9.9.15 failed device presentation because existing projected group rows showed sender names without time. 0.9.9.16 resolves time from the legacy display field when present, otherwise from authoritative `createdAt`. Confirm existing and newly sent group messages show `Sender Name  h:mm AM/PM`, date separators remain correct, and close/reopen preserves the display.\n\n'
          }
          for f,x in prefixes.items():
              q=Path(f); q.write_text(x+q.read_text())

          q=Path('FIDUNIO-BUILD-CHECKLIST.md'); t=q.read_text()
          marker='- [ ] **Group sender time — 0.9.9.15 candidate:'
          if marker in t:
              line=[ln for ln in t.splitlines(True) if ln.startswith(marker)][0]
              repl='- [ ] **Group sender time — 0.9.9.16 correction:** 0.9.9.15 device test showed names but no time on existing projected group rows; display now falls back from legacy `time` to authoritative `createdAt`; pending iPhone/iPad device acceptance.\n'
              t=t.replace(line,repl,1)
          else:
              t='- [ ] **Group sender time — 0.9.9.16 correction:** display sender name plus resolved message time using legacy `time` or authoritative `createdAt`; pending device acceptance.\n'+t
          q.write_text(t)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js version.js service-worker.js outbox-reconciliation-boundary.test.mjs direct-message-basic-path.test.mjs group-sender-time.test.mjs CURRENT-REBUILD.md hermes-memory.txt DEVICE-ACCEPTANCE-BUGS.md FIDUNIO-BUILD-CHECKLIST.md
          git commit -m "Fix group sender time from createdAt"
          git push
