name: Reconcile Group Integration Repair Once
on:
  push:
    branches: [fidunio-complete-rebuild]
permissions:
  contents: write
jobs:
  update:
    if: github.event.head_commit.message == 'Queue group integration repair documentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-complete-rebuild
          fetch-depth: 0
      - name: Reconcile durable docs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('FIDUNIO-BUILD-CHECKLIST.md'); s=p.read_text()
          marker='- 2026-09-06 — Earlier-history grant foundation: user approved an admin-selected starting point/date including Beginning of conversation. `e2ee-account-group-history-crypto.js` now provides message-granular account-to-account grant encryption so a date boundary never requires disclosure of an entire historical epoch. Dedicated crypto tests are part of the security gate. Overall first-rebuild estimate remains approximately 65% until Firestore/runtime/UI/purge integration completes.'
          add='\n- 2026-09-06 — Repository-first audit after history-grant foundation found a bounded group-administration bridge defect: `e2ee-account-group-app-integration.js` exported rename/add/remove/leave wrappers without importing their controller delegates. Commit `8b72f00744cc4b882c7fb1df0ce48d3959f563ec` repaired the imports; the integration gate now explicitly checks all four delegates. Version checkpoint advanced to 0.9.6.6. Overall first-rebuild estimate remains approximately 65%.'
          if add.strip() not in s: s=s.replace(marker,marker+add)
          p.write_text(s)
          p=Path('BUG-LIST.md'); s=p.read_text()
          note='''\n\n### Group administration bounded bridge — resolved 2026-09-06\n- Repository-first audit found `e2ee-account-group-app-integration.js` exported `renameGroupForApp`, `addGroupMemberForApp`, `removeGroupMemberForApp`, and `leaveGroupForApp` but did not import the delegated controller functions.\n- Root cause: the earlier source-presence gate verified wrapper text/ownership boundaries but did not verify that each delegate was actually imported.\n- Fixed in commit `8b72f00744cc4b882c7fb1df0ce48d3959f563ec`; `e2ee-account-group-app-integration.test.mjs` now gates all four controller imports and delegation paths.\n- No Firebase, crypto, UI, or ownership boundary was moved. This is a bounded wiring repair.\n'''
          if '### Group administration bounded bridge — resolved 2026-09-06' not in s:
              s=s.replace('\n## Development rule',note+'\n## Development rule')
          p.write_text(s)
          with Path('hermes-memory.txt').open('a') as f:
              f.write('''\n\n2026-09-06 — GROUP ADMINISTRATION BRIDGE REPAIR / 0.9.6.6\n- Before extending earlier-history persistence, repository-first source audit found a concrete bounded regression in `e2ee-account-group-app-integration.js`: its four Group Info administration wrappers referenced controller delegates that were not imported.\n- Repaired the import surface without changing ownership: app integration -> app controller -> group service/runtime -> Firebase adapter -> firebase.js remains authoritative.\n- Strengthened `e2ee-account-group-app-integration.test.mjs` so rename/add/remove/leave must all be imported from the controller and delegated through the bounded bridge.\n- Version checkpoint advanced to 0.9.6.6.\n- The prior full Rebuild Baseline Security Gate run `34046083575` completed green including the new group-history grant crypto test. A fresh gate is required for this wiring repair before treating the checkpoint as validated.\n- Earlier-history Firestore schema/rules/runtime/UI/purge linkage remain unfinished; do not enable the Group Info history-sharing control yet.\n- Overall first complete rebuild estimate remains approximately 65%.\n''')
          PY
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md BUG-LIST.md
          git commit -m "Reconcile group integration repair documentation"
          git push origin HEAD:fidunio-complete-rebuild
