name: Temporary reaction docs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-reaction-docs.yml'
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: python3 .github/reaction-finalize-no-workflow.py
      - run: npm run test:message-reactions
      - run: npm run test:pending-message-delete
      - run: npm run test:release-candidate-ui
      - run: git diff --check
      - name: Publish
        run: |
          rm -f .github/reaction-finalize.py
          rm -f .github/reaction-finalize-no-workflow.py
          rm -f .github/workflows/temp-reaction-finalize.yml
          rm -f .github/workflows/temp-reaction-docs.yml
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Document FIDUNIO 1.1.43 message reactions"
          git push origin HEAD:main
