name: Temporary iOS lifecycle source writer

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply iOS lifecycle source correction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source and documentation correction
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/tmp-ios-lifecycle-fix.yml').read_text()
          start=src.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=src.index("\n          PY\n",start)
          script=src[start:end]
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())

          # Replace the failed baseline-workflow insertion with a no-op here;
          # the baseline workflow is updated separately through the GitHub connector.
          begin=script.index("wf=Path('.github/workflows/rebuild-baseline-security.yml')")
          finish=script.index("note_current=", begin)
          script=script[:begin]+script[finish:]

          # The GitHub Actions token cannot modify workflow files. Keep the temporary
          # writer files untouched in this runner; they are removed through the connector.
          script=script.replace("# Remove this temporary writer from the final tree.\nPath('.github/workflows/tmp-ios-lifecycle-fix.yml').unlink()\n","")

          exec(compile(script,'ios-lifecycle-source-writer','exec'),{'__name__':'__main__'})
          PY
      - name: Run focused lifecycle gate
        run: node ios-foreground-lifecycle.test.mjs
      - name: Commit source correction
        run: |
          git config user.name "willyros01"
          git config user.email "willyros01@gmail.com"
          git add app.js version.js service-worker.js ios-foreground-lifecycle.test.mjs CURRENT-REBUILD.md hermes-memory.txt README.md DEVICE-ACCEPTANCE-BUGS.md BUG-LIST.md FIDUNIO-BUILD-CHECKLIST.md FCM-NOTIFICATION-ARCHITECTURE.md DETERMINISTIC-UI-LIFECYCLE.md
          git commit -m "Stabilize deterministic iOS foreground lifecycle"
          git push origin HEAD:main
