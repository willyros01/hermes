name: Temporary iOS lifecycle fix

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage deterministic iOS foreground lifecycle fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded lifecycle correction
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path); s=p.read_text()
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {n}')
              p.write_text(s.replace(old,new,1))

          app=Path('app.js')
          s=app.read_text()

          old='''    if(state.route==="settings")renderSettings();\n  })().finally(()=>{e2eePublishPromise=null;});'''
          new='''    // Device-registry publication is background account state. Do not rebuild\n    // Settings here: its owned account panels may already be hydrating, and a\n    // second structural render would invalidate that generation.\n  })().finally(()=>{e2eePublishPromise=null;});'''
          if s.count(old)!=1: raise SystemExit('publishMyE2EEKey Settings rerender anchor mismatch')
          s=s.replace(old,new,1)

          old='''        ensureActiveCloudMessageSubscription(true);\n        void applyPendingNotificationRoute();'''
          new='''        ensureActiveCloudMessageSubscription();\n        void applyPendingNotificationRoute();'''
          if s.count(old)!=1: raise SystemExit('auth callback subscription anchor mismatch')
          s=s.replace(old,new,1)

          old='''    ensureActiveCloudMessageSubscription(true);\n    void applyPendingNotificationRoute();\n    if(firebaseUser && state.online) scheduleReconnectRecovery();'''
          new='''    ensureActiveCloudMessageSubscription();\n    void applyPendingNotificationRoute();\n    if(firebaseUser && state.online) scheduleReconnectRecovery();'''
          if s.count(old)!=1: raise SystemExit('post-init subscription anchor mismatch')
          s=s.replace(old,new,1)

          old='''function recoverForegroundCloudSession(){\n  state.online=navigator.onLine;\n  void applyPendingNotificationRoute();\n  // Lifecycle recovery is one of the few times we deliberately replace the\n  // listener. Normal conversation metadata snapshots no longer restart it.\n  ensureActiveCloudMessageSubscription(true);\n  if(state.online) scheduleReconnectRecovery();\n  render();\n}'''
          new='''let foregroundRecoveryTail=Promise.resolve();\nlet foregroundLifecycleActive=document.visibilityState==="visible";\nfunction recoverForegroundCloudSession(){\n  const resumeNeeded=!foregroundLifecycleActive;\n  foregroundLifecycleActive=true;\n  const run=foregroundRecoveryTail.then(async()=>{\n    state.online=navigator.onLine;\n    // A notification route owns its one forced direct-message subscription.\n    // Otherwise a genuine background -> foreground transition may rebind once.\n    // Duplicate iOS visibility/pageshow events must never restart the listener.\n    const routed=await applyPendingNotificationRoute();\n    ensureActiveCloudMessageSubscription(resumeNeeded&&!routed);\n    if(state.online) scheduleReconnectRecovery();\n  });\n  foregroundRecoveryTail=run.catch(err=>console.warn("Foreground cloud recovery failed",err));\n  return run;\n}'''
          if s.count(old)!=1: raise SystemExit('foreground recovery anchor mismatch')
          s=s.replace(old,new,1)

          old='''document.addEventListener("visibilitychange",()=>{\n  if(document.visibilityState==="visible") recoverForegroundCloudSession();\n});'''
          new='''document.addEventListener("visibilitychange",()=>{\n  if(document.visibilityState==="visible") void recoverForegroundCloudSession();\n  else foregroundLifecycleActive=false;\n});\nwindow.addEventListener("pagehide",()=>{foregroundLifecycleActive=false;});'''
          if s.count(old)!=1: raise SystemExit('visibility lifecycle anchor mismatch')
          s=s.replace(old,new,1)

          old='''window.addEventListener("pageshow",recoverForegroundCloudSession);'''
          new='''window.addEventListener("pageshow",()=>{void recoverForegroundCloudSession();});'''
          if s.count(old)!=1: raise SystemExit('pageshow anchor mismatch')
          s=s.replace(old,new,1)
          app.write_text(s)

          # Release and deterministic cache retirement.
          replace_once('version.js','version: "1.1.10"','version: "1.1.11"','version bump')
          replace_once('service-worker.js','const SHELL_REVISION="1.1.10-notification-message-projection";','const SHELL_REVISION="1.1.11-ios-foreground-lifecycle";','service worker revision')

          test='''import fs from "node:fs";\nimport assert from "node:assert/strict";\n\nconst app=fs.readFileSync(new URL("./app.js",import.meta.url),"utf8");\nconst sw=fs.readFileSync(new URL("./service-worker.js",import.meta.url),"utf8");\nconst version=fs.readFileSync(new URL("./version.js",import.meta.url),"utf8");\n\nconst recovery=app.match(/let foregroundRecoveryTail=Promise\\.resolve\\(\\);[\\s\\S]*?window\\.addEventListener\\(\"online\"/u)?.[0]||"";\nassert.match(recovery,/foregroundLifecycleActive=document\\.visibilityState===?\"visible\"/u);\nassert.match(recovery,/const routed=await applyPendingNotificationRoute\\(\\)/u);\nassert.match(recovery,/ensureActiveCloudMessageSubscription\\(resumeNeeded&&!routed\\)/u);\nassert.doesNotMatch(recovery,/\\n\\s*render\\(\\);/u,"foreground recovery must not structurally rerender the active screen");\nassert.match(app,/else foregroundLifecycleActive=false;/u);\nassert.match(app,/window\\.addEventListener\\(\"pagehide\",\\(\\)=>\\{foregroundLifecycleActive=false;\\}\\);/u);\n\nconst publish=app.match(/async function publishMyE2EEKey\\(\\)\\{[\\s\\S]*?return e2eePublishPromise;\\n\\}/u)?.[0]||"";\nassert.ok(publish,"publishMyE2EEKey block must exist");\nassert.doesNotMatch(publish,/renderSettings\\(\\)/u,"background device publication must not invalidate Settings hydration");\n\nconst init=app.match(/async function initializeFirebaseLayer\\(\\)\\{[\\s\\S]*?\\n\\}/u)?.[0]||"";\nassert.doesNotMatch(init,/ensureActiveCloudMessageSubscription\\(true\\)/u,"Firebase initialization must not repeatedly force-restart the active listener");\n\nassert.match(version,/version: \"1\\.1\\.11\"/u);\nassert.match(sw,/SHELL_REVISION=\"1\\.1\\.11-ios-foreground-lifecycle\"/u);\nconsole.log("iOS foreground lifecycle stabilization gate passed");\n'''
          Path('ios-foreground-lifecycle.test.mjs').write_text(test)

          wf=Path('.github/workflows/rebuild-baseline-security.yml')
          w=wf.read_text()
          anchor='''      - name: Notification tap message projection\n        run: node notification-message-projection.test.mjs\n'''
          addition=anchor+'''      - name: iOS foreground lifecycle stabilization\n        run: node ios-foreground-lifecycle.test.mjs\n'''
          if w.count(anchor)!=1: raise SystemExit('baseline workflow notification projection anchor mismatch')
          wf.write_text(w.replace(anchor,addition,1))

          note_current='''### FIDUNIO 1.1.11 — deterministic iOS foreground lifecycle stabilization\n\nReal-device 1.1.10 acceptance showed the notification-tap projection correction was fast on iPhone but still delayed on iPad, and the user also observed Settings-owned Profile/User Administration/Invitations appearing late. Source diagnosis found an iOS resume lifecycle collision: `visibilitychange`, `pageshow`, Firebase initialization, and notification routing could each force-restart the same active direct-message listener, while background device-key publication could structurally rebuild Settings during its account-panel hydration. 1.1.11 gives foreground recovery one serialized lifecycle path, records true background/foreground transitions, permits at most one resume rebind, lets a notification route own its own single forced subscription, and removes the unrelated Settings rebuild after device-registry publication. No timer, MutationObserver, reload, second Firestore owner, E2EE change, notification payload change, or two-pane redesign is introduced. iPhone/iPad warm/cold notification-tap latency and immediate Settings-panel stability require device acceptance.\n\n'''
          for name in ['CURRENT-REBUILD.md','hermes-memory.txt']:
              p=Path(name); p.write_text(note_current+p.read_text())

          readme='''## 1.1.11 — iOS foreground lifecycle stabilization — 2026-09-09\n\n- Previous runtime: 1.1.10. New runtime: 1.1.11.\n- Reason: 1.1.10 improved direct notification-tap message projection, but real-device testing still showed a smaller delay on iPhone and an unacceptable delay on iPad; Settings account panels could also appear late after resume.\n- Root cause addressed: duplicate iOS foreground lifecycle events and Firebase startup could repeatedly force-restart the same direct-message subscription; background device-registry publication could also rebuild Settings while its account-panel owner was hydrating.\n- Correction: one serialized foreground recovery path, one genuine resume rebind at most, notification route retains sole forced route subscription, and no structural Settings rebuild from device publication.\n- Protected behavior: existing direct notifications (including optional FIDUNIO display name), PIN, account E2EE, Outbox, receipts, groups, attachments, iPad two-pane layout, and Firebase backend configuration are unchanged.\n- Validation: repository gate added; iPhone/iPad warm/cold notification-tap and Settings-panel device acceptance required. No Firebase deployment is required.\n\n'''
          p=Path('README.md'); p.write_text(readme+p.read_text())

          bug='''### DA-NOTIF-002 — iOS notification-tap / resume lifecycle latency\n- Build observed: 1.1.10.\n- Devices: iPhone (minor residual delay), iPad (unacceptable delay).\n- Related observation: Settings Profile/User Administration/Invitations could populate late after resume.\n- Expected: notification tap projects the authoritative new direct message promptly and Settings-owned panels remain stable once mounted.\n- Cause allocated to duplicate foreground lifecycle rebind/render activity, not notification sender-name privacy mode.\n- Repair candidate: 1.1.11 deterministic foreground lifecycle stabilization.\n- Status: REPOSITORY CANDIDATE; device acceptance pending.\n- Exit: warm/cold notification taps on iPhone+iPad are prompt and Settings account panels do not disappear/restart during foreground resume.\n\n'''
          for name in ['DEVICE-ACCEPTANCE-BUGS.md','BUG-LIST.md']:
              p=Path(name); p.write_text(bug+p.read_text())

          checklist='''### 1.1.11 iOS foreground lifecycle candidate\n- [x] Preserve one direct-message Firestore/E2EE projection owner.\n- [x] Serialize foreground recovery and distinguish genuine resume from duplicate iOS lifecycle events.\n- [x] Notification route owns its single forced subscription; duplicate pageshow/visibility events do not restart it.\n- [x] Background E2EE device publication no longer structurally rebuilds Settings during hydration.\n- [x] Bump visible version and service-worker revision for deterministic cache retirement.\n- [ ] Full repository security gate green for exact final commit.\n- [ ] GitHub Pages deploy green for exact final commit.\n- [ ] iPhone warm/cold notification-tap latency accepted.\n- [ ] iPad warm/cold notification-tap latency accepted.\n- [ ] Settings Profile/User Administration/Invitations appear without restart/disappearance after resume.\n\n'''
          p=Path('FIDUNIO-BUILD-CHECKLIST.md'); p.write_text(checklist+p.read_text())

          fcm='''\n## 1.1.11 iOS foreground lifecycle stabilization\nReal-device 1.1.10 testing showed that notification delivery/routing remained correct but iOS foreground lifecycle events could repeatedly force-rebind the already-owned direct-message listener. 1.1.11 does not change FCM payloads, token ownership, server notification authority, or notification-click routing. The app lifecycle now serializes foreground recovery, distinguishes a genuine resume from duplicate `visibilitychange`/`pageshow` events, and allows the notification route to own its single forced message subscription. Device acceptance remains required.\n'''
          p=Path('FCM-NOTIFICATION-ARCHITECTURE.md'); p.write_text(p.read_text()+fcm)

          det='''\n## 1.1.11 iOS resume lifecycle application\nThe foreground lifecycle now records background/foreground state and runs resume recovery through one serialized path. Duplicate iOS `visibilitychange` and `pageshow` events are idempotent: they do not repeatedly restart the same message listener or structurally rerender Settings. A notification route owns its one forced direct-message subscription; an ordinary genuine resume may rebind once. Background device-registry publication does not rebuild the Settings shell while its owned account panels are hydrating.\n'''
          p=Path('DETERMINISTIC-UI-LIFECYCLE.md'); p.write_text(p.read_text()+det)

          # Remove this temporary writer from the final tree.
          Path('.github/workflows/tmp-ios-lifecycle-fix.yml').unlink()
          PY
      - name: Run focused lifecycle gate
        run: node ios-foreground-lifecycle.test.mjs
      - name: Commit deterministic correction
        run: |
          git config user.name "willyros01"
          git config user.email "willyros01@gmail.com"
          git add -A
          git commit -m "Stabilize deterministic iOS foreground lifecycle"
          git push origin HEAD:main
