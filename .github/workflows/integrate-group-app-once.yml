name: Integrate Group App Once
on:
  push:
    branches: [fidunio-complete-rebuild]
    paths: ['.github/workflows/integrate-group-app-once.yml']
permissions:
  contents: write
jobs:
  materialize-group-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: fidunio-complete-rebuild}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Execute reviewed materializer body
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          raw=Path('.github/workflows/group-admin-once.yml').read_text()
          start_marker='      - name: Materialize atomic group administration\n        run: |\n'
          end_marker='      - name: Syntax checks\n'
          assert start_marker in raw and end_marker in raw
          body=raw.split(start_marker,1)[1].split(end_marker,1)[0]
          lines=[]
          for line in body.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script='\n'.join(lines)+'\n'
          Path('/tmp/group-admin-materialize.sh').write_text(script)
          subprocess.run(['bash','/tmp/group-admin-materialize.sh'],check=True)
          PY
      - name: Reconcile group ownership assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('e2ee-account-group-app-controller.test.mjs');s=p.read_text()
          old='["legacy app still has explicit disabled marker until bounded wiring",/Group messaging is intentionally disabled until group E2EE is implemented/.test(app)]'
          new='["app uses bounded real group administration bridge",/renameGroupForApp/.test(app)&&/addGroupMemberForApp/.test(app)&&/removeGroupMemberForApp/.test(app)&&/leaveGroupForApp/.test(app)&&!/Group messaging is intentionally disabled until group E2EE is implemented/.test(app)]'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
      - name: Syntax checks
        run: |
          node --check app.js
          node --check firebase.js
          node --check e2ee-account-group-runtime.js
          node --check e2ee-account-group-app-controller.js
          node --check e2ee-account-group-app-integration.js
      - name: Install test dependencies
        run: npm install --ignore-scripts
      - name: Group runtime tests
        run: npm run test:e2ee-account-group-runtime
      - name: Group app ownership tests
        run: |
          npm run test:e2ee-account-group-service
          npm run test:e2ee-account-group-app-controller
          npm run test:e2ee-account-group-app-integration
      - name: Group Firestore rules tests
        run: npm run emulator:test:group-e2ee-rules
      - name: Runtime authority tests
        run: npm run test:runtime-authority
      - name: Commit validated group administration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js firebase.js firestore.rules e2ee-account-group-firebase-adapter.js e2ee-account-group-runtime.js e2ee-account-group-service.js e2ee-account-group-app-controller.js e2ee-account-group-app-integration.js e2ee-account-group-runtime.test.mjs e2ee-account-group-app-controller.test.mjs firestore-group-e2ee-v1.rules.test.mjs ACCOUNT-E2EE-GROUP-MESSAGE-FORMAT.md FIRESTORE-GROUP-E2EE-V1-RULES.md group-data-model.txt architecture-ownership.txt RUNTIME-AUTHORITY-MAP.md DETERMINISTIC-UI-LIFECYCLE.md hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md
          git commit -m "Materialize atomic group administration"
          git push origin HEAD:fidunio-complete-rebuild
