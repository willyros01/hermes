name: Materialize Account E2EE Auth Binding

on:
  push:
    branches: [fidunio-rebuild-baseline-2026-09-05]
    paths:
      - 'materialize-account-e2ee-auth-binding.mjs'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize account E2EE auth binding
        run: node materialize-account-e2ee-auth-binding.mjs
      - name: Validate bounded lifecycle integration
        run: |
          node --check app.js
          node --check e2ee-account-runtime.js
          node --check e2ee-account-lifecycle.js
          npm run test:e2ee-account-lifecycle
          npm run test:firebase-e2ee-adapter
          npm run test:runtime-transform-anchors
          npm run test:runtime-authority
          git diff --check
      - name: Commit account E2EE auth binding
        run: |
          git config user.name 'willyros01'
          git config user.email 'willyros01@gmail.com'
          git add app.js runtime-authority-gate.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bind account E2EE to Firebase auth lifecycle'
          git push
