name: Materialize runtime receipt logic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-runtime-receipts.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize receipt logic into app source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('app.js')
          app = app_path.read_text()
          needle = '''      const existing=state.messages[conversationId] || [];
                const peerKey=await peerPublicKeyForConversation(conversationId,{refresh:true});'''.replace('                const peerKey','      const peerKey')
          replacement = '''      const existing=state.messages[conversationId] || [];
                if(!meta.fromCache){
                  const rawStateById=new Map(rows.map(r=>[r.id,r.state||"sent"]));
                  let receiptChanged=false;
                  for(const local of existing){if(!local?.mine)continue;const next=rawStateById.get(local.id);if(next&&next!==local.state){local.state=next;receiptChanged=true;}}
                  if(receiptChanged&&state.route==="chat"&&String(state.selectedId)===String(conversationId))render();
                  if(state.route==="chat"&&String(state.selectedId)===String(conversationId)){
                    const unreadRows=rows.filter(r=>r.senderUid!==firebaseUser.uid&&(r.state||"sent")!=="read");
                    if(unreadRows.length)await Promise.allSettled(unreadRows.map(r=>updateCloudMessageState(conversationId,r.id,"read")));
                  }
                }
                const peerKey=await peerPublicKeyForConversation(conversationId,{refresh:true});'''.replace('                if(!meta','      if(!meta').replace('                  const raw','        const raw').replace('                  let receipt','        let receipt').replace('                  for(const local','        for(const local').replace('                  if(receipt','        if(receipt').replace('                  if(state.route','        if(state.route').replace('                    const unread','          const unread').replace('                    if(unread','          if(unread').replace('                  }\n                }\n                const peerKey','        }\n      }\n      const peerKey')
          if app.count(needle) != 1:
              raise SystemExit(f'Expected one receipt insertion anchor, found {app.count(needle)}')
          app = app.replace(needle, replacement, 1)
          app_path.write_text(app)

          sw_path = Path('service-worker.js')
          sw = sw_path.read_text()
          start = sw.find('  const receiptNeedle=')
          marker = '  source=source.replace(receiptNeedle,receiptReplacement);\n\n'
          if start < 0:
              raise SystemExit('receiptNeedle block not found in service-worker.js')
          end = sw.find(marker, start)
          if end < 0:
              raise SystemExit('receipt replacement end marker not found')
          end += len(marker)
          sw = sw[:start] + sw[end:]
          if 'receiptNeedle' in sw or 'receiptReplacement' in sw:
              raise SystemExit('receipt source transform still present after removal')
          sw_path.write_text(sw)

          version_path = Path('version.js')
          version = version_path.read_text()
          if '0.9.5.3' not in version:
              raise SystemExit('Expected version 0.9.5.3 before first consolidation increment')
          version_path.write_text(version.replace('0.9.5.3','0.9.5.4',1))

          inv_path = Path('RUNTIME-TRANSFORM-INVENTORY.md')
          inv = inv_path.read_text()
          old = '1. **Live receipt reconciliation / read promotion — production-critical**'
          new = '1. **Live receipt reconciliation / read promotion — MATERIALIZED IN AUTHORITATIVE SOURCE IN 0.9.5.4 — VALIDATION PENDING**'
          if old not in inv:
              raise SystemExit('Inventory receipt item not found')
          inv_path.write_text(inv.replace(old,new,1))

          plan_path = Path('RUNTIME-CONSOLIDATION-PLAN.md')
          plan = plan_path.read_text()
          progress = '''\n\n## Consolidation progress\n\n- **0.9.5.4 — Increment 1:** live direct-message receipt reconciliation/read promotion has been copied verbatim from the service-worker transform into authoritative `app.js`; the corresponding service-worker source transform has been removed. Validation is required before materializing E2EE v2 transforms.\n'''
          if '## Consolidation progress' not in plan:
              plan_path.write_text(plan + progress)
          else:
              raise SystemExit('Consolidation progress section already exists; stop rather than duplicate')
          PY

      - name: Verify bounded change
        run: |
          grep -q 'rawStateById=new Map' app.js
          ! grep -q 'receiptNeedle' service-worker.js
          grep -q '0.9.5.4' version.js

      - name: Commit materialized receipt source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js service-worker.js version.js RUNTIME-TRANSFORM-INVENTORY.md RUNTIME-CONSOLIDATION-PLAN.md
          git commit -m 'Materialize receipt logic into authoritative runtime source'
          git push
