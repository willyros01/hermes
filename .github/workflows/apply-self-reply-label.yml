name: Apply Self Reply Label
on:
  push:
    branches: [main]
    paths:
      - apply-self-reply-label.py
      - .github/workflows/apply-self-reply-label.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded patch
        run: python3 apply-self-reply-label.py
      - name: Validate bounded change
        run: |
          node --check app.js
          node group-reply-policy.test.mjs
          git diff --check
      - name: Commit adjustment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adjust self-reply label in group chat"
          git push origin main
