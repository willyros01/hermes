name: Materialize E2EE v1 Rules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-e2ee-v1-rules.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Materialize validated staged rules
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const { default: stagedRules } = await import('./firestore-e2ee-v1-staged-rules.mjs');
          fs.writeFileSync('firestore.rules', stagedRules);
          NODE
      - name: Commit bounded rules merge
        run: |
          if git diff --quiet -- firestore.rules; then
            echo 'No rules change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firestore.rules
          git commit -m 'Merge validated account E2EE v1 Firestore rules'
          git push
