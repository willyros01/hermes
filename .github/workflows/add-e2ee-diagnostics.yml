name: Add read-only E2EE diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-e2ee-diagnostics.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add bounded read-only diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          # Add one read-only cloud metadata diagnostic API. It never returns ciphertext
          # or private key material and performs no writes.
          p=Path('firebase.js')
          s=p.read_text()
          anchor='export async function sendCloudMessage(conversationId,message){'
          if anchor not in s: raise SystemExit('firebase diagnostic anchor missing')
          fn='''export async function getCloudE2EEDiagnosticSnapshot(){const s=await ensureServices();if(!authUser)throw new Error("Sign in first.");const q=s.fsSdk.query(s.fsSdk.collection(s.db,"conversations"),s.fsSdk.where("members","array-contains",authUser.uid));const convSnap=await s.fsSdk.getDocs(q);const conversations=[];for(const d of convSnap.docs){const x=d.data(),members=Array.isArray(x.members)?x.members:[],other=members.find(uid=>uid!==authUser.uid)||null,msgQ=s.fsSdk.query(s.fsSdk.collection(s.db,"conversations",d.id,"messages"),s.fsSdk.orderBy("createdAt","asc"));const msgSnap=await s.fsSdk.getDocs(msgQ);const messages=msgSnap.docs.map(m=>{const r=m.data(),envelopes=r.envelopes&&typeof r.envelopes==="object"?Object.keys(r.envelopes):[];return{id:m.id,e2ee:Number(r.e2ee||0),senderUid:r.senderUid||"",senderDeviceId:r.senderDeviceId||"",senderDevicePublicJwk:r.senderDevicePublicJwk||null,envelopeDeviceIds:envelopes,recipientDeviceIds:Array.isArray(r.recipientDeviceIds)?r.recipientDeviceIds:[],state:r.state||"sent",timeLabel:r.timeLabel||""};});conversations.push({id:d.id,peerUid:other,name:x.memberNames?.[other]||"FIDUNIO contact",messages});}return{uid:authUser.uid,email:authUser.email||"",conversations};}\n'''
          p.write_text(s.replace(anchor,fn+anchor,1))

          # Diagnostic page is intentionally separate from app.js/Settings so the
          # validated UI and runtime state machine remain untouched.
          Path('e2ee-diagnostics.html').write_text('''<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>FIDUNIO E2EE Diagnostics</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./styles-0.9.0.css">
  <script src="./version.js"></script>
</head>
<body>
  <main class="app-shell" style="max-width:900px;margin:0 auto;min-height:100vh">
    <header class="topbar"><a class="back-btn" href="./" aria-label="Back">‹</a><h1>E2EE Diagnostics</h1><span class="topbar-spacer"></span></header>
    <section class="content" id="diagRoot"><div class="card"><h2>Read-only diagnostic</h2><p class="small-note">Loading local device identities and cloud envelope metadata…</p></div></section>
  </main>
  <script type="module" src="./e2ee-diagnostics.js"></script>
</body>
</html>''')

          Path('e2ee-diagnostics.js').write_text(r'''import {initFirebase,getFirebaseUser,getCloudE2EEDiagnosticSnapshot} from "./firebase.js";

const root=document.querySelector("#diagRoot");
const VERSION=globalThis.FIDUNIO_RELEASE?.version||"unknown";
const esc=(s="")=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=(s="")=>{s=String(s||"");return s.length>18?`${s.slice(0,10)}…${s.slice(-6)}`:s||"—";};
const canon=j=>JSON.stringify({kty:j?.kty||"",crv:j?.crv||"",x:j?.x||"",y:j?.y||""});
async function fp(jwk){if(!jwk)return"—";const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(canon(jwk)));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase().match(/.{1,4}/g).join(" ");}
function req(r){return new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
function openExisting(name){return new Promise((resolve,reject)=>{const r=indexedDB.open(name);let created=false;r.onupgradeneeded=()=>{created=true;r.transaction.abort();};r.onsuccess=()=>created?reject(new Error("Database did not previously exist")):resolve(r.result);r.onerror=()=>reject(r.error||new Error("Could not open database"));});}
async function dbNames(){if(typeof indexedDB.databases!=="function")return null;const rows=await indexedDB.databases();return rows.map(x=>x.name).filter(Boolean);}
async function readMetaIdentity(db){if(!db.objectStoreNames.contains("meta"))return null;const store=db.transaction("meta","readonly").objectStore("meta");const [kp,id,active]=await Promise.all([req(store.get("e2ee-device-keypair-v1")),req(store.get("e2ee-device-identity-v1")),req(store.get("account-storage-active-uid-v3"))]);return{deviceId:id?.deviceId||null,publicJwk:kp?.publicJwk||null,activeUid:active||null};}
async function readVault(name){const db=await openExisting(name);try{if(!db.objectStoreNames.contains("snapshots"))return[];const store=db.transaction("snapshots","readonly").objectStore("snapshots"),[keys,vals]=await Promise.all([req(store.getAllKeys()),req(store.getAll())]);const out=[];for(let i=0;i<keys.length;i++){const snap=vals[i],kp=snap?.meta?.["e2ee-device-keypair-v1"]||null,id=snap?.meta?.["e2ee-device-identity-v1"]||null;if(kp?.publicJwk||id?.deviceId)out.push({slot:String(keys[i]),deviceId:id?.deviceId||null,publicJwk:kp?.publicJwk||null});}return out;}finally{db.close();}}
async function localInventory(){const names=await dbNames(),result={databaseEnumerationSupported:!!names,live:null,vaults:[]};if(names?.includes("fidunio-local")){const db=await openExisting("fidunio-local");try{result.live=await readMetaIdentity(db);}finally{db.close();}}const vaultNames=(names||[]).filter(n=>n.startsWith("fidunio-account-vault"));for(const name of vaultNames){try{result.vaults.push({name,entries:await readVault(name)});}catch(err){result.vaults.push({name,error:err?.message||String(err),entries:[]});}}return result;}
async function decorateLocal(local){if(local.live?.publicJwk)local.live.fingerprint=await fp(local.live.publicJwk);for(const v of local.vaults)for(const e of v.entries)if(e.publicJwk)e.fingerprint=await fp(e.publicJwk);return local;}
function identityRows(local){const rows=[];if(local.live?.deviceId||local.live?.publicJwk)rows.push({where:"LIVE fidunio-local",slot:local.live.activeUid?`active ${short(local.live.activeUid)}`:"active UID unavailable",...local.live});for(const v of local.vaults)for(const e of v.entries)rows.push({where:v.name,slot:e.slot,...e});return rows;}
function matchesForMessage(m,ids){return ids.filter(i=>m.envelopeDeviceIds.includes(i.deviceId)||m.recipientDeviceIds.includes(i.deviceId));}
async function render(){try{
  await new Promise(resolve=>{let first=true;initFirebase(()=>{if(first){first=false;resolve();}}).catch(()=>resolve());});
  const user=getFirebaseUser();if(!user){root.innerHTML=`<div class="card"><h2>Sign-in required</h2><p>This diagnostic page uses the existing FIDUNIO login. Return to FIDUNIO, sign in, then reopen this page.</p><a class="primary" href="./">Return to FIDUNIO</a></div>`;return;}
  const [local,cloud]=await Promise.all([decorateLocal(await localInventory()),getCloudE2EEDiagnosticSnapshot()]);
  const ids=identityRows(local);
  const idTable=ids.length?ids.map(i=>`<tr><td>${esc(i.where)}</td><td>${esc(i.slot)}</td><td>${esc(short(i.deviceId))}</td><td style="font-size:11px;word-break:break-all">${esc(i.fingerprint||"—")}</td></tr>`).join(""):'<tr><td colspan="4">No local E2EE identities found.</td></tr>';
  const convs=cloud.conversations.map(c=>{const recent=c.messages.slice(-40).reverse();const rows=recent.map(m=>{const matches=matchesForMessage(m,ids),status=m.e2ee===2?(matches.length?`Envelope matches local identity: ${matches.map(x=>short(x.deviceId)).join(", ")}`:"NO local identity matches this envelope"):m.e2ee===1?"Legacy E2EE v1 (account-key path)":"Plaintext/non-E2EE";return `<tr><td>${esc(m.timeLabel||"—")}</td><td>${esc(m.state)}</td><td>${m.e2ee}</td><td>${esc(short(m.senderDeviceId))}</td><td>${esc(m.envelopeDeviceIds.map(short).join(", ")||"—")}</td><td><strong>${esc(status)}</strong></td></tr>`;}).join("")||'<tr><td colspan="6">No messages.</td></tr>';return `<div class="card"><h2>${esc(c.name)}</h2><p class="small-note">Conversation ${esc(short(c.id))}</p><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th>Time</th><th>State</th><th>E2EE</th><th>Sender device</th><th>Envelope device IDs</th><th>Local match</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;}).join("");
  root.innerHTML=`<div class="card"><h2>FIDUNIO ${esc(VERSION)} — Read-only E2EE inventory</h2><p class="small-note">Signed in as ${esc(user.email||short(user.uid))}. This page performs no IndexedDB or Firestore writes and does not expose private keys or ciphertext.</p><p class="small-note">Database enumeration: ${local.databaseEnumerationSupported?"supported":"NOT supported by this browser"}.</p></div><div class="card"><h2>Local identities found</h2><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th>Location</th><th>Vault slot</th><th>Device ID</th><th>Public-key fingerprint</th></tr></thead><tbody>${idTable}</tbody></table></div></div>${convs||'<div class="card"><p>No cloud direct conversations found.</p></div>'}<div class="card"><button class="secondary" id="copyBtn">Copy safe diagnostic summary</button><p class="small-note">Copying includes device IDs/fingerprints and envelope metadata, but never private key material or ciphertext.</p></div>`;
  document.querySelector("#copyBtn").onclick=async()=>{const report={version:VERSION,user:short(user.uid),local:{databaseEnumerationSupported:local.databaseEnumerationSupported,identities:ids.map(i=>({where:i.where,slot:i.slot,deviceId:i.deviceId,fingerprint:i.fingerprint||null}))},cloud:{conversations:cloud.conversations.map(c=>({name:c.name,id:short(c.id),messages:c.messages.slice(-40).map(m=>({time:m.timeLabel,state:m.state,e2ee:m.e2ee,senderDeviceId:m.senderDeviceId,envelopeDeviceIds:m.envelopeDeviceIds,recipientDeviceIds:m.recipientDeviceIds,localMatchDeviceIds:matchesForMessage(m,ids).map(x=>x.deviceId)}))}))}};const text=JSON.stringify(report,null,2);try{await navigator.clipboard.writeText(text);document.querySelector("#copyBtn").textContent="Copied";}catch{prompt("Copy diagnostic summary",text);}};
}catch(err){root.innerHTML=`<div class="card"><h2>Diagnostic could not complete</h2><p class="warning-note">${esc(err?.message||String(err))}</p><p class="small-note">No data was changed.</p></div>`;}}
render();
''')

          # Version and durable bug note only. app.js/service-worker/account storage are untouched.
          p=Path('version.js')
          s=p.read_text().replace('version: "0.9.5.5"','version: "0.9.5.6"')
          p.write_text(s)

          p=Path('BUG-LIST.md')
          s=p.read_text()
          old='- Status: **awaiting iPad/iPhone validation.**\n\n### PIN / Local Security\n'
          new='''- 0.9.5.5 result on iPad: current 0.9.5.4-era messages remain readable with correct receipts, but older 6:58/6:59 PM E2EE-v2 messages still report unavailable. Therefore 0.9.5.5 did not recover the historical identity.\n- **0.9.5.6 diagnostic-only build:** adds a separate `e2ee-diagnostics.html` page that inventories existing local/vault device IDs and public-key fingerprints and compares them with cloud message envelope device IDs. It is read-only: no app-state, key, vault, message, receipt, or Firebase writes.\n- Status: **diagnostic collection pending. No further key recovery until the report identifies whether the historical device identity still exists locally.**\n\n### PIN / Local Security\n'''
          if old not in s: raise SystemExit('bug list diagnostic anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify diagnostic-only scope
        run: |
          grep -q 'getCloudE2EEDiagnosticSnapshot' firebase.js
          grep -q 'Read-only E2EE inventory' e2ee-diagnostics.js
          grep -q 'version: "0.9.5.6"' version.js
          git diff --check
          test -z "$(git diff --name-only | grep -E '^(app.js|service-worker.js|account-storage.js|settings-lifecycle.js)$' || true)"
      - name: Commit diagnostic build
        run: |
          git config user.name 'willyros01'
          git config user.email 'willyros01@gmail.com'
          git add firebase.js e2ee-diagnostics.html e2ee-diagnostics.js version.js BUG-LIST.md
          git commit -m 'Add read-only E2EE identity diagnostics'
          git push
