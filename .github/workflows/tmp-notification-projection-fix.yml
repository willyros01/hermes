name: Temporary Notification Projection Fix

on:
  push:
    branches: [notification-projection-fix]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: notification-projection-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded notification projection correction
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text()
          anchor = '''      const last=merged.at(-1);\n      if(last){\n        c.preview=messagePreview(last.text);\n        c.time=last.time;\n      }\n\n      /*\n       * Local-first durability:\n'''
          replacement = '''      const last=merged.at(-1);\n      if(last){\n        c.preview=messagePreview(last.text);\n        c.time=last.time;\n      }\n\n      // Project the authoritative in-memory snapshot immediately. Local\n      // durability and the existing Read-receipt write remain serialized\n      // below, but neither may hold the visible incoming message behind a\n      // network round-trip after a notification tap.\n      if(state.route==="chat" && String(state.selectedId)===String(conversationId)) render();\n\n      /*\n       * Local-first durability:\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'app.js projection anchor count={text.count(anchor)}')
          app.write_text(text.replace(anchor, replacement, 1))

          version = Path('version.js')
          v = version.read_text()
          if 'version: "1.1.9"' not in v:
              raise SystemExit('version.js is not 1.1.9')
          version.write_text(v.replace('version: "1.1.9"', 'version: "1.1.10"', 1))

          sw = Path('service-worker.js')
          s = sw.read_text()
          old = 'const SHELL_REVISION="1.1.9-fcm-sender-name";'
          new = 'const SHELL_REVISION="1.1.10-notification-message-projection";'
          if old not in s:
              raise SystemExit('service-worker revision anchor missing')
          sw.write_text(s.replace(old, new, 1))

          test = Path('notification-message-projection.test.mjs')
          test.write_text('''import assert from "node:assert/strict";\nimport {readFileSync} from "node:fs";\nconst app=readFileSync("app.js","utf8"),version=readFileSync("version.js","utf8"),sw=readFileSync("service-worker.js","utf8");\nconst start=app.indexOf("function beginCloudMessageSubscription");\nassert.ok(start>=0,"direct message subscription owner missing");\nconst projected=app.indexOf("state.messages[conversationId]=merged;",start);\nconst visible=app.indexOf('if(state.route==="chat" && String(state.selectedId)===String(conversationId)) render();',projected);\nconst cache=app.indexOf("await cacheCloudHistory(conversationId,merged);",projected);\nconst persist=app.indexOf("await persistState();",cache);\nconst receipt=app.indexOf("await markCloudConversationRead(conversationId);",persist);\nassert.ok(projected>=0&&visible>projected,"authoritative projection must drive the visible chat");\nassert.ok(visible<cache,"visible incoming message must render before local durability awaits");\nassert.ok(cache<persist&&persist<receipt,"local durability must remain before Read-receipt network work");\nassert.match(version,/version: "1\\.1\\.10"/);\nassert.match(sw,/SHELL_REVISION="1\\.1\\.10-notification-message-projection"/);\nassert.doesNotMatch(app,/setTimeout\\([^)]*notification|location\\.reload\\(\\).*notification/i);\nconsole.log("Notification-tap message projection latency gate passed");\n''')

          wf = Path('.github/workflows/rebuild-baseline-security.yml')
          w = wf.read_text()
          n5 = '      - {name: FCM N5 notification tap routing, run: npm run test:notification-n5}\n'
          step = '      - {name: Notification tap message projection, run: node notification-message-projection.test.mjs}\n'
          if step not in w:
              if n5 not in w:
                  raise SystemExit('baseline N5 anchor missing')
              w = w.replace(n5, n5 + step, 1)
          wf.write_text(w)

          section = '''### FIDUNIO 1.1.10 — notification-tap message projection latency\n\nReal-device 1.1.9 acceptance proved sender-name notifications and notification routing, but after tapping a notification the correct direct conversation could open before the newly notified message became visible. The direct Firestore subscription already owned the authoritative message projection; the delay came from awaiting encrypted local-history persistence and the Read-receipt network write before rendering that projected snapshot. 1.1.10 keeps the same sole Firestore/E2EE/message owner and renders the already-projected in-memory snapshot immediately, then preserves the existing local durability-before-receipt ordering. No timer, reload, observer, second fetch owner, notification-derived message row, or E2EE/receipt authority change is introduced. Device acceptance must confirm warm/cold notification tap opens the correct conversation and the new message appears promptly on iPhone and iPad.\n\n'''
          for name in ['CURRENT-REBUILD.md','hermes-memory.txt']:
              p=Path(name); t=p.read_text()
              if section not in t: p.write_text(section+t)

          fcm=Path('FCM-NOTIFICATION-ARCHITECTURE.md')
          ft=fcm.read_text()
          checkpoint='''\n## FIDUNIO 1.1.10 notification-tap projection checkpoint — 2026-09-09\n\nAfter a valid notification route selects the authoritative direct conversation, the existing direct Firestore subscription remains the sole message owner. Once that subscription has decrypted/projected an authoritative snapshot into application state, the active chat must render that state before waiting for encrypted local-history persistence or the existing Read-receipt network write. Persistence still precedes receipt mutation. Notification metadata still never manufactures a message row. No timer, reload, observer, second message fetcher, or second projection owner is allowed.\n'''
          if checkpoint not in ft: fcm.write_text(ft.rstrip()+checkpoint+'\n')

          bug=Path('BUG-LIST.md')
          bt=bug.read_text()
          note='''\n### Notification tap opens chat before new message appears — FIX CANDIDATE 1.1.10\nObserved after 1.1.9 sender-name notification acceptance: tapping a notification routes to the correct direct chat, but the newly notified message can remain absent until local persistence and Read-receipt network work complete. 1.1.10 renders the authoritative subscription projection immediately before those awaits while preserving persistence-before-receipt ordering. Device acceptance pending.\n'''
          if note not in bt: bug.write_text(bt.rstrip()+note+'\n')
          PY

          rm .github/workflows/tmp-notification-projection-fix.yml
          node notification-message-projection.test.mjs
          git diff --check
      - name: Commit bounded candidate
        shell: bash
        run: |
          git config user.name "FIDUNIO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js version.js service-worker.js notification-message-projection.test.mjs .github/workflows/rebuild-baseline-security.yml CURRENT-REBUILD.md hermes-memory.txt FCM-NOTIFICATION-ARCHITECTURE.md BUG-LIST.md .github/workflows/tmp-notification-projection-fix.yml
          git commit -m "Fix notification tap message projection latency"
          git push origin HEAD:notification-projection-fix
