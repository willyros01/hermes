name: FIDUNIO isolated simulator and Firebase regression suite

# TEST-ONLY: never run on main, main-3, ios, or Android release branches.
# This suite never uses deployment, Apple signing, Firebase prod auth, APNs,
# ADM, GitHub publishing, or the Cuberoot APK publisher.
on:
  push:
    branches: [simulator-tests]
    paths:
      - 'build/simulator/**'
      - '.github/workflows/simulator-suite.yml'
      - 'firebase.simulator.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fidunio-isolated-simulator-suite
  # The latest disposable diagnostic run supersedes an older stalled suite;
  # prior screenshots and artifacts remain downloadable from those run IDs.
  cancel-in-progress: true

jobs:
  reviewed-regressions:
    name: 131 Android + 4 iOS-specific reviewed functional test files
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: willyros01/hermes
          ref: feature/reaction-authors-ios
          path: ios-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies and generate web assets
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm run ios:prepare
          npm --prefix ios-src ci --no-audit --no-fund
          npm --prefix ios-src run ios:prepare
      - name: Run every reviewed source regression, fail on ANY failed file
        run: |
          set -Eeuo pipefail
          node build/simulator/run-reviewed.mjs unit out-fidunio
      - uses: actions/checkout@v4
        with:
          repository: willyros01/hermes
          ref: feature/reaction-authors-Android
          path: candidate-android
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: willyros01/hermes
          ref: feature/reaction-authors-main-3
          path: candidate-web-main3
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: willyros01/hermes
          ref: feature/reaction-authors-main
          path: candidate-web-main
          persist-credentials: false
      - name: Verify retry-safe emoji intent on all four source candidates
        run: |
          set -Eeuo pipefail
          for source in ios-src candidate-android candidate-web-main3 candidate-web-main; do
            (cd "$source" && node message-reaction-policy.test.mjs && node message-reaction-wiring.test.mjs)
          done
      - name: Save complete functional evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidunio-sim-unit
          path: out-fidunio/
          retention-days: 90
          if-no-files-found: warn

  firebase-rules:
    name: Nine Firestore rules suites against demo Firebase emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Execute exact repository Firestore rules in local emulator
        run: |
          set -Eeuo pipefail
          ./node_modules/.bin/firebase emulators:exec \
            --config firebase.simulator.json \
            --only firestore \
            --project demo-fidunio-simulator-tests \
            "node build/simulator/run-reviewed.mjs rules out-fidunio"
      - name: Save Firestore rule assertions and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidunio-sim-rules
          path: out-fidunio/
          retention-days: 90
          if-no-files-found: warn

  authenticated-flows:
    name: Real invite/direct/group/settings API transactions against demo Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: willyros01/hermes
          ref: feature/reaction-authors-ios
          path: ios-src
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: willyros01/hermes
          ref: feature/reaction-authors-main-3
          path: web-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare both disposable release-source copies and engines
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm run ios:prepare
          # A browser test, even of Android-shared source, must target 127.0.0.1;
          # Android's 10.0.2.2 alias works only INSIDE the native AVD.
          node build/simulator/patch-sandbox.mjs . ios
          npm --prefix ios-src ci --no-audit --no-fund
          npm --prefix ios-src run ios:prepare
          node build/simulator/patch-sandbox.mjs ios-src ios
          npm --prefix web-src ci --no-audit --no-fund
          npm --prefix web-src run ios:prepare
          node build/simulator/patch-sandbox.mjs web-src ios
          npx playwright install --with-deps chromium webkit
      - name: Authenticated API transactions with local Auth and Firestore rules
        run: |
          set -Eeuo pipefail
          ./node_modules/.bin/firebase emulators:exec \
            --config firebase.simulator.json \
            --only auth,firestore,storage \
            --project demo-fidunio-simulator-tests \
            "bash build/simulator/run-functional-both.sh"
      - name: Preserve complete Auth, invitation, direct/group and settings evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidunio-sim-functional
          path: out-fidunio/
          retention-days: 90
          if-no-files-found: warn

  browser-journeys:
    name: Chromium and WebKit, Android-shared and iOS-shared code
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      FIDUNIO_AUTH_EMULATOR_URL: http://127.0.0.1:9099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: willyros01/hermes
          ref: feature/reaction-authors-ios
          path: ios-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test browser engines and both shared builds
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm run ios:prepare
          npm --prefix ios-src ci --no-audit --no-fund
          npm --prefix ios-src run ios:prepare
          npx playwright install --with-deps chromium webkit
      - name: Run real-browser startup, Join, PIN and biometric simulations
        run: |
          set -Eeuo pipefail
          ./node_modules/.bin/firebase emulators:exec \
            --config firebase.simulator.json \
            --only auth,firestore,storage \
            --project demo-fidunio-simulator-tests \
            "node build/simulator/run-browser.mjs out-fidunio/browser ios-src"
      - name: Save real-browser screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidunio-sim-browser
          path: out-fidunio/
          retention-days: 90
          if-no-files-found: warn

  native-android:
    name: Disposable Android API 34 app and local Firebase emulator
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: willyros01/hermes
          ref: feature/reaction-authors-Android
          path: android-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile unsigned-for-release disposable Android debug app
        run: |
          set -Eeuo pipefail
          mkdir -p out-fidunio/android
          {
            # Install test-runner dependencies before the separate release-source checkout.
            npm ci --no-audit --no-fund
            (
              cd android-src
              npm ci --no-audit --no-fund
              npm install --no-save --no-package-lock --no-audit --no-fund @capacitor/android@8.5.2
              npm run ios:prepare
              node ../build/simulator/patch-sandbox.mjs . android
              npx cap add android
              npx cap sync android
              node ../build/simulator/permit-emulator-http.mjs .
              java build/AndroidIcons.java icon-512.png android/app/src/main/res
              chmod +x android/gradlew
              ( cd android && ./gradlew --no-daemon assembleDebug )
              test -s android/app/build/outputs/apk/debug/app-debug.apk
            )
          } 2>&1 | tee out-fidunio/android/build.log
      - name: Permit hardware-assisted Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native UI journey with ONLY localhost Firebase emulators
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # The Google APIs image repeatedly showed an unrelated Pixel Launcher
          # ANR over screenshots, despite the app WebView responding normally.
          # The standard AOSP system image uses its normal launcher and WebView.
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          script: bash build/simulator/device-with-backend.sh android out-fidunio/android android-src/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Attach exact Android release-source commit to evidence
        if: always()
        run: |
          if [ -f out-fidunio/android/auth/results.json ]; then
            node build/simulator/stamp-native-source.mjs out-fidunio/android/auth/results.json "$(git -C android-src rev-parse HEAD)"
          fi
      - name: Save actual Android screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidunio-sim-android
          path: out-fidunio/
          retention-days: 90
          if-no-files-found: warn

  native-ios:
    name: Disposable iPhone app and local Firebase emulator
    runs-on: macos-26
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: willyros01/hermes
          ref: feature/reaction-authors-ios
          path: ios-src
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare disposable iOS build and inspector bridge
        run: |
          set -Eeuo pipefail
          mkdir -p out-fidunio/ios
          brew install ios-webkit-debug-proxy
          {
            npm ci --no-audit --no-fund
            cd ios-src
            npm ci --no-audit --no-fund
            npm run ios:prepare
            node ../build/simulator/patch-sandbox.mjs . ios
            npx cap add ios
            npx cap sync ios
            # Test-only generated asset: recover from simulator WebKit's
            # nonextractable CryptoKey structured-clone limitation. The real
            # ios branch and actual release builds remain untouched.
            node ../build/simulator/patch-ios-key-clone.mjs ios/App/App/public
            plutil -replace NSFaceIDUsageDescription -string 'Test FIDUNIO simulator PIN and biometric UI' ios/App/App/Info.plist
            UDID="$(xcrun simctl list devices available -j | node -e 'const d=JSON.parse(require("fs").readFileSync(0)).devices;const all=Object.entries(d).filter(([rt])=>/iOS/.test(rt)).flatMap(([,list])=>list);const pick=all.reverse().find(x=>/^iPhone \d+$/.test(x.name));if(!pick)process.exit(1);console.log(pick.udid)')"
            echo "UDID=$UDID" >> "$GITHUB_ENV"
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/fidunio-sim-dd" CODE_SIGNING_ALLOWED=NO build
          } 2>&1 | tee out-fidunio/ios/build.log
      - name: Boot iPhone and attach Web Inspector
        run: |
          set -Eeuo pipefail
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          SOCKET="$(lsof -aUc launchd_sim 2>/dev/null | grep -o '/private/tmp/com.apple.launchd[^ ]*/com.apple.webinspectord_sim.socket' | head -1)"
          test -n "$SOCKET"
          nohup ios_webkit_debug_proxy -s "unix:$SOCKET" -F > out-fidunio/ios/inspector.log 2>&1 &
          sleep 3
      - name: Native iPhone UI journey with ONLY localhost Firebase emulators
        run: |
          set -Eeuo pipefail
          APP="$(find "$RUNNER_TEMP/fidunio-sim-dd/Build/Products" -maxdepth 2 -name App.app | head -1)"
          test -d "$APP"
          bash build/simulator/device-with-backend.sh ios out-fidunio/ios "$APP"
      - name: Attach exact iOS release-source commit to evidence
        if: always()
        run: |
          if [ -f out-fidunio/ios/auth/results.json ]; then
            node build/simulator/stamp-native-source.mjs out-fidunio/ios/auth/results.json "$(git -C ios-src rev-parse HEAD)"
          fi
      - name: Save actual iPhone screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidunio-sim-ios
          path: out-fidunio/
          retention-days: 90
          if-no-files-found: warn

  release-readiness:
    name: FAIL CLOSED - all 88 functions plus device acceptance
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [reviewed-regressions, firebase-rules, authenticated-flows, browser-journeys, native-android, native-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: willyros01/hermes
          ref: feature/reaction-authors-Android
          path: release-android
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: willyros01/hermes
          ref: feature/reaction-authors-ios
          path: release-ios
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve complete previous-job evidence, never infer passing results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: fidunio-sim-*
          path: evidence
          merge-multiple: true
      - name: Validate complete cross-platform release manifest and exact source hashes
        run: |
          node --check build/simulator/release-gate.mjs
          node build/simulator/release-gate.mjs \
            --manifest build/simulator/release-manifest.json \
            --android evidence/android/auth/results.json \
            --ios evidence/ios/auth/results.json \
            --android-sha "$(git -C release-android rev-parse HEAD)" \
            --ios-sha "$(git -C release-ios rev-parse HEAD)" \
            --attestations build/simulator/release-attestations.json \
            --output out-fidunio/release-gate.json
      - name: Preserve BLOCKED as evidence, never hide a failed release gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidunio-release-readiness
          path: out-fidunio/release-gate.*
          if-no-files-found: warn
          retention-days: 90

  archive:
    name: Preserve results and screenshots without touching release branches
    needs: [reviewed-regressions, firebase-rules, authenticated-flows, browser-journeys, native-android, native-ios]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      FIDUNIO_NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: fidunio-sim-*
          path: evidence
          merge-multiple: true
      - name: Index failed, missing and passing stages honestly
        run: node build/simulator/index-evidence.mjs evidence
      - name: Preserve every screenshot and report in simulator-evidence branch
        run: bash build/simulator/publish-evidence.sh evidence
