name: Verify FIDUNIO internal TestFlight distribution

on:
  push:
    branches: [ios]
    paths: ['.github/workflows/ios-internal-build-verify.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify build 1.1.60 (9) is in FIDUNIO Automatic Testing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          cat > /tmp/verify.mjs <<'JS'
          import crypto from "node:crypto";
          import fs from "node:fs";
          const required=n=>{const v=process.env[n];if(!v)throw new Error("missing "+n);return v};
          fs.writeFileSync("/tmp/key.p8",required("ASC_KEY_P8"),{mode:0o600});
          const enc=x=>Buffer.from(JSON.stringify(x)).toString("base64url");
          function token(){
            const now=Math.floor(Date.now()/1000);
            const msg=enc({alg:"ES256",kid:required("ASC_KEY_ID"),typ:"JWT"})+"."+enc({iss:required("ASC_ISSUER_ID"),iat:now,exp:now+900,aud:"appstoreconnect-v1"});
            const sig=crypto.sign("sha256",Buffer.from(msg),{key:fs.readFileSync("/tmp/key.p8"),dsaEncoding:"ieee-p1363"}).toString("base64url");
            return msg+"."+sig;
          }
          async function get(path){
            const r=await fetch("https://api.appstoreconnect.apple.com"+path,{headers:{Authorization:"Bearer "+token()}});
            const text=await r.text(); let json={}; try{json=JSON.parse(text)}catch{}
            if(!r.ok)throw new Error(path+" HTTP "+r.status+" "+text);
            return json;
          }
          const groupId="6b5d27b9-847e-4f64-9ca4-6902a28b4ecc";
          const buildId="8aaa520a-755c-4db6-bca0-6c5e5e0df16f";
          const group=(await get("/v1/betaGroups/"+groupId)).data;
          if(group?.attributes?.name!=="FIDUNIO Automatic Testing")throw new Error("Unexpected beta group name");
          if(group?.attributes?.isInternalGroup!==true)throw new Error("Beta group is not internal");
          const builds=await get("/v1/betaGroups/"+groupId+"/builds?limit=200");
          const match=(builds.data||[]).find(x=>x.id===buildId);
          if(!match)throw new Error("Build 1.1.60 (9) is not attached to FIDUNIO Automatic Testing");
          console.log("PASS: FIDUNIO 1.1.60 (9) build "+buildId+" is attached to internal group FIDUNIO Automatic Testing");
          JS
          node /tmp/verify.mjs
