name: Record Disappearing Read Policy Once
on:
  push:
    branches: [fidunio-complete-rebuild]
permissions:
  contents: write
jobs:
  record:
    if: github.event.head_commit.message == 'Record disappearing read-timer policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-complete-rebuild
          fetch-depth: 0
      - name: Record durable disappearing-content semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def append_once(path, marker, block):
              p=Path(path); s=p.read_text()
              if marker not in s:
                  p.write_text(s.rstrip()+"\n\n"+block.strip()+"\n")

          p=Path('FIDUNIO-BUILD-CHECKLIST.md'); s=p.read_text()
          old='| Disappearing-message policy/model | NOT DONE | Define authenticated E2EE expiry metadata and deterministic start condition/timer semantics; must work across devices without relying on a single device clock as authority. |'
          new='| Disappearing-message policy/model | IN PROGRESS | Product semantics settled: disappearance uses a fixed duration starting from the recipient\'s first authoritative Read event for both direct and group messages. In groups the timer is per recipient/account, not first-reader-global. Cloud-authoritative read timestamps, final shared-source purge convergence, exact expiry metadata/rules and anti-resurrection implementation remain to be materialized and validated. |'
          if old in s: s=s.replace(old,new,1)
          log='- 2026-09-06 — Disappearing-content timer semantics approved: for direct and group messages, each recipient/account starts its fixed disappearance interval at that recipient\'s first authoritative Read event. Group timers are therefore per recipient, not started globally by the first group reader. The shared source cannot be physically removed until every still-authorized recipient whose read window exists has reached expiry; each recipient must lose local/projected access at its own expiry. Sender/device clocks are not authority. Implementation/rules/purge/anti-resurrection remain IN PROGRESS; overall rebuild estimate remains approximately 65%.'
          if log not in s: s=s.rstrip()+"\n"+log+"\n"
          p.write_text(s)

          append_once('hermes-memory.txt','2026-09-06 — DISAPPEARING CONTENT READ-TIMER SEMANTICS','''2026-09-06 — DISAPPEARING CONTENT READ-TIMER SEMANTICS
- User selected fixed-time-after-read semantics for both individual/direct and group disappearing messages.
- Direct message: the recipient account's first authoritative Read event starts that recipient's disappearance interval.
- Group message: each recipient account has its own independent first-Read timestamp and expiry window. One member reading does NOT start the timer for the other group members.
- The read/expiry authority must be server-backed and account-scoped; a device-local wall clock or UI-only read event is not sufficient authority.
- At a recipient's expiry, that recipient must no longer retain or project FIDUNIO-controlled local/cache/plaintext/grant copies of the content.
- Because a group message has one shared Firestore source ciphertext, the shared source record can be physically purged only after all still-authorized recipient expiry windows that apply to that source have elapsed (or a recipient is otherwise no longer entitled to the message). Final purge must also delete receipts, history-grant copies/references, attachment traces, local caches/Outbox remnants, and prevent stale-device resurrection.
- No per-message tombstone or retained expired:true source record is allowed after final purge.
- This decision resolves the timer-start ambiguity but does not mark disappearing content DONE. Exact metadata schema, authoritative timestamp write path, rules, purge owner, offline convergence and tests remain to be implemented.
- Overall first-rebuild estimate remains approximately 65%.''')

          append_once('README.md','### Disappearing-content timer semantics — September 6, 2026','''### Disappearing-content timer semantics — September 6, 2026
The product decision for disappearing messages is now fixed-time-after-read for both direct and group messaging. Each recipient account starts its own timer from its first authoritative Read event. In a group, one member reading does not start other members' timers. Recipient-local visibility/cache must expire independently, while the shared Firestore source can be physically deleted only after all applicable recipient read windows have elapsed or those recipients are no longer entitled to the message. Final purge remains trace-free and includes grant copies/references and attachments. This is a semantics decision, not a completed implementation.''')

          append_once('ACCOUNT-E2EE-GROUP-MESSAGE-FORMAT.md','### Disappearing group timer semantics','''### Disappearing group timer semantics
For disappearing group messages, expiry is account-recipient specific. The first authoritative Read event for each recipient UID starts that UID's fixed disappearance interval; no other member's read event starts or advances it. Read timestamps used for expiry must be server-backed and bound to the recipient UID/message identity. A recipient whose interval has expired must not retain FIDUNIO-controlled local/projected/plaintext/grant copies. The shared encrypted source may remain only while another still-authorized recipient has an unexpired entitlement; once no recipient entitlement remains, the source message and all subordinate/reference traces must be physically purged with no per-message tombstone.''')
          PY
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md README.md ACCOUNT-E2EE-GROUP-MESSAGE-FORMAT.md
          git commit -m "Record disappearing read-timer semantics"
          git push origin HEAD:fidunio-complete-rebuild
