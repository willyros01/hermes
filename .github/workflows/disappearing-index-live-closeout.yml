name: Disappearing index live closeout
on:
  push:
    paths:
      - '.github/workflows/disappearing-index-live-closeout.yml'
permissions:
  contents: write
jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record live scheduler recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          note = """### DISAPPEARING LIVE INDEX RECOVERY — 0.9.9.12\n\nLive device/backend diagnosis proved the scheduled purge Function was returning HTTP 500 because Firestore required a `COLLECTION_GROUP ASCENDING` index on collection group `messages`, field `disappearingPurgeVersion`. The reviewed `firestore.indexes.json` index was deployed successfully to `fidunio-fef13`. After index activation, Cloud Scheduler job `firebase-schedule-purgeDisappearingMessagesV1-us-central1` reported `state: ENABLED` with empty `status.code`; the live scheduler invocation boundary is therefore healthy again. Device acceptance must now repeat a fresh 5-minute direct disappearing-text test before closing the feature.\n\n"""
          p=Path('CURRENT-REBUILD.md'); t=p.read_text();
          if '### DISAPPEARING LIVE INDEX RECOVERY — 0.9.9.12' not in t: p.write_text(note+t)
          p=Path('hermes-memory.txt'); t=p.read_text();
          m="""DISAPPEARING LIVE INDEX RECOVERY (2026-09-08): Real-device Test 1 exposed no purge after Read. Live Function logs proved the scheduler query failed with FAILED_PRECONDITION because `messages.disappearingPurgeVersion` lacked a COLLECTION_GROUP ASCENDING index. `firestore.indexes.json` is durable authority for that index and `firebase.json` must reference it. The reviewed index was deployed to `fidunio-fef13`; after activation, scheduler `firebase-schedule-purgeDisappearingMessagesV1-us-central1` was ENABLED with empty status.code. Future disappearing scheduler deployment must verify the live query/index boundary, not merely Function ACTIVE + scheduler existence. Fresh device acceptance remains required.\n\n"""
          if 'DISAPPEARING LIVE INDEX RECOVERY (2026-09-08)' not in t: p.write_text(m+t)
          p=Path('FIDUNIO-BUILD-CHECKLIST.md'); t=p.read_text();
          old='- [ ] Device-confirm direct 5-minute disappearing text from Read -> physical absence on sender and recipient.'
          ins='- [x] Deploy required COLLECTION_GROUP ASCENDING index for `messages.disappearingPurgeVersion` and verify scheduler returns healthy empty status.code.\n'+old
          if 'verify scheduler returns healthy empty status.code' not in t and old in t: p.write_text(t.replace(old,ins,1))
          p=Path('DISAPPEARING-PURGE-AUTHORITY.md'); t=p.read_text();
          a="""\n### Live scheduler index recovery — 0.9.9.12\nReal-device acceptance exposed a production-only discovery prerequisite: `collectionGroup('messages').where('disappearingPurgeVersion','==',1)` requires a Firestore `COLLECTION_GROUP ASCENDING` index on `messages.disappearingPurgeVersion`. The index is now declared in durable `firestore.indexes.json`, referenced by `firebase.json`, covered by a permanent baseline gate, deployed to `fidunio-fef13`, and live scheduler health was verified by an ENABLED job with empty `status.code`. Function ACTIVE plus scheduler existence alone is not sufficient future deployment evidence; the collection-group query must execute successfully after index activation.\n"""
          if '### Live scheduler index recovery — 0.9.9.12' not in t: p.write_text(t+a)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CURRENT-REBUILD.md hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md DISAPPEARING-PURGE-AUTHORITY.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record disappearing scheduler index recovery"
          git push origin HEAD:main
