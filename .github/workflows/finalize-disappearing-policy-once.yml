name: Finalize Disappearing Policy Once
on:
  push:
    branches: [fidunio-complete-rebuild]
permissions:
  contents: write
jobs:
  finalize:
    if: github.event.head_commit.message == 'Finalize disappearing policy checkpoint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-complete-rebuild
          fetch-depth: 0
      - name: Reconcile checkpoint and docs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def append_once(path, marker, block):
              p=Path(path); s=p.read_text()
              if marker not in s: p.write_text(s.rstrip()+"\n\n"+block.strip()+"\n")
          p=Path('version.js'); s=p.read_text().replace('version: "0.9.6.9"','version: "0.9.6.10"'); p.write_text(s)
          p=Path('README.md'); s=p.read_text().replace('Current checkpoint version: **0.9.6.9**','Current checkpoint version: **0.9.6.10**',1); p.write_text(s)
          append_once('README.md','### 0.9.6.10 — disappearing-content policy foundation','''### 0.9.6.10 — disappearing-content policy foundation
Release transition: **0.9.6.9 -> 0.9.6.10**.

- Added `disappearing-content-policy.js` as a pure policy owner: it owns no Firebase, DOM, crypto, storage, timer, or purge writes.
- The approved fixed-time-after-recipient-read semantics are executable: recipient expiry derives from an authoritative first-read timestamp plus a bounded configured duration; an unread recipient has no expiry window yet.
- Group shared-source purge eligibility requires every still-authorized recipient to have an authoritative Read timestamp and to have completed that recipient's own window. A later reader therefore keeps the shared source without extending another recipient's local entitlement.
- Repeat Read events are explicitly modeled as no-ops for first-read authority so reopening a conversation cannot move the disappearance clock.
- Added a dedicated policy test and made it a required Rebuild Baseline Security Gate step.
- This checkpoint does not yet write authoritative `readAt` fields or delete content. Firestore receipt schema/rules, direct-message receipt modernization, purge owner, local-cache convergence, attachments and anti-resurrection remain IN PROGRESS.
- No live Firebase deployment and no `htest` deployment. Overall first-rebuild estimate remains approximately 65%.''')
          append_once('hermes-memory.txt','2026-09-06 — 0.9.6.10 DISAPPEARING POLICY FOUNDATION','''2026-09-06 — 0.9.6.10 DISAPPEARING POLICY FOUNDATION
- Added pure `disappearing-content-policy.js`; it owns expiry calculation/purge eligibility only and has no Firebase/DOM/crypto/storage authority.
- Approved semantics are executable: fixed configured duration starts at each recipient account's first authoritative Read timestamp. Repeated Read must preserve the original first-read authority.
- Group shared-source purge is eligible only after every still-authorized recipient has read and that recipient's independent window has elapsed. Unread recipients keep the shared source.
- Dedicated tests cover direct recipient expiry, independent group read windows, unread-recipient retention and repeat-Read no-op semantics; the test is part of the full security gate.
- This is policy foundation, not physical purge. Authoritative `readAt` persistence/rules, direct receipt modernization, purge/delete owner, grant-copy purge, local/offline convergence, attachments and anti-resurrection remain unfinished.
- Version advanced 0.9.6.9 -> 0.9.6.10. Live Firebase and htest untouched. Overall first-rebuild estimate remains approximately 65%.''')
          p=Path('FIDUNIO-BUILD-CHECKLIST.md'); s=p.read_text(); old="| Disappearing-message policy/model | IN PROGRESS | Product semantics settled: disappearance uses a fixed duration starting from the recipient's first authoritative Read event for both direct and group messages. In groups the timer is per recipient/account, not first-reader-global. Cloud-authoritative read timestamps, final shared-source purge convergence, exact expiry metadata/rules and anti-resurrection implementation remain to be materialized and validated. |"; new="| Disappearing-message policy/model | IN PROGRESS | Product semantics settled and pure policy foundation materialized in 0.9.6.10: fixed configured duration starts from each recipient's first authoritative Read; repeat Read cannot move the clock; group shared-source purge waits for every still-authorized recipient's independent window. Authoritative readAt persistence/rules, purge execution, local convergence and anti-resurrection remain unfinished. |"; s=s.replace(old,new,1); log="- 2026-09-06 — 0.9.6.10 disappearing-content policy foundation: pure expiry/purge-eligibility owner plus dedicated security-gate test. Independent recipient read windows and repeat-Read immutability are executable policy; Firestore readAt authority and physical purge remain IN PROGRESS. Live Firebase/htest untouched; overall estimate remains approximately 65%."; s=s if log in s else s.rstrip()+"\n"+log+"\n"; p.write_text(s)
          append_once('architecture-ownership.txt','DISAPPEARING CONTENT POLICY OWNER — 0.9.6.10','''DISAPPEARING CONTENT POLICY OWNER — 0.9.6.10
- `disappearing-content-policy.js` is a pure decision owner for expiry calculation and shared-source purge eligibility.
- It owns no Firestore writes/deletes, local storage, UI timers, DOM, E2EE or attachment deletion.
- Server-backed first-Read receipt timestamps are inputs; device-local time is never allowed to establish or move first-read authority.
- Future purge execution must have one separate serialized owner and must consume this policy rather than create competing expiry semantics.''')
          append_once('RUNTIME-AUTHORITY-MAP.md','## Disappearing-content policy foundation — 0.9.6.10','''## Disappearing-content policy foundation — 0.9.6.10
`disappearing-content-policy.js` is the pure policy owner for recipient expiry and group shared-source purge eligibility. It has no Firebase, storage, crypto, UI or deletion authority. Future authoritative first-Read persistence remains under the existing central messaging/Firebase owner, and physical purge must be introduced as one serialized deletion owner rather than scattered client deletes.''')
          PY
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add version.js README.md hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md architecture-ownership.txt RUNTIME-AUTHORITY-MAP.md
          git commit -m "Record 0.9.6.10 disappearing policy foundation"
          git push origin HEAD:fidunio-complete-rebuild
