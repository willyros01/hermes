name: FIDUNIO 0.9.6.28-30 Materializer
on:
  push:
    branches: [fidunio-complete-rebuild]
    paths: [.fidunio-09628-30-trigger]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-complete-rebuild
          fetch-depth: 0
      - run: python .fidunio-09628-30-materialize.py
      - name: Commit validated documentation
        run: |
          set -euo pipefail
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add README.md FIDUNIO-BUILD-CHECKLIST.md hermes-memory.txt CURRENT-REBUILD.md DISAPPEARING-PURGE-AUTHORITY.md ACCOUNT-E2EE-GROUP-MESSAGE-FORMAT.md DETERMINISTIC-UI-LIFECYCLE.md RUNTIME-AUTHORITY-MAP.md architecture-ownership.txt BUG-LIST.md
          git commit -m "Document validated FIDUNIO 0.9.6.28 through 0.9.6.30"
          git push origin HEAD:fidunio-complete-rebuild
