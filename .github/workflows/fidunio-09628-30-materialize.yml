name: FIDUNIO 0.9.6.28-30 Materializer
on:
  push:
    branches: [fidunio-complete-rebuild]
    paths: [.fidunio-09628-30-trigger]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-complete-rebuild
          fetch-depth: 0
      - run: python .fidunio-09628-30-materialize.py
      - name: Commit bounded implementation
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/rebuild-baseline-security.yml
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add app.js package.json version.js disappearing-text-e2e-closeout.test.mjs group-history-admin-ui.test.mjs receipt-lifecycle-stabilization.test.mjs
          git commit -m "Build FIDUNIO 0.9.6.28 through 0.9.6.30"
          git push origin HEAD:fidunio-complete-rebuild
