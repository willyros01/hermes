name: FIDUNIO 0.9.6.23 Materialize
on:
  push:
    branches: [fidunio-complete-rebuild]
    paths: ['.fidunio-09623-trigger']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-complete-rebuild
      - run: python3 .fidunio-09623-materialize.py
      - run: |
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add app.js firebase.js e2ee-account-group-conversation.test.mjs version.js
          git commit -m "Wire 0.9.6.23 authoritative projection convergence"
          git push origin HEAD:fidunio-complete-rebuild
