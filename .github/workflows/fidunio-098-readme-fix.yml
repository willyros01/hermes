name: FIDUNIO 0.9.8 README Fix
on: {push: {branches: [fidunio-complete-rebuild], paths: [.fidunio-098-readme-fix-trigger]}}
permissions: {contents: write}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fidunio-complete-rebuild, fetch-depth: 0}
      - run: python .fidunio-098-readme-fix.py
      - run: |
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add README.md
          git commit -m "Reconcile README at FIDUNIO 0.9.8.5"
          git push origin HEAD:fidunio-complete-rebuild
