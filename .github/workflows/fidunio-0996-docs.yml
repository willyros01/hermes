name: FIDUNIO 0.9.9.6 Deployment Docs
on: {push: {branches: [fidunio-complete-rebuild], paths: [.fidunio-0996-docs-trigger]}}
permissions: {contents: write}
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fidunio-complete-rebuild, fetch-depth: 0}
      - run: python .fidunio-0996-docs.py
      - run: |
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add README.md hermes-memory.txt CURRENT-REBUILD.md FIDUNIO-BUILD-CHECKLIST.md hermes-setup.txt BUG-LIST.md
          git commit -m "Record FIDUNIO 0.9.9.6 htest deployment"
          git push origin HEAD:fidunio-complete-rebuild
