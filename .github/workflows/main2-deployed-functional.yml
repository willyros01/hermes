name: main2 deployed functional screens

on:
  workflow_dispatch:
  push:
    branches: [main2]
  deployment_status:

permissions:
  contents: read

jobs:
  deployed-screen-gate:
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - name: Test deployed main2 screens
        env:
          FIDUNIO_E2E_BASE_URL: ${{ github.event.deployment_status.target_url || 'https://fidunio-main2.vercel.app' }}
          FIDUNIO_E2E_USER_A: ${{ secrets.FIDUNIO_E2E_USER_A }}
          FIDUNIO_E2E_PASSWORD_A: ${{ secrets.FIDUNIO_E2E_PASSWORD_A }}
          FIDUNIO_E2E_USER_B: ${{ secrets.FIDUNIO_E2E_USER_B }}
          FIDUNIO_E2E_PASSWORD_B: ${{ secrets.FIDUNIO_E2E_PASSWORD_B }}
        run: npm run test:e2e:deployed
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main2-browser-evidence-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
