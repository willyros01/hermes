name: FIDUNIO 0.9.6.23 Docs
on:
  push:
    branches: [fidunio-complete-rebuild]
    paths: ['.fidunio-09623-docs-trigger']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-complete-rebuild
      - run: python3 .fidunio-09623-docs.py
      - run: |
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add README.md hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md CURRENT-REBUILD.md DISAPPEARING-PURGE-AUTHORITY.md architecture-ownership.txt RUNTIME-AUTHORITY-MAP.md
          git commit -m "Document validated 0.9.6.23 projection convergence"
          git push origin HEAD:fidunio-complete-rebuild
