name: Temporary disappearing attachment candidate builder
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-da.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply repository candidate
        run: python3 tmp-da.py
      - name: Commit candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add . ':!tmp-da.py' ':!.github/workflows/tmp-da.yml'
          git commit -m "Build disappearing attachment purge path"
          echo "CODE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Create controlled Cloud Shell handoff
        run: |
          cat > att.txt <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          PROJECT="fidunio-fef13"
          REGION="us-central1"
          FUNCTION="purgeDisappearingMessagesV1"
          CODEBASE="recovery"
          SERVICE_ACCOUNT="fidunio-disappearing-purge@fidunio-fef13.iam.gserviceaccount.com"
          BUCKET="gs://fidunio-fef13.firebasestorage.app"
          COMMIT="$CODE_SHA"
          SCRIPT_VERSION="0.9.9.19-att"
          ACTIVE_PROJECT="$(gcloud config get-value project 2>/dev/null)"
          if [[ "$ACTIVE_PROJECT" != "$PROJECT" ]]; then echo "STOP: Cloud Shell project is '$ACTIVE_PROJECT', expected '$PROJECT'."; exit 1; fi
          if ! command -v firebase >/dev/null 2>&1; then npm install -g firebase-tools; fi
          WORK="$(mktemp -d)"; trap 'rm -rf "$WORK"' EXIT
          ROOT="$WORK/fidunio"; SOURCE="$ROOT/functions"; mkdir -p "$SOURCE/recovery" "$SOURCE/message-delete" "$SOURCE/disappearing"
          RAW="https://raw.githubusercontent.com/willyros01/hermes/$COMMIT"
          download_root(){ curl --retry 3 --retry-delay 2 -fsSL "$RAW/$1" -o "$ROOT/$1"; }
          download_function(){ curl --retry 3 --retry-delay 2 -fsSL "$RAW/functions/$1" -o "$SOURCE/$1"; }
          download_root firebase.json
          download_function package.json
          download_function package-lock.json
          download_function index.mjs
          download_function recovery/e2ee-recovery-callable-core.mjs
          download_function recovery/e2ee-recovery-firestore-admin-adapter.mjs
          download_function recovery/e2ee-recovery-server-crypto.mjs
          download_function recovery/e2ee-recovery-session-policy.mjs
          download_function message-delete/message-delete-callable-core.mjs
          download_function message-delete/message-delete-firestore-admin-adapter.mjs
          download_function disappearing/disappearing-content-policy.js
          download_function disappearing/disappearing-purge-policy.js
          download_function disappearing/disappearing-purge-executor.js
          download_function disappearing/disappearing-purge-firestore-admin-adapter.mjs
          download_function disappearing/disappearing-group-grant-trace-plan.js
          download_function disappearing/disappearing-scheduler-core.mjs
          grep -q 'bucket:attachmentBucket,requireStorage:true' "$SOURCE/index.mjs" || { echo "STOP: pinned source lacks Storage purge wiring."; exit 1; }
          grep -q 'bucket.deleteFiles' "$SOURCE/disappearing/disappearing-purge-firestore-admin-adapter.mjs" || { echo "STOP: pinned source lacks physical Storage deletion."; exit 1; }
          npm --prefix "$SOURCE" install --ignore-scripts --silent
          (cd "$ROOT" && node --input-type=module -e "const m=await import('./functions/index.mjs');if(typeof m.purgeDisappearingMessagesV1!=='function')throw new Error('scheduler missing');console.log('Pinned Functions graph imports successfully')")
          gcloud storage buckets add-iam-policy-binding "$BUCKET" --member="serviceAccount:$SERVICE_ACCOUNT" --role="roles/storage.objectAdmin" --quiet >/dev/null
          gcloud storage buckets get-iam-policy "$BUCKET" --format=json | grep -q "$SERVICE_ACCOUNT" || { echo "STOP: Storage IAM binding could not be verified."; exit 1; }
          cd "$ROOT"
          firebase deploy --project "$PROJECT" --only "functions:$CODEBASE:$FUNCTION" --non-interactive
          STATE="$(gcloud functions describe "$FUNCTION" --gen2 --project="$PROJECT" --region="$REGION" --format='value(state)')"
          RUNTIME_SA="$(gcloud functions describe "$FUNCTION" --gen2 --project="$PROJECT" --region="$REGION" --format='value(serviceConfig.serviceAccountEmail)')"
          [[ "$STATE" == "ACTIVE" ]] || { echo "STOP: Function state is '$STATE'."; exit 1; }
          [[ "$RUNTIME_SA" == "$SERVICE_ACCOUNT" ]] || { echo "STOP: Runtime SA is '$RUNTIME_SA', expected '$SERVICE_ACCOUNT'."; exit 1; }
          SCHEDULER="$(gcloud scheduler jobs list --location="$REGION" --project="$PROJECT" --filter="name~$FUNCTION" --format='value(name)' | head -n 1 || true)"
          [[ -n "$SCHEDULER" ]] || { echo "STOP: scheduler trigger not found."; exit 1; }
          echo "SUCCESS"
          echo "FIDUNIO 0.9.9.19 disappearing attachment backend is ACTIVE."
          echo "Function: $FUNCTION ($STATE)"
          echo "Runtime SA: $RUNTIME_SA"
          echo "Storage bucket: $BUCKET"
          echo "Scheduler: $SCHEDULER"
          echo "Pinned source: $COMMIT"
          EOF
          git add att.txt
          git commit -m "Add disappearing attachment deployment handoff"
      - name: Push candidate
        run: git push
