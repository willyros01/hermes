name: Password Visibility Gate

on:
  push:
    branches: [main]
    paths:
      - 'password-visibility.js'
      - 'password-visibility.css'
      - 'password-visibility.test.mjs'
      - 'index.html'
      - 'account-recovery.html'
      - 'auth-ui-clean.js'
      - 'settings-lifecycle.js'
      - 'account-recovery.js'
      - '.github/workflows/password-visibility-gate.yml'
  workflow_dispatch:

jobs:
  password-visibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Password visibility boundary
        run: node password-visibility.test.mjs
