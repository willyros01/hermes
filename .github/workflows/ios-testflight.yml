name: FIDUNIO TestFlight
on:
  push:
    branches: [ios]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'build/**'
      - '!build/*.test.mjs'
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.png'
      - 'manifest.json'
      - '.github/workflows/ios-native-checks.yml'
      - '.github/workflows/ios-capacitor-shell.yml'
      - '.github/workflows/rebuild-baseline-security.yml'
      - '.github/workflows/ios-browser-release.yml'
      - '.github/workflows/ios-testflight.yml'
      - 'IOS-EXPORT-COMPLIANCE.md'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fidunio-testflight
  cancel-in-progress: false
jobs:
  gates:
    if: github.ref == 'refs/heads/ios'
    outputs:
      ready: ${{ steps.verify.outputs.ready }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for required checks on this exact commit
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          const required=["ios-native-checks.yml","ios-capacitor-shell.yml","rebuild-baseline-security.yml","ios-browser-release.yml","ios-notification-lease-gate.yml","ios-backend-audit-gate.yml"];
          import {appendFileSync} from "node:fs";
          const headers={Authorization:"Bearer "+process.env.GH_TOKEN,Accept:"application/vnd.github+json"};
          async function currentHead(){
            const response=await fetch("https://api.github.com/repos/"+process.env.REPO+"/branches/ios",{headers});
            if(!response.ok)throw new Error("GitHub branch lookup "+response.status);
            return (await response.json()).commit.sha;
          }
          for(let i=0;i<100;i++){
            if((await currentHead())!==process.env.HEAD_SHA){
              console.log("SUPERSEDED: newer ios commit exists; old TestFlight upload skipped.");
              appendFileSync(process.env.GITHUB_OUTPUT,"ready=false\n");
              process.exit(0);
            }
            const res=await fetch("https://api.github.com/repos/"+process.env.REPO+"/actions/runs?head_sha="+process.env.HEAD_SHA+"&per_page=100",{headers:{Authorization:"Bearer "+process.env.GH_TOKEN,Accept:"application/vnd.github+json"}});
            if(!res.ok)throw new Error("GitHub checks API "+res.status);
            const runs=(await res.json()).workflow_runs;
            const found=required.map(name=>runs.filter(r=>r.path===".github/workflows/"+name&&r.event==="push").sort((a,b)=>b.id-a.id)[0]);
            if(found.some(r=>r?.status==="completed"&&r.conclusion!=="success")){
              console.error("Blocking checks: "+found.map((r,i)=>required[i]+"="+(r?.conclusion||r?.status||"not listed")).join(", "));
              throw new Error("Required check failed on current commit; upload blocked");
            }
            if(found.every(r=>r?.conclusion==="success")){console.log("PASS: required gates on current exact ios head");appendFileSync(process.env.GITHUB_OUTPUT,"ready=true\n");process.exit(0);}
            console.log("Waiting for required checks: "+found.map((r,i)=>required[i]+"="+(r?.conclusion||r?.status||"not yet listed")).join(", "));
            await new Promise(r=>setTimeout(r,15000));
          }
          throw new Error("Required checks did not finish; upload blocked");
          JS
  testflight:
    needs: gates
    if: needs.gates.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Archive, verify distribution signature, upload and check Apple processing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash build/ios-testflight.sh
