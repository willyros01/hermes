name: FIDUNIO 1.1.42 publisher
on:
  push:
    branches: [main]
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply surgical Wi-Fi verification correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def replace_once(path, old, new):
              text=read(path)
              if text.count(old)!=1:
                  raise SystemExit(f"{path}: expected exactly one match, found {text.count(old)}")
              write(path,text.replace(old,new,1))

          replace_once('large-attachment-network-policy.js', '''  // Option 2: browsers that do not positively disclose their physical
  // transport are allowed to proceed. This is essential on iPhone/iPad
  // Safari, which generally does not expose Wi-Fi versus cellular here.
  return {allowed:true,waitForWifi:false,reason:"network-type-unknown"};''', '''  // Fail closed when the browser cannot positively verify Wi-Fi/Ethernet.
  // iPhone/iPad Safari commonly lands here. The application may offer an
  // explicit user override, but the policy itself never silently proceeds.
  return {allowed:false,waitForWifi:true,reason:"network-unverified",canOverride:true};''')

          replace_once('app.js', '''        <div class="card"><h2>Data</h2>${settingRow("Large attachments on Wi-Fi only","wifiAttachments")}<p class="small-note">The large-attachment threshold is 5 MiB. When this is enabled, a large attachment waits if the browser positively reports cellular/WiMAX or the device is offline. If Wi-Fi/Ethernet is reported, it proceeds. If network-type information is unavailable, sending proceeds; iPhone/iPad Safari generally does not reliably disclose Wi-Fi versus cellular.</p></div>''', '''        <div class="card"><h2>Data</h2>${settingRow("Large attachments on Wi-Fi only","wifiAttachments")}<p class="small-note">The large-attachment threshold is 5 MiB. When this is enabled, a large attachment waits if the browser reports cellular/WiMAX or the device is offline. If Wi-Fi/Ethernet is reported, it proceeds. If the browser cannot verify the network type, FIDUNIO does not send silently and asks for an explicit Send Anyway decision. iPhone/iPad Safari generally does not reliably disclose Wi-Fi versus cellular.</p></div>''')

          old='''  const decision=evaluateLargeAttachmentNetworkPolicy({enabled:!!state.settings.wifiAttachments,size:file.size,...readBrowserAttachmentNetworkState(navigator)});
  if(!decision.allowed){
    pendingLargeAttachmentSend=record;
    projectSelectedAttachmentRecord(record,"waiting-wifi");
    return;
  }
  await continueSelectedAttachmentSend(record);'''
          new='''  const decision=evaluateLargeAttachmentNetworkPolicy({enabled:!!state.settings.wifiAttachments,size:file.size,...readBrowserAttachmentNetworkState(navigator)});
  if(!decision.allowed){
    if(decision.reason==="network-unverified"&&decision.canOverride){
      const sendAnyway=globalThis.confirm?.("Wi-Fi connection cannot be verified. This large attachment may use cellular data. Press OK to Send Anyway, or Cancel to keep it from sending.")===true;
      if(sendAnyway){await continueSelectedAttachmentSend(record);return;}
      alert("Attachment not sent. Connect to verified Wi-Fi, or select it again and choose Send Anyway when prompted.");
      return;
    }
    pendingLargeAttachmentSend=record;
    projectSelectedAttachmentRecord(record,"waiting-wifi");
    return;
  }
  await continueSelectedAttachmentSend(record);'''
          replace_once('app.js',old,new)

          replace_once('version.js','version: "1.1.41"','version: "1.1.42"')
          replace_once('service-worker.js','1.1.41-large-attachment-network-policy','1.1.42-large-attachment-network-verification')

          t=read('large-attachment-network-policy.test.mjs')
          old='''for(const networkType of ["",undefined,"unknown","bluetooth","other"]){
  const decision=evaluateLargeAttachmentNetworkPolicy({enabled:true,size:LARGE_ATTACHMENT_THRESHOLD_BYTES,online:true,networkType});
  assert.equal(decision.allowed,true,`unknown/non-positive network type ${String(networkType)} must proceed under Option 2`);
}'''
          new='''for(const networkType of ["",undefined,"unknown","bluetooth","other"]){
  const decision=evaluateLargeAttachmentNetworkPolicy({enabled:true,size:LARGE_ATTACHMENT_THRESHOLD_BYTES,online:true,networkType});
  assert.equal(decision.allowed,false,`unknown/non-positive network type ${String(networkType)} must not silently proceed`);
  assert.equal(decision.reason,"network-unverified");
  assert.equal(decision.canOverride,true,"unverified network must expose only an explicit user override");
}'''
          if t.count(old)!=1: raise SystemExit('large-attachment-network-policy.test.mjs unknown-network block mismatch')
          t=t.replace(old,new,1)
          t=t.replace('assert.match(app,/network-type information.*iPhone.*iPad.*Safari/is,"Data settings must explain Safari unknown-network allowance");','assert.match(app,/cannot verify the network type.*explicit Send Anyway.*iPhone.*iPad.*Safari/is,"Data settings must explain Safari verification limitation and explicit override");')
          t=t.replace('assert.match(serviceWorker,/1\\.1\\.41-large-attachment-network-policy/,"service-worker cache revision must advance");','assert.match(app,/Wi-Fi connection cannot be verified[\\s\\S]*Send Anyway/,"unknown network must require an explicit Send Anyway confirmation");\nassert.match(serviceWorker,/1\\.1\\.42-large-attachment-network-verification/,"service-worker cache revision must advance");')
          t=t.replace('assert.match(version,/version:\\s*"1\\.1\\.41"/,"visible release must advance to 1.1.41");','assert.match(version,/version:\\s*"1\\.1\\.42"/,"visible release must advance to 1.1.42");')
          write('large-attachment-network-policy.test.mjs',t)

          release='''FIDUNIO 1.1.42 LARGE-ATTACHMENT DEVICE CORRECTION — 2026-09-12: Real-device testing on iPhone cellular sent a 19 MB attachment because Safari did not disclose Wi-Fi versus cellular and 1.1.41 Option 2 allowed unknown network type. That behavior is rejected. For >=5 MiB with Settings → Data → Large attachments on Wi-Fi only enabled, unknown/unverifiable network type now fails closed. FIDUNIO warns that Wi-Fi cannot be verified and requires an explicit Send Anyway confirmation before any file read/encryption/Outbox/upload. Positively reported cellular/WiMAX and offline states still wait; positively reported Wi-Fi/Ethernet proceeds. Attachment/E2EE/Firebase/Outbox/receipt/delete/notification/PIN ownership is unchanged. TODO item 6 remains open pending repeat device acceptance.\n\n'''
          for path in ['hermes-memory.txt','CURRENT-REBUILD.md','FIDUNIO-BUILD-CHECKLIST.md','README.md']:
              write(path,release+read(path))

          a=read('ATTACHMENT-AUTHORITY.md')
          marker='## 1.1.41 large-attachment network-policy boundary'
          if marker not in a: raise SystemExit('ATTACHMENT-AUTHORITY marker missing')
          section='''## 1.1.42 unknown-network fail-closed correction\n\nReal-device iPhone cellular acceptance showed that Safari's undisclosed network type made the 1.1.41 Option 2 fallback send a 19 MB attachment without warning. That fallback is superseded. For a large attachment with the Wi-Fi-only preference enabled, an unknown/unverifiable network type is not send authority. `large-attachment-network-policy.js` returns a blocked `network-unverified` decision. `app.js`, as browser-selection/UI owner, may offer one explicit **Send Anyway** confirmation; only affirmative user action may continue into the unchanged attachment-send transaction. Cancellation performs no file read, encryption, Outbox staging, Storage upload, or message commit. Positively reported cellular/WiMAX and offline states continue to wait; positively reported Wi-Fi/Ethernet proceeds. No Firebase, E2EE, Outbox, receipt, deletion, notification, group, direct-message or PIN ownership changes.\n\n'''
          write('ATTACHMENT-AUTHORITY.md',a.replace(marker,section+marker,1))

          todo=read('TODO.md')
          todo_new=re.sub(r'^6\. \*\*Enforce “Large attachments on Wi-Fi only”.*$', '6. **Enforce “Large attachments on Wi-Fi only” — 1.1.42 CORRECTION; DEVICE ACCEPTANCE PENDING** — threshold remains **5 MiB**. Real-device iPhone cellular testing exposed that 1.1.41 silently sent a 19 MB attachment because Safari did not disclose network type. That Option 2 fallback is rejected. With the setting enabled, large attachments on positively reported cellular/WiMAX or offline still wait; positively reported Wi-Fi/Ethernet proceeds; unknown/unverifiable network type now fails closed and requires an explicit **Send Anyway** confirmation before any file read, encryption, Outbox staging or upload. Cancellation sends nothing. Existing attachment/E2EE/Firebase/direct/group/Outbox/receipt/delete/notification/PIN owners remain unchanged. Keep item 6 open through repeat direct/group photo/file/audio/video device acceptance.', todo, count=1, flags=re.M)
          if todo_new==todo: raise SystemExit('TODO item 6 replacement failed')
          write('TODO.md',todo_new)

          bugs=read('DEVICE-ACCEPTANCE-BUGS.md')
          bug='''# FDA-LARGEATT-001 — iPhone unknown network silently bypassed Wi-Fi-only preference\n\n- **Build/device:** FIDUNIO 1.1.41, iPhone Safari/PWA, cellular data, 19 MB attachment.\n- **Observed:** attachment sent successfully without warning because Safari exposed no reliable network type and the 1.1.41 Option 2 fallback treated unknown as allowed.\n- **Expected:** a >=5 MiB attachment must not silently proceed unless Wi-Fi/Ethernet is positively known or the user explicitly overrides an unverifiable network.\n- **Repair allocation:** 1.1.42, policy/UI boundary only. Unknown network fails closed; explicit Send Anyway confirmation is the sole override. No attachment transport, E2EE, Firebase, Outbox, receipts, notifications, groups, PIN or deletion owner changes.\n- **Status:** FIX CANDIDATE — device re-acceptance required.\n- **Exit:** on iPhone cellular/unknown network, large attachment presents the warning and does not send without affirmative override; Send Anyway sends exactly once; small attachments and direct/group messaging regress unchanged.\n\n'''
          write('DEVICE-ACCEPTANCE-BUGS.md',bug+bugs)
          PY
      - name: Focused regression
        run: |
          node --check large-attachment-network-policy.js
          node --check app.js
          node large-attachment-network-policy.test.mjs
          test "$(cat version.js | grep -c '1.1.42')" -ge 1
          grep -q '1.1.42-large-attachment-network-verification' service-worker.js
          git diff --check
      - name: Commit application correction
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ATTACHMENT-AUTHORITY.md CURRENT-REBUILD.md DEVICE-ACCEPTANCE-BUGS.md FIDUNIO-BUILD-CHECKLIST.md README.md TODO.md app.js hermes-memory.txt large-attachment-network-policy.js large-attachment-network-policy.test.mjs service-worker.js version.js
          git commit -m 'Require confirmation for unverifiable large-attachment network'
          git push origin HEAD:main
