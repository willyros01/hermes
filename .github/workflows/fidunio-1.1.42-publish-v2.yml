name: FIDUNIO 1.1.42 publisher v2
on:
  push:
    branches:
      - main
jobs:
  publish:
    if: "github.actor == 'willyros01'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply surgical patch
        run: python3 fidunio-1.1.42-patch.py
      - name: Focused regression
        run: |
          node --check large-attachment-network-policy.js
          node --check app.js
          node large-attachment-network-policy.test.mjs
          grep -q 'version: "1.1.42"' version.js
          grep -q '1.1.42-large-attachment-network-verification' service-worker.js
          git diff --check
      - name: Commit application correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm fidunio-1.1.42-patch.py
          git add ATTACHMENT-AUTHORITY.md CURRENT-REBUILD.md DEVICE-ACCEPTANCE-BUGS.md FIDUNIO-BUILD-CHECKLIST.md README.md TODO.md app.js hermes-memory.txt large-attachment-network-policy.js large-attachment-network-policy.test.mjs service-worker.js version.js
          git commit -m 'Require confirmation for unverifiable large-attachment network'
          git push origin HEAD:main
