name: FIDUNIO Android gesture investigation

# INVESTIGATION ONLY (Willy, 24 Nov 2026): how FIDUNIO reacts to the Pixel's own
# swipe gestures. Disposable debug app, local demo Firebase emulators only.
# No app code change, no release, no production access.
on:
  push:
    branches: [simulator-tests]
    paths:
      - 'build/gestures/**'
      - '.github/workflows/android-gestures.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fidunio-android-gestures
  cancel-in-progress: true

jobs:
  gestures:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: willyros01/hermes
          ref: Android
          path: android-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the disposable Android test app (released Android source)
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          cd android-src
          echo "Android source: $(git rev-parse HEAD)"
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund @capacitor/android@8.5.2
          npm run ios:prepare
          node ../build/simulator/patch-sandbox.mjs . android
          npx cap add android
          npx cap sync android
          node ../build/simulator/permit-emulator-http.mjs .
          java build/AndroidIcons.java icon-512.png android/app/src/main/res
          chmod +x android/gradlew
          ( cd android && ./gradlew --no-daemon assembleDebug )
          test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Permit hardware-assisted Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pixel gestures on FIDUNIO
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          script: bash build/gestures/run.sh out-gestures android-src/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Save screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidunio-android-gestures
          path: out-gestures/
          retention-days: 90
          if-no-files-found: warn
