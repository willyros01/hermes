name: Disappearing activation rules gate one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disappearing-rules-gate-one-shot.yml'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact activation rules cases
        run: python disappearing-rules-gate-patch.py
      - name: Install test dependencies
        run: npm install --ignore-scripts
      - name: Direct rules activation cases
        run: npm run emulator:test:account-message-rules
      - name: Group rules activation cases
        run: npm run emulator:test:group-e2ee-rules
      - name: Activation source gate
        run: npm run test:disappearing-activation
      - name: Commit permanent emulator cases
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firestore-account-message-v3.rules.test.mjs firestore-group-e2ee-v1.rules.test.mjs
          git diff --cached --check
          git commit -m 'Gate disappearing activation marker in Firestore rules'
          git push
