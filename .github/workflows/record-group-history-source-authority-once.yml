name: Record Group History Source Authority Once
on:
  push:
    branches: [fidunio-complete-rebuild]
permissions:
  contents: write
jobs:
  record:
    if: github.event.head_commit.message == 'Advance to 0.9.6.9 group history source authority'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-complete-rebuild
          fetch-depth: 0
      - name: Update durable project documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def append_once(path,marker,block):
              p=Path(path); s=p.read_text()
              if marker not in s:p.write_text(s.rstrip()+"\n\n"+block.strip()+"\n")

          p=Path('README.md'); s=p.read_text().replace('- Current checkpoint version: **0.9.6.8**','- Current checkpoint version: **0.9.6.9**',1)
          marker='### 0.9.6.9 — authoritative earlier-history source selection'
          if marker not in s:s=s.rstrip()+'''\n\n### 0.9.6.9 — authoritative earlier-history source selection\n\nRelease transition: **0.9.6.8 -> 0.9.6.9**.\n\n- Removed caller/UI-provided source rows from production earlier-history grant creation. The serialized group runtime now obtains retained encrypted source rows through the bounded group Firebase adapter.\n- The adapter reuses `firebase.js`'s sole central group-message subscription owner and waits for a server-backed (`fromCache == false`) snapshot before a grant may be built. Local/app projected rows cannot become cryptographic grant authority.\n- Date/Beginning boundaries are applied to those authoritative retained rows inside `e2ee-account-group-runtime.js`; tests prove forged caller rows cannot change either the selected source message or the lower-bound decision.\n- Production grant IDs are now generated inside the group runtime with `crypto.randomUUID()`. The bounded controller/app-integration bridge accepts only group ID, target UID and boundary intent; it does not accept ciphertext/source rows or own Firebase/crypto.\n- Rebuild Baseline Security Gate run `34048905157` passed every substantive step on the source-authority/intent-bridge implementation.\n- Group Info still does not enable the earlier-history action. Physical disappearing-content purge/anti-resurrection remains a prerequisite before the control can be exposed to users.\n- No live Firebase deployment, no `htest` deployment, no FCM activation and no App Check enforcement change. Overall first-rebuild estimate remains approximately 65%.\n'''
          p.write_text(s)

          p=Path('FIDUNIO-BUILD-CHECKLIST.md'); s=p.read_text()
          old='Date/message-bounded policy, message-granular grant crypto, Firestore persistence/rules/runtime, and deterministic target-side conversation projection are repository-validated through 0.9.6.8. Group Info date/beginning grant controls and disappearing-content purge/anti-resurrection remain unfinished.'
          new='Date/message-bounded policy, message-granular grant crypto, Firestore persistence/rules/runtime, deterministic target-side conversation projection, and server-backed authoritative source selection/intent-only app bridge are repository-validated through 0.9.6.9. Group Info date/beginning grant controls and disappearing-content purge/anti-resurrection remain unfinished.'
          if old in s:s=s.replace(old,new,1)
          log='- 2026-09-06 — 0.9.6.9 group-history source authority GREEN: production grant creation no longer accepts app/local source rows. The serialized runtime obtains a server-backed retained-message snapshot through the central Firebase owner, applies the approved boundary there, owns secure grant-ID generation, and exposes only target/boundary intent through the controller/integration bridge. Gate run `34048905157` passed. User-facing grant control remains IN PROGRESS pending physical purge/anti-resurrection and device validation. Live Firebase/htest untouched; estimate remains approximately 65%.'
          if log not in s:s=s.rstrip()+"\n"+log+"\n"
          p.write_text(s)

          append_once('hermes-memory.txt','2026-09-06 — 0.9.6.9 GROUP HISTORY SOURCE AUTHORITY','''2026-09-06 — 0.9.6.9 GROUP HISTORY SOURCE AUTHORITY\n- Production earlier-history grants no longer accept source message rows from app.js, local cache, or other callers.\n- e2ee-account-group-runtime.js requests retained encrypted source rows from `readRetainedGroupMessages`; e2ee-account-group-firebase-adapter.js implements that as a one-shot view over the existing firebase.js group-message subscription and ignores cache-only snapshots until a server-backed snapshot arrives.\n- This preserves firebase.js as sole SDK owner while preventing stale/tampered UI projection from becoming cryptographic authority.\n- Approved Beginning/date boundaries are filtered inside the serialized runtime against those authoritative retained rows. Runtime tests inject forged caller `sourceRows` and prove they cannot affect source selection or boundary decisions.\n- Production grant IDs are runtime-owned via secure `crypto.randomUUID()`.\n- e2ee-account-group-app-controller.js and app-integration now expose an intent-only history grant path (`groupId`, `targetUid`, `boundary`) but app.js does not yet invoke it. This is deliberate: user-facing activation remains blocked on disappearing-content physical purge/anti-resurrection.\n- Rebuild Baseline Security Gate run `34048905157` PASSED all substantive steps.\n- Version advanced 0.9.6.8 -> 0.9.6.9. Live Firebase, htest, FCM and App Check enforcement remain untouched. Overall first-rebuild estimate remains approximately 65%.''')

          append_once('ACCOUNT-E2EE-GROUP-MESSAGE-FORMAT.md','### Earlier-history source authority — 0.9.6.9','''### Earlier-history source authority — 0.9.6.9\nThe grantor UI/controller supplies only target account and approved boundary intent. It MUST NOT supply authoritative source message rows, plaintext, ciphertext, timestamps, or epoch selections. The serialized group runtime obtains the currently retained encrypted group rows through the central Firebase transport and applies the Beginning/timestamp lower boundary to those server-backed rows before decryption/re-encryption. Production grant IDs are generated by the runtime using a cryptographically secure UUID. A cache-only snapshot is insufficient authority to create a grant.''')

          append_once('RUNTIME-AUTHORITY-MAP.md','## Earlier-history source selection — 0.9.6.9','''## Earlier-history source selection — 0.9.6.9\n- `app.js` / future Group Info control: intent only (`groupId`, `targetUid`, `boundary`).\n- `e2ee-account-group-app-integration.js` / controller: bounded serialized intent bridge only; no source rows, Firebase or crypto.\n- `e2ee-account-group-runtime.js`: grant ID generation, authoritative boundary filtering, source decrypt/re-encrypt and grant serialization.\n- `e2ee-account-group-firebase-adapter.js`: one-shot server-backed retained-message read by wrapping the existing central firebase.js group subscription; cache-only snapshots are not grant authority.\n- `firebase.js`: remains the sole Firebase SDK/service owner.''')

          append_once('architecture-ownership.txt','GROUP HISTORY SOURCE AUTHORITY — 0.9.6.9','''GROUP HISTORY SOURCE AUTHORITY — 0.9.6.9\n- Resource: retained encrypted group rows eligible to seed an explicit earlier-history grant.\n- Authority path: firebase.js group message subscription -> thin Firebase adapter server-backed snapshot -> serialized group runtime.\n- app.js/local caches/projected conversation rows are NEVER source authority for a grant.\n- The controller/integration boundary carries only target/boundary intent.\n- Runtime owns secure grant ID generation and boundary/source selection before message-granular re-encryption.''')

          append_once('group-data-model.txt','GROUP HISTORY SOURCE AUTHORITY — 0.9.6.9','''GROUP HISTORY SOURCE AUTHORITY — 0.9.6.9\nGrant source rows are selected from the currently retained server-backed `groups/{groupId}/messages` authority through the existing Firebase owner. App/local projected rows are not accepted as grant input. A Beginning/timestamp boundary is applied to the authoritative source `createdAt` values inside the serialized group runtime before message-granular grant copies are produced.''')
          PY
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add README.md hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md ACCOUNT-E2EE-GROUP-MESSAGE-FORMAT.md RUNTIME-AUTHORITY-MAP.md architecture-ownership.txt group-data-model.txt
          git commit -m "Record 0.9.6.9 group history source authority"
          git push origin HEAD:fidunio-complete-rebuild
