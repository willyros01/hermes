name: Audio source and recorder one-shot

on:
  push:
    branches: [main]
    paths: ['.github/workflows/audio-source-one-shot.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded audio chooser and recorder patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p=Path('app.js'); s=p.read_text()

          old='''  document.querySelectorAll(".tool").forEach(btn=>btn.onclick=()=>{const label=btn.textContent.trim();if(label==="Photo"||label==="Video"){state.modal={type:label==="Photo"?"photoSource":"videoSource"};return render();}const map={File:["file","*/*",false],Audio:["audio","audio/*",true]};const action=map[label];if(action)chooseAndSendAttachment(...action);});'''
          new='''  document.querySelectorAll(".tool").forEach(btn=>btn.onclick=()=>{const label=btn.textContent.trim();if(label==="Photo"||label==="Video"||label==="Audio"){state.modal={type:label==="Photo"?"photoSource":label==="Video"?"videoSource":"audioSource"};return render();}const map={File:["file","*/*",false]};const action=map[label];if(action)chooseAndSendAttachment(...action);});'''
          assert s.count(old)==1, 'audio tool handler anchor changed'
          s=s.replace(old,new,1)

          start=s.index('async function chooseAndSendAttachment(kind,accept,capture){')
          end=s.index('\nasync function sendCurrent(){',start)
          replacement=r'''async function sendSelectedAttachmentFile(kind,file){
  const c=currentConversation();if(!firebaseUser||(!c?.cloud&&!c?.cloudGroup))return alert("Attachments require a signed-in cloud conversation.");
  if(!file)return;
  const messageId=crypto.randomUUID(),attachmentId=crypto.randomUUID(),originalName=file.name||`${kind}-${Date.now()}`,originalType=file.type||"application/octet-stream";
  try{validateAttachmentSelection({kind,name:originalName,type:originalType,size:file.size});}
  catch(err){const limit=Math.round((ATTACHMENT_LIMITS_V1[kind]||0)/(1024*1024));const label=kind==="video"?"Video":kind==="audio"?"Audio":kind==="photo"?"Photo":"Attachment";alert(`${label} could not be selected: ${err?.message||err}${limit?` Maximum size is ${limit} MB.`:""}`);return;}
  const previewUrl=URL.createObjectURL(file),previewText=JSON.stringify({fidunioAttachment:1,attachmentId,kind,name:originalName,type:originalType,size:file.size});
  const stagedMessage=stampOutgoingDisappearSelection({id:messageId,mine:true,text:previewText,time:nowTime(),state:"sending",cloud:true,attachment:{kind,name:originalName,type:originalType,size:file.size}},state.settings.disappearingTextSeconds??null);
  localAttachmentPreviewUrls.add(previewUrl);attachmentRuntime.set(attachmentRuntimeKey(c.id,messageId),{status:"ready",descriptor:parseAttachmentDescriptor(previewText),result:{url:previewUrl,name:originalName,type:originalType,size:file.size,kind,localPreview:true}});
  if(!state.messages[c.id])state.messages[c.id]=[];state.messages[c.id].push(stagedMessage);c.preview=messagePreview(previewText);c.time=stagedMessage.time;render();
  try{
    const bytes=new Uint8Array(await file.arrayBuffer());
    const descriptor={attachmentId,messageId,kind,name:originalName,type:originalType,size:file.size,bytes,uid:firebaseUser.uid,conversationId:String(c.id),recipientUid:c.peerUid||null,groupId:c.cloudGroup?String(c.id):null,disappearAfterSeconds:state.settings.disappearingTextSeconds??null};
    const svc=createAttachmentSendService({stageEncryptedOutbox:async row=>{stagedMessage.text=JSON.stringify({fidunioAttachment:1,attachmentId:row.attachmentId,kind:row.attachmentKind,name:row.manifest.name,type:row.manifest.type,size:row.manifest.size,key:row.attachmentKey,storagePaths:row.storagePaths});stagedMessage.disappearAfterSeconds=row.disappearAfterSeconds;await persistState();render();},uploadEncryptedAttachment,commitAttachmentMessage:async row=>{if(c.cloudGroup)await queueGroupTextForApp({groupId:c.id,messageId:row.messageId,text:stagedMessage.text,time:stagedMessage.time,disappearAfterSeconds:row.disappearAfterSeconds,persistEncryptedOutbox:persistGroupOutboxPayload});else await queueOutboxMessage(c.id,stagedMessage);await flushQueuedAfterAuthoritativeReconcile();},removeEncryptedOutbox:async()=>{}});
    await svc.send(descriptor);
  }catch(err){stagedMessage.state="failed";await persistState();render();alert("Attachment could not be sent: "+(err?.message||err));}
}

async function chooseAndSendAttachment(kind,accept,capture){
  const c=currentConversation();if(!firebaseUser||(!c?.cloud&&!c?.cloudGroup))return alert("Attachments require a signed-in cloud conversation.");
  const input=document.createElement("input");input.type="file";input.accept=accept;if(capture)input.setAttribute("capture","environment");
  const closePicker=()=>{attachmentPickerActive=false;input.remove();};
  input.oncancel=closePicker;
  input.onchange=async()=>{const file=input.files?.[0];closePicker();if(file)await sendSelectedAttachmentFile(kind,file);};
  input.hidden=true;input.setAttribute("aria-hidden","true");document.body.appendChild(input);attachmentPickerActive=true;input.click();
}
'''
          s=s[:start]+replacement+s[end:]

          anchor='''    host.querySelector("#videoLibraryBtn").onclick=()=>choose(false);\n    host.querySelector("#videoCameraBtn").onclick=()=>choose(true);\n    host.querySelector("#modalCancel").onclick=()=>{state.modal=null;host.remove();render();};\n  } else if(modal.type==="pendingMessage"){'''
          addition='''    host.querySelector("#videoLibraryBtn").onclick=()=>choose(false);\n    host.querySelector("#videoCameraBtn").onclick=()=>choose(true);\n    host.querySelector("#modalCancel").onclick=()=>{state.modal=null;host.remove();render();};\n  } else if(modal.type==="audioSource"){\n    host.innerHTML=`\n      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="audioSourceTitle">\n        <h2 id="audioSourceTitle">Send Audio</h2>\n        <p>Record a new voice message or choose a saved audio file.</p>\n        <div class="modal-actions">\n          <button class="modal-confirm" id="audioRecordBtn">Record Audio</button>\n          <button class="modal-confirm" id="audioFileBtn">Choose Audio File</button>\n          <button class="modal-cancel" id="modalCancel">Cancel</button>\n        </div>\n      </div>`;\n    document.body.appendChild(host);\n    host.querySelector("#audioRecordBtn").onclick=()=>{state.modal={type:"audioRecorder"};host.remove();render();};\n    host.querySelector("#audioFileBtn").onclick=()=>{state.modal=null;host.remove();chooseAndSendAttachment("audio","audio/*",false);};\n    host.querySelector("#modalCancel").onclick=()=>{state.modal=null;host.remove();render();};\n  } else if(modal.type==="audioRecorder"){\n    host.innerHTML=`\n      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="audioRecorderTitle">\n        <h2 id="audioRecorderTitle">Record Audio</h2>\n        <p id="audioRecorderStatus">Ready to record from the microphone.</p>\n        <div class="modal-actions">\n          <button class="modal-confirm" id="audioStartBtn">Start Recording</button>\n          <button class="modal-confirm" id="audioStopBtn" hidden>Stop &amp; Send</button>\n          <button class="modal-cancel" id="modalCancel">Cancel</button>\n        </div>\n      </div>`;\n    document.body.appendChild(host);\n    const status=host.querySelector("#audioRecorderStatus"),startBtn=host.querySelector("#audioStartBtn"),stopBtn=host.querySelector("#audioStopBtn"),cancelBtn=host.querySelector("#modalCancel");\n    let stream=null,recorder=null,chunks=[],discard=false;\n    const stopTracks=()=>{for(const track of stream?.getTracks?.()||[])track.stop();stream=null;};\n    const exitToSource=()=>{state.modal={type:"audioSource"};host.remove();render();};\n    cancelBtn.onclick=()=>{discard=true;if(recorder&&recorder.state!=="inactive")recorder.stop();else stopTracks();state.modal=null;host.remove();render();};\n    startBtn.onclick=async()=>{\n      if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==="undefined"){alert("Audio recording is not available in this browser. Choose Audio File instead.");return exitToSource();}\n      startBtn.disabled=true;status.textContent="Requesting microphone access…";\n      try{\n        stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});\n        const candidates=["audio/mp4","audio/webm;codecs=opus","audio/webm"];\n        const mime=candidates.find(type=>MediaRecorder.isTypeSupported?.(type))||"";\n        recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);\n        chunks=[];discard=false;\n        recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data);};\n        recorder.onerror=e=>{stopTracks();alert("Audio recording failed: "+(e.error?.message||"Recorder error"));if(host.isConnected)exitToSource();};\n        recorder.onstop=async()=>{\n          stopTracks();\n          if(discard||!chunks.length)return;\n          const type=recorder.mimeType||mime||"audio/mp4";\n          const ext=type.includes("mp4")?"m4a":type.includes("ogg")?"ogg":"webm";\n          const blob=new Blob(chunks,{type});\n          const file=new File([blob],`fidunio-audio-${Date.now()}.${ext}`,{type,lastModified:Date.now()});\n          state.modal=null;if(host.isConnected)host.remove();render();\n          await sendSelectedAttachmentFile("audio",file);\n        };\n        recorder.start();status.textContent="Recording…";startBtn.hidden=true;stopBtn.hidden=false;\n      }catch(err){stopTracks();startBtn.disabled=false;status.textContent="Microphone access was not started.";alert("Could not start audio recording: "+(err?.message||err));}\n    };\n    stopBtn.onclick=()=>{if(!recorder||recorder.state==="inactive")return;stopBtn.disabled=true;status.textContent="Finishing recording…";recorder.stop();};\n  } else if(modal.type==="pendingMessage"){'''
          assert s.count(anchor)==1, 'audio modal insertion anchor changed'
          s=s.replace(anchor,addition,1)
          p.write_text(s)

          Path('audio-source-recorder.test.mjs').write_text('''import assert from "node:assert/strict";\nimport {readFileSync} from "node:fs";\nconst app=readFileSync(new URL("./app.js",import.meta.url),"utf8");\nassert.match(app,/label==="Photo"\\|\\|label==="Video"\\|\\|label==="Audio"/);\nassert.match(app,/modal\\.type==="audioSource"/);\nassert.match(app,/id="audioRecordBtn">Record Audio<\\/button>/);\nassert.match(app,/id="audioFileBtn">Choose Audio File<\\/button>/);\nassert.match(app,/chooseAndSendAttachment\\("audio","audio\\/\\*",false\\)/);\nassert.match(app,/navigator\\.mediaDevices\\?\\.getUserMedia/);\nassert.match(app,/getUserMedia\\(\\{audio:true,video:false\\}\\)/);\nassert.match(app,/new MediaRecorder\\(stream/);\nassert.match(app,/sendSelectedAttachmentFile\\("audio",file\\)/);\nassert.doesNotMatch(app,/Audio:\["audio","audio\\/\\*",true\]/);\nassert.doesNotMatch(app,/kind==="audio"\\?"user":"environment"/);\nassert.match(app,/kind==="audio"\\?"Audio":kind==="photo"\\?"Photo":"Attachment"/);\nconsole.log("Audio source chooser and recorder gate passed");\n''')

          pkg=Path('package.json'); data=json.loads(pkg.read_text()); data['scripts']['test:audio-source-recorder']='node audio-source-recorder.test.mjs'; pkg.write_text(json.dumps(data,separators=(',',':')))

          v=Path('version.js'); x=v.read_text(); assert '0.9.9.9z' in x; v.write_text(x.replace('0.9.9.9z','0.9.9.10',1))
          sw=Path('service-worker.js'); x=sw.read_text(); assert '0.9.9.9z-iphone-composer-video-source' in x; sw.write_text(x.replace('0.9.9.9z-iphone-composer-video-source','0.9.9.10-audio-recorder-source',1))
          for name in ['outbox-reconciliation-boundary.test.mjs','direct-message-basic-path.test.mjs']:
              q=Path(name); x=q.read_text(); x=x.replace('0\\.9\\.9\\.9z-iphone-composer-video-source','0\\.9\\.9\\.10-audio-recorder-source'); q.write_text(x)

          def prepend(path,title,section):
              q=Path(path); x=q.read_text()
              if section.splitlines()[0] not in x:
                  assert x.startswith(title)
                  q.write_text(title+'\n\n'+section+'\n\n'+x[len(title):].lstrip())

          section='''## 0.9.9.10 Audio source chooser and microphone recorder\n\n**Status: DEVICE CANDIDATE.**\n\nObserved on iPhone: tapping Audio invoked a camera/video capture path; the returned video MIME was then correctly rejected by the audio validator as an unsupported attachment type and showed the 25 MB audio limit. The Audio tool no longer uses the generic capture hint. It now opens **Record Audio / Choose Audio File / Cancel**. Record Audio uses microphone-only `getUserMedia({audio:true, video:false})` plus `MediaRecorder`; Choose Audio File opens `audio/*` without any capture attribute. Both sources converge on the same existing attachment validation, encryption, Storage upload, Outbox/publication and receipt path. No Firebase or E2EE authority changed.'''
          prepend('CURRENT-REBUILD.md','# FIDUNIO Current Rebuild — Recovery Entry Point',section)
          prepend('BUG-LIST.md','# FIDUNIO / Hermes Bug List',section)
          prepend('README.md','# FIDUNIO / Hermes',section)
          dev='''## Audio tool — source chooser and recorder\n\n**Status: DEVICE CANDIDATE on FIDUNIO 0.9.9.10 — 2026-09-08.**\n\nAcceptance on iPhone: tap Audio and confirm **Record Audio / Choose Audio File / Cancel**. Record Audio must request microphone access and must not launch the camera; record a short clip, use Stop & Send, and confirm it appears locally and reaches the peer. Choose Audio File must open saved audio selection without launching the camera; choose a valid saved audio file and send it. Reopen the conversation and confirm both audio attachments remain accessible. Confirm Photo and Video source choosers still behave normally.'''
          prepend('DEVICE-ACCEPTANCE-BUGS.md','# FIDUNIO Device Acceptance — Current Evidence',dev)
          checklist='''### Audio source chooser + recorder — 0.9.9.10\n\n- [x] Remove the generic audio capture hint that could launch iPhone video capture.\n- [x] Add Audio chooser: Record Audio / Choose Audio File / Cancel.\n- [x] Record Audio uses microphone-only media capture and MediaRecorder.\n- [x] Choose Audio File uses `audio/*` with no capture attribute.\n- [x] Both paths converge on one existing attachment send owner.\n- [x] Audio validation failures identify themselves as Audio rather than generic Attachment.\n- [x] Add focused regression coverage.\n- [ ] Device-confirm microphone recording does not launch camera and sends successfully.\n- [ ] Device-confirm saved audio selection and send.\n- [ ] Reopen and confirm both audio attachments remain accessible.\n- [ ] Confirm Photo and Video choosers remain unchanged.'''
          prepend('FIDUNIO-BUILD-CHECKLIST.md','# FIDUNIO Complete Rebuild — Authoritative Build Checklist',checklist)
          mem=Path('hermes-memory.txt'); x=mem.read_text(); note='''\n\n2026-09-08 — Audio candidate 0.9.9.10: iPhone Audio previously used a generic file input with an audio capture hint, which could open video capture; the returned video MIME was then rejected by the existing audio validator. Audio now opens Record Audio / Choose Audio File / Cancel. Record Audio is microphone-only MediaRecorder capture; saved audio uses audio/* without capture. Both converge on the existing attachment send pipeline. Device acceptance pending.\n''';
          if 'Audio candidate 0.9.9.10' not in x: mem.write_text(x.rstrip()+note)
          PY
      - name: Run focused audio gates
        run: |
          node audio-source-recorder.test.mjs
          node attachment-ui-wiring.test.mjs
          node issue3-iphone-ui.test.mjs
          node outbox-reconciliation-boundary.test.mjs
          node direct-message-basic-path.test.mjs
      - name: Commit candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js audio-source-recorder.test.mjs package.json version.js service-worker.js outbox-reconciliation-boundary.test.mjs direct-message-basic-path.test.mjs CURRENT-REBUILD.md BUG-LIST.md DEVICE-ACCEPTANCE-BUGS.md README.md FIDUNIO-BUILD-CHECKLIST.md hermes-memory.txt
          git diff --cached --check
          git commit -m 'Build 0.9.9.10 audio chooser and recorder candidate'
          git push
