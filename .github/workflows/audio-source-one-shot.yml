name: Audio source and recorder one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audio-source-one-shot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audio patch
        run: |
          python audio-patch.py
          python audio-test-fix.py
      - name: Run focused audio gates
        run: |
          node audio-source-recorder.test.mjs
          node attachment-ui-wiring.test.mjs
          node issue3-iphone-ui.test.mjs
          node outbox-reconciliation-boundary.test.mjs
          node direct-message-basic-path.test.mjs
      - name: Commit candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js audio-source-recorder.test.mjs attachment-ui-wiring.test.mjs package.json version.js service-worker.js outbox-reconciliation-boundary.test.mjs direct-message-basic-path.test.mjs CURRENT-REBUILD.md BUG-LIST.md DEVICE-ACCEPTANCE-BUGS.md README.md FIDUNIO-BUILD-CHECKLIST.md hermes-memory.txt
          git diff --cached --check
          git commit -m 'Build 0.9.9.10 audio chooser and recorder candidate'
          git push
