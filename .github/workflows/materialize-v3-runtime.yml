name: Materialize v3 Runtime
on:
  push:
    branches: [fidunio-rebuild-baseline-2026-09-05]
    paths: [.github/workflows/materialize-v3-runtime.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-rebuild-baseline-2026-09-05
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node materialize-v3-runtime.mjs
      - name: Focused syntax and security tests
        run: |
          node --check app.js
          node --check firebase.js
          node --check settings-lifecycle.js
          node --check service-worker.js
          npm run test:e2ee-account-recovery-client
          npm run test:e2ee-account-message-crypto
          npm run test:e2ee-account-message-service
          npm run test:runtime-transform-anchors
          npm run test:runtime-authority
      - name: Commit materialized result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Cut over direct messaging to account E2EE v3 runtime"
          git push
