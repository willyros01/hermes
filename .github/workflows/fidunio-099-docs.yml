name: FIDUNIO 0.9.9 Candidate Docs
on: {push: {branches: [fidunio-complete-rebuild], paths: [.fidunio-099-docs-trigger]}}
permissions: {contents: write}
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fidunio-complete-rebuild, fetch-depth: 0}
      - run: python .fidunio-099-docs.py
      - run: |
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add README.md hermes-memory.txt CURRENT-REBUILD.md FIDUNIO-BUILD-CHECKLIST.md DETERMINISTIC-UI-LIFECYCLE.md RUNTIME-AUTHORITY-MAP.md architecture-ownership.txt BUG-LIST.md hermes-setup.txt
          git commit -m "Reconcile FIDUNIO 0.9.9.5 candidate documentation"
          git push origin HEAD:fidunio-complete-rebuild
