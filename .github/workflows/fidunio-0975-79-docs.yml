name: FIDUNIO 0.9.7.5-0.9.7.9 Docs
on: {push: {branches: [fidunio-complete-rebuild], paths: [.fidunio-0975-79-docs-trigger]}}
permissions: {contents: write}
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fidunio-complete-rebuild, fetch-depth: 0}
      - run: python .fidunio-0975-79-docs.py
      - run: |
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add README.md hermes-memory.txt CURRENT-REBUILD.md RUNTIME-AUTHORITY-MAP.md architecture-ownership.txt ACCOUNT-E2EE-FIRESTORE-AUTHORITY.md DISAPPEARING-PURGE-AUTHORITY.md ATTACHMENT-AUTHORITY.md FIDUNIO-BUILD-CHECKLIST.md
          git commit -m "Document validated FIDUNIO 0.9.7.5 through 0.9.7.9"
          git push origin HEAD:fidunio-complete-rebuild
