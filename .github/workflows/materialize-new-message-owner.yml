name: Materialize New Message Owner

on:
  push:
    branches: [fidunio-rebuild-baseline-2026-09-05]
    paths:
      - 'rebuild-new-message-owner.mjs'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node rebuild-new-message-owner.mjs
      - name: Validate explicit ownership
        run: |
          node --check app.js
          node --check bootstrap.js
          node --check new-message-owner.js
          grep -q 'mountNewMessageRecipientPicker' app.js
          grep -q 'fidunioRecipientPickerHost' app.js
          ! grep -q 'new-message-polish.js' bootstrap.js
          ! grep -q 'MutationObserver' new-message-owner.js
          grep -q 'version: "0.9.6.1"' version.js
          npm run test:runtime-transform-anchors
          git diff --check
      - name: Commit explicit New Message lifecycle
        run: |
          git config user.name 'willyros01'
          git config user.email 'willyros01@gmail.com'
          git add app.js bootstrap.js version.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize New Message recipient owner'
          git push
