name: Temporary disappearing attachment activation build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-disappearing-attachments.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 0.9.9.19 disappearing attachments
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'anchor missing: {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,count))

          # 1) Activate the existing disappearing selection for future attachments too.
          compose=Path('disappearing-compose-policy.js')
          s=compose.read_text()
          old='''export const DISAPPEARING_PURGE_VERSION=1;\nfunction isAttachmentPayload(text){\n  if(typeof text!=="string"||!text.trimStart().startsWith("{"))return false;\n  try{return JSON.parse(text)?.fidunioAttachment===1;}catch{return false;}\n}\nexport function disappearingPurgeVersionForOutgoing({text,value}={}){\n  const duration=resolveComposeDisappearSelection(value);\n  return duration!=null&&!isAttachmentPayload(text)?DISAPPEARING_PURGE_VERSION:null;\n}\nexport function stampOutgoingDisappearSelection(message,value){\n  const duration=resolveComposeDisappearSelection(value);\n  // Activation 0.9.9.12 is text-only. Attachment Storage deletion is a\n  // separate server trace resource and must not be implied by this timer.\n  if(duration==null||isAttachmentPayload(message?.text))return {...message};\n  return {...message,disappearAfterSeconds:duration,disappearingPurgeVersion:DISAPPEARING_PURGE_VERSION};\n}\n'''
          new='''export const DISAPPEARING_PURGE_VERSION=1;\nexport function disappearingPurgeVersionForOutgoing({value}={}){\n  const duration=resolveComposeDisappearSelection(value);\n  return duration!=null?DISAPPEARING_PURGE_VERSION:null;\n}\nexport function stampOutgoingDisappearSelection(message,value){\n  const duration=resolveComposeDisappearSelection(value);\n  if(duration==null)return {...message};\n  // 0.9.9.19 extends the already-accepted disappearing selection to future\n  // attachments. The same immutable duration/version metadata is carried by\n  // text and attachment messages; the server purge repository remains the\n  // sole physical Firestore/Storage deletion owner.\n  return {...message,disappearAfterSeconds:duration,disappearingPurgeVersion:DISAPPEARING_PURGE_VERSION};\n}\n'''
          if old not in s: raise SystemExit('compose attachment exclusion anchor missing')
          compose.write_text(s.replace(old,new,1))

          # 2) The sole server purge repository now owns deterministic Storage-prefix cleanup.
          adapter='''// FIDUNIO disappearing-content purge Firestore + Storage repository.\n// SERVER ONLY. Browser/app code must never import or instantiate this adapter.\n// Firebase Admin services are injected so this module does not become a second\n// SDK initializer. Every physical source/receipt/grant/attachment delete stays\n// behind this one repository path.\n\nimport {planGroupHistoryGrantSourcePurge} from "./disappearing-group-grant-trace-plan.js";\n\nexport const MAX_GROUP_PURGE_TRANSACTION_WRITES=400;\nfunction fail(code,message){const error=new Error(message);error.code=code;return error;}\nfunction text(value,name){const out=String(value??"").trim();if(!out)throw fail("INVALID_INPUT",`${name} is required.`);return out;}\nfunction dataOf(snap){return snap?.exists?snap.data():null;}\nfunction stamp(snap){if(!snap?.exists)return "missing";const t=snap.updateTime;if(t&&Number.isFinite(Number(t.seconds))&&Number.isFinite(Number(t.nanoseconds)))return `${Number(t.seconds)}:${Number(t.nanoseconds)}`;if(t&&typeof t.toMillis==="function")return `ms:${t.toMillis()}`;throw fail("PURGE_VERSION_UNAVAILABLE","Authoritative Firestore update time is unavailable.");}\nfunction pathOf(snap,ref){return String(snap?.ref?.path||ref?.path||"");}\nfunction basis(parts){return JSON.stringify(parts);}\nfunction array(value){return Array.isArray(value)?value.map(x=>String(x||"").trim()).filter(Boolean):[];}\nfunction sameBasis(actual,expected){if(actual!==String(expected??""))throw fail("STALE_PURGE_BASIS","Disappearing purge authority changed before commit.");}\nfunction directBasis(conversationSnap,messageSnap){return basis([[pathOf(conversationSnap),stamp(conversationSnap)],[pathOf(messageSnap),stamp(messageSnap)]]);}\nfunction groupBasis(groupSnap,messageSnap,epochSnap,receiptSnaps,grantEntries=[]){const receiptVersions=[...(receiptSnaps||[])].map(s=>[pathOf(s),stamp(s)]).sort((a,b)=>a[0].localeCompare(b[0]));const grantVersions=[];for(const entry of grantEntries||[]){grantVersions.push([pathOf(entry.grantSnap),stamp(entry.grantSnap)]);for(const copySnap of entry.copySnaps||[])grantVersions.push([pathOf(copySnap),stamp(copySnap)]);}grantVersions.sort((a,b)=>a[0].localeCompare(b[0]));return basis([[pathOf(groupSnap),stamp(groupSnap)],[pathOf(messageSnap),stamp(messageSnap)],[pathOf(epochSnap),stamp(epochSnap)],receiptVersions,grantVersions]);}\nfunction directRecipient(conversation,message){const members=array(conversation?.members),sender=String(message?.senderUid||"");if(conversation?.type!=="direct"||members.length!==2||!sender||!members.includes(sender))throw fail("PURGE_SOURCE_INVALID","Direct purge authority is malformed.");const recipient=members.find(uid=>uid!==sender);if(!recipient)throw fail("PURGE_SOURCE_INVALID","Direct purge recipient is unavailable.");return recipient;}\nfunction epochMembers(epoch){const keys=epoch?.memberKeyIds&&typeof epoch.memberKeyIds==="object"?Object.keys(epoch.memberKeyIds):[];if(!keys.length)throw fail("PURGE_SOURCE_INVALID","Source group epoch member authority is unavailable.");return keys.sort();}\nfunction grantRows(entries){return entries.map(entry=>({grant:{...entry.grantSnap.data()},copies:(entry.copySnaps||[]).map(s=>({...s.data()}))}));}\nfunction groupPurgeWriteCount(receiptSnaps,plan){return (receiptSnaps?.length||0)+(plan?.copiesToDelete?.length||0)+(plan?.grantsToDelete?.length||0)+(plan?.grantsToUpdate?.length||0)+1;}\n\nexport function createDisappearingPurgeFirestoreAdminRepository({db,bucket}={}){\n  if(!db||typeof db.doc!=="function"||typeof db.runTransaction!=="function")throw new Error("Admin Firestore database is required.");\n  if(!bucket||typeof bucket.deleteFiles!=="function")throw new Error("Admin Storage bucket is required.");\n  const directConversationRef=id=>db.doc(`conversations/${id}`),directMessageRef=(cid,mid)=>db.doc(`conversations/${cid}/messages/${mid}`),groupRef=id=>db.doc(`groups/${id}`),groupMessageRef=(gid,mid)=>db.doc(`groups/${gid}/messages/${mid}`),groupEpochRef=(gid,epoch)=>db.doc(`groups/${gid}/epochs/${epoch}`),groupReceiptsRef=(gid,mid)=>db.doc(`groups/${gid}/messages/${mid}`).collection("receipts"),groupHistoryGrantsRef=gid=>db.doc(`groups/${gid}`).collection("historyGrants");\n  function attachmentPrefix(senderUid,conversationId,messageId){return `attachments/${text(senderUid,"Sender UID")}/${text(conversationId,"Conversation ID")}/${text(messageId,"Message ID")}/`;}\n  async function deleteAttachmentStorageTraces({senderUid,conversationId,messageId}){const prefix=attachmentPrefix(senderUid,conversationId,messageId);await bucket.deleteFiles({prefix,force:true});return prefix;}\n  async function readDirectPurgeState({conversationId,messageId}){const cid=text(conversationId,"Conversation ID"),mid=text(messageId,"Message ID"),cRef=directConversationRef(cid),mRef=directMessageRef(cid,mid);const [cSnap,mSnap]=await Promise.all([cRef.get(),mRef.get()]);const conversation=dataOf(cSnap),message=dataOf(mSnap);if(!conversation||!message)return null;return Object.freeze({basis:directBasis(cSnap,mSnap),recipientUid:directRecipient(conversation,message),message:{...message}});}\n  async function preflightDirect({cid,mid,expected,cRef,mRef}){const [cSnap,mSnap]=await Promise.all([cRef.get(),mRef.get()]);if(!mSnap?.exists)return null;if(!cSnap?.exists)throw fail("PURGE_SOURCE_INVALID","Direct conversation authority disappeared before purge.");sameBasis(directBasis(cSnap,mSnap),expected);directRecipient(cSnap.data(),mSnap.data());return{senderUid:text(mSnap.data()?.senderUid,"Sender UID")};}\n  async function commitDirectPurge({conversationId,messageId,expectedBasis}){\n    const cid=text(conversationId,"Conversation ID"),mid=text(messageId,"Message ID"),expected=String(expectedBasis??"");if(!expected)throw fail("INVALID_INPUT","Expected purge basis is required.");const cRef=directConversationRef(cid),mRef=directMessageRef(cid,mid),pre=await preflightDirect({cid,mid,expected,cRef,mRef});\n    if(!pre)return{purged:true,alreadyAbsent:true,traceCount:0,storagePurged:false};\n    // Revalidation happens before the first physical mutation. Storage is a\n    // subordinate source trace and is deleted before the Firestore source.\n    // The final transaction revalidates the same basis again before source delete.\n    const storagePrefix=await deleteAttachmentStorageTraces({senderUid:pre.senderUid,conversationId:cid,messageId:mid});\n    const committed=await db.runTransaction(async tx=>{const [cSnap,mSnap]=await Promise.all([tx.get(cRef),tx.get(mRef)]);if(!mSnap?.exists)return{purged:true,alreadyAbsent:true,traceCount:0};if(!cSnap?.exists)throw fail("PURGE_SOURCE_INVALID","Direct conversation authority disappeared before purge.");sameBasis(directBasis(cSnap,mSnap),expected);directRecipient(cSnap.data(),mSnap.data());tx.delete(mRef);return{purged:true,alreadyAbsent:false,traceCount:1};});\n    return{...committed,storagePurged:true,storagePrefix};\n  }\n  async function readGroupGrantEntries(gid,getter=query=>query.get()){const grantsQuery=await getter(groupHistoryGrantsRef(gid)),entries=[];for(const grantSnap of grantsQuery?.docs||[]){const copiesQuery=await getter(grantSnap.ref.collection("messages"));entries.push({grantSnap,copySnaps:copiesQuery?.docs||[]});}entries.sort((a,b)=>a.grantSnap.ref.path.localeCompare(b.grantSnap.ref.path));return entries;}\n  async function readGroupPurgeState({groupId,messageId}){const gid=text(groupId,"Group ID"),mid=text(messageId,"Message ID"),gRef=groupRef(gid),mRef=groupMessageRef(gid,mid);const [gSnap,mSnap]=await Promise.all([gRef.get(),mRef.get()]);const group=dataOf(gSnap),message=dataOf(mSnap);if(!group||!message)return null;const keyEpoch=Number(message.keyEpoch);if(!Number.isInteger(keyEpoch)||keyEpoch<1)throw fail("PURGE_SOURCE_INVALID","Group purge source epoch is invalid.");const eRef=groupEpochRef(gid,keyEpoch),rRef=groupReceiptsRef(gid,mid);const [eSnap,rQuery,grantEntries]=await Promise.all([eRef.get(),rRef.get(),readGroupGrantEntries(gid)]);const epoch=dataOf(eSnap);if(!epoch)throw fail("PURGE_SOURCE_INVALID","Source group epoch member authority is unavailable.");const receipts=(rQuery?.docs||[]).map(s=>({...s.data()})),grantTracePlan=planGroupHistoryGrantSourcePurge({groupId:gid,sourceMessageId:mid,grants:grantRows(grantEntries)});return Object.freeze({basis:groupBasis(gSnap,mSnap,eSnap,rQuery?.docs||[],grantEntries),message:{...message},epochMemberUids:epochMembers(epoch),currentMemberUids:array(group.memberUids),receipts,grantTracePlan});}\n  async function preflightGroup({gid,mid,expected,gRef,mRef,rRef}){const [gSnap,mSnap]=await Promise.all([gRef.get(),mRef.get()]);if(!mSnap?.exists)return null;if(!gSnap?.exists)throw fail("PURGE_SOURCE_INVALID","Group authority disappeared before purge.");const message=mSnap.data(),keyEpoch=Number(message?.keyEpoch);if(!Number.isInteger(keyEpoch)||keyEpoch<1)throw fail("PURGE_SOURCE_INVALID","Group purge source epoch is invalid.");const eRef=groupEpochRef(gid,keyEpoch),[eSnap,rQuery,grantEntries]=await Promise.all([eRef.get(),rRef.get(),readGroupGrantEntries(gid)]);if(!eSnap?.exists)throw fail("PURGE_SOURCE_INVALID","Source group epoch authority disappeared before purge.");epochMembers(eSnap.data());sameBasis(groupBasis(gSnap,mSnap,eSnap,rQuery?.docs||[],grantEntries),expected);const plan=planGroupHistoryGrantSourcePurge({groupId:gid,sourceMessageId:mid,grants:grantRows(grantEntries)}),writeCount=groupPurgeWriteCount(rQuery?.docs||[],plan);if(writeCount>MAX_GROUP_PURGE_TRANSACTION_WRITES)throw fail("PURGE_TRACE_TOO_LARGE",`Group purge requires ${writeCount} writes; maximum is ${MAX_GROUP_PURGE_TRANSACTION_WRITES}.`);return{senderUid:text(message?.senderUid,"Sender UID")};}\n  async function commitGroupPurge({groupId,messageId,expectedBasis}){\n    const gid=text(groupId,"Group ID"),mid=text(messageId,"Message ID"),expected=String(expectedBasis??"");if(!expected)throw fail("INVALID_INPUT","Expected purge basis is required.");const gRef=groupRef(gid),mRef=groupMessageRef(gid,mid),rRef=groupReceiptsRef(gid,mid),pre=await preflightGroup({gid,mid,expected,gRef,mRef,rRef});\n    if(!pre)return{purged:true,alreadyAbsent:true,traceCount:0,storagePurged:false};\n    const storagePrefix=await deleteAttachmentStorageTraces({senderUid:pre.senderUid,conversationId:gid,messageId:mid});\n    const committed=await db.runTransaction(async tx=>{\n      const [gSnap,mSnap]=await Promise.all([tx.get(gRef),tx.get(mRef)]);if(!mSnap?.exists)return{purged:true,alreadyAbsent:true,traceCount:0};if(!gSnap?.exists)throw fail("PURGE_SOURCE_INVALID","Group authority disappeared before purge.");const message=mSnap.data(),keyEpoch=Number(message?.keyEpoch);if(!Number.isInteger(keyEpoch)||keyEpoch<1)throw fail("PURGE_SOURCE_INVALID","Group purge source epoch is invalid.");const eRef=groupEpochRef(gid,keyEpoch);const [eSnap,rQuery,grantEntries]=await Promise.all([tx.get(eRef),tx.get(rRef),readGroupGrantEntries(gid,query=>tx.get(query))]);if(!eSnap?.exists)throw fail("PURGE_SOURCE_INVALID","Source group epoch authority disappeared before purge.");epochMembers(eSnap.data());sameBasis(groupBasis(gSnap,mSnap,eSnap,rQuery?.docs||[],grantEntries),expected);\n      const plan=planGroupHistoryGrantSourcePurge({groupId:gid,sourceMessageId:mid,grants:grantRows(grantEntries)}),writeCount=groupPurgeWriteCount(rQuery?.docs||[],plan);if(writeCount>MAX_GROUP_PURGE_TRANSACTION_WRITES)throw fail("PURGE_TRACE_TOO_LARGE",`Group purge requires ${writeCount} writes; maximum is ${MAX_GROUP_PURGE_TRANSACTION_WRITES}.`);\n      const entriesByGrant=new Map(grantEntries.map(entry=>[String(entry.grantSnap.data()?.grantId||""),entry]));let traceCount=0;\n      for(const receiptSnap of rQuery?.docs||[]){tx.delete(receiptSnap.ref);traceCount++;}\n      for(const copy of plan.copiesToDelete){const entry=entriesByGrant.get(copy.grantId),copySnap=entry?.copySnaps?.find(s=>String(s.data()?.sourceMessageId||"")===copy.sourceMessageId);if(!copySnap)throw fail("GRANT_TRACE_INCONSISTENT","Planned history copy disappeared before purge commit.");tx.delete(copySnap.ref);traceCount++;}\n      for(const grantId of plan.grantsToDelete){const entry=entriesByGrant.get(grantId);if(!entry?.grantSnap?.exists)throw fail("GRANT_TRACE_INCONSISTENT","Planned history grant disappeared before purge commit.");tx.delete(entry.grantSnap.ref);traceCount++;}\n      for(const update of plan.grantsToUpdate){const entry=entriesByGrant.get(update.grantId);if(!entry?.grantSnap?.exists)throw fail("GRANT_TRACE_INCONSISTENT","Planned history grant disappeared before purge commit.");tx.update(entry.grantSnap.ref,{totalCopies:update.totalCopies,firstSharedMessageId:update.firstSharedMessageId,firstSharedAt:update.firstSharedAt});traceCount++;}\n      tx.delete(mRef);traceCount++;return{purged:true,alreadyAbsent:false,traceCount};\n    });\n    return{...committed,storagePurged:true,storagePrefix};\n  }\n  return Object.freeze({readDirectPurgeState,commitDirectPurge,readGroupPurgeState,commitGroupPurge});\n}\n\nexport const DISAPPEARING_PURGE_FIRESTORE_V1=Object.freeze({serverOnly:true,directMessagePath:"conversations/{conversationId}/messages/{messageId}",groupMessagePath:"groups/{groupId}/messages/{messageId}",groupReceiptPath:"groups/{groupId}/messages/{messageId}/receipts/{uid}",groupEpochPath:"groups/{groupId}/epochs/{keyEpoch}",groupHistoryGrantPath:"groups/{groupId}/historyGrants/{grantId}",groupHistoryGrantCopyPath:"groups/{groupId}/historyGrants/{grantId}/messages/{sourceMessageId}",attachmentStoragePrefix:"attachments/{senderUid}/{conversationId}/{messageId}/",attachmentStorageDeleteReady:true,storageBeforeSource:true,clientDeleteRulesRequired:false,groupPhysicalDeleteReady:true,maxGroupTransactionWrites:MAX_GROUP_PURGE_TRANSACTION_WRITES,oversizeErrorCode:"PURGE_TRACE_TOO_LARGE"});\n'''
          Path('disappearing-purge-firestore-admin-adapter.mjs').write_text(adapter)
          Path('functions/disappearing/disappearing-purge-firestore-admin-adapter.mjs').write_text(adapter)

          # 3) Use the already-owned Admin Storage bucket in the live scheduler repository.
          idx=Path('functions/index.mjs'); s=idx.read_text()
          old='''const db = getFirestore();\nconst { identityRepo, sessionRepo } = createRecoveryFirestoreAdminRepositories({ db });\nconst {messageRepo,attachmentRepo}=createMessageDeleteAdminRepositories({db,bucket:getStorage().bucket(ATTACHMENT_BUCKET)});\nconst disappearingPurgeRepository=createDisappearingPurgeFirestoreAdminRepository({db});\n'''
          new='''const db = getFirestore();\nconst attachmentBucket=getStorage().bucket(ATTACHMENT_BUCKET);\nconst { identityRepo, sessionRepo } = createRecoveryFirestoreAdminRepositories({ db });\nconst {messageRepo,attachmentRepo}=createMessageDeleteAdminRepositories({db,bucket:attachmentBucket});\nconst disappearingPurgeRepository=createDisappearingPurgeFirestoreAdminRepository({db,bucket:attachmentBucket});\n'''
          if old not in s: raise SystemExit('functions bucket wiring anchor missing')
          idx.write_text(s.replace(old,new,1))

          # 4) Local UID-scoped purge also owns attachment object-URL/runtime release.
          app=Path('app.js'); s=app.read_text()
          old='''    for(const id of plan.outboxDeleteIds)outbox.delete(id);\n    await txDone(tx);\n    await persistState();\n    return{purgedMessageIds:ids,outboxDeleted:plan.outboxDeleteIds.length,historyUpdated:historyWrites.length};\n'''
          new='''    for(const id of plan.outboxDeleteIds)outbox.delete(id);\n    await txDone(tx);\n    let attachmentUrlsReleased=0;\n    const targetIds=new Set(ids);\n    for(const [key,runtime] of [...attachmentRuntime.entries()]){\n      const messageId=String(key).slice(String(key).lastIndexOf(":")+1);\n      if(!targetIds.has(messageId))continue;\n      if(runtime?.result?.url){releaseAttachmentResult(runtime.result);attachmentUrlsReleased++;}\n      attachmentRuntime.delete(key);\n    }\n    await persistState();\n    return{purgedMessageIds:ids,outboxDeleted:plan.outboxDeleteIds.length,historyUpdated:historyWrites.length,attachmentUrlsReleased};\n'''
          if old not in s: raise SystemExit('local purge attachment lifecycle anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('Disappearing text:','Disappearing:')
          app.write_text(s)

          # 5) Release/cache bump.
          replace('version.js','version: "0.9.9.18"','version: "0.9.9.19"')
          replace('service-worker.js','SHELL_REVISION="0.9.9.18-direct-date-createdat"','SHELL_REVISION="0.9.9.19-disappearing-attachments"')
          for f in ['outbox-reconciliation-boundary.test.mjs','direct-message-basic-path.test.mjs']:
              q=Path(f); t=q.read_text()
              if '0.9.9.18-direct-date-createdat' in t:t=t.replace('0.9.9.18-direct-date-createdat','0.9.9.19-disappearing-attachments')
              elif '0\\.9\\.9\\.18-direct-date-createdat' in t:t=t.replace('0\\.9\\.9\\.18-direct-date-createdat','0\\.9\\.9\\.19-disappearing-attachments')
              else: raise SystemExit(f'cache anchor missing: {f}')
              q.write_text(t)

          # 6) Compose/activation gates now require attachments to carry the same immutable metadata.
          q=Path('disappearing-compose-policy.test.mjs'); t=q.read_text().replace("'Disappearing text:'","'Disappearing:'")
          insert="""\nconst attachment=stampOutgoingDisappearSelection({id:'att',text:JSON.stringify({fidunioAttachment:1,attachmentId:'a'})},300);\nif(attachment.disappearAfterSeconds!==300||attachment.disappearingPurgeVersion!==1)throw new Error('attachment selection is not stamped by the sole disappearing compose owner');\n"""
          if 'attachment selection is not stamped' not in t:t=t.replace("const app=fs.readFileSync('./app.js','utf8');",insert+"const app=fs.readFileSync('./app.js','utf8');")
          q.write_text(t)

          q=Path('disappearing-activation.test.mjs'); t=q.read_text()
          t=t.replace("assert.equal(disappearingPurgeVersionForOutgoing({text:attachment,value:300}),null);\nassert.equal(stampOutgoingDisappearSelection({text:attachment},300).disappearAfterSeconds,undefined);","assert.equal(disappearingPurgeVersionForOutgoing({text:attachment,value:300}),1);\nassert.equal(stampOutgoingDisappearSelection({text:attachment},300).disappearAfterSeconds,300);\nassert.equal(stampOutgoingDisappearSelection({text:attachment},300).disappearingPurgeVersion,1);")
          t=t.replace("deploy=readFileSync('p.txt','utf8')","deploy=readFileSync('att.txt','utf8')")
          t=t.replace("assert.match(app,/Disappearing text:/)","assert.match(app,/Disappearing:/)")
          t=t.replace("console.log('Disappearing-message activation gate passed');","assert.match(fn,/createDisappearingPurgeFirestoreAdminRepository\\(\\{db,bucket:attachmentBucket\\}\\)/);\nassert.match(deploy,/roles\\/storage\\.objectAdmin/);\nconsole.log('Disappearing text + attachment activation gate passed');")
          q.write_text(t)

          # 7) Strengthen server adapter tests with a fake Storage owner and source-last ordering proof.
          q=Path('disappearing-purge-firestore-admin-adapter.test.mjs'); t=q.read_text()
          t=t.replace('class FakeDb{\n  constructor(seed){this.rows=new Map();this.versions=new Map();this.deleted=[];this.updated=[];for(const [path,data,ver] of seed){this.rows.set(path,data);this.versions.set(path,ver);}}', 'class FakeBucket{constructor(events=[]){this.events=events;this.calls=[];}async deleteFiles(options){this.calls.push(options);this.events.push(`storage:${options.prefix}`);}}\nclass FakeDb{\n  constructor(seed,events=[]){this.rows=new Map();this.versions=new Map();this.deleted=[];this.updated=[];this.events=events;for(const [path,data,ver] of seed){this.rows.set(path,data);this.versions.set(path,ver);}}')
          t=t.replace('for(const ref of deletes){db.deleted.push(ref.path);db.rows.delete(ref.path);db.versions.delete(ref.path);}', 'for(const ref of deletes){db.deleted.push(ref.path);db.events.push(`firestore:${ref.path}`);db.rows.delete(ref.path);db.versions.delete(ref.path);}')
          t=t.replace('let passed=0;async function check(name,fn){await fn();passed++;console.log("PASS",name);}', 'function repoFor(db,bucket=new FakeBucket(db.events)){return createDisappearingPurgeFirestoreAdminRepository({db,bucket});}\nlet passed=0;async function check(name,fn){await fn();passed++;console.log("PASS",name);}')
          t=t.replace('createDisappearingPurgeFirestoreAdminRepository({db})','repoFor(db)')
          t=t.replace('createDisappearingPurgeFirestoreAdminRepository({db:new FakeDb(seed)})','repoFor(new FakeDb(seed))')
          # result objects now include Storage confirmation.
          t=t.replace('assert.deepEqual(result,{purged:true,alreadyAbsent:false,traceCount:1});', 'assert.equal(result.purged,true);assert.equal(result.alreadyAbsent,false);assert.equal(result.traceCount,1);assert.equal(result.storagePurged,true);assert.equal(result.storagePrefix,"attachments/a/c1/m1/");')
          t=t.replace('assert.deepEqual(result,{purged:true,alreadyAbsent:false,traceCount:7});', 'assert.equal(result.purged,true);assert.equal(result.alreadyAbsent,false);assert.equal(result.traceCount,7);assert.equal(result.storagePurged,true);assert.equal(result.storagePrefix,"attachments/a/g1/m1/");')
          # stale preflight must not touch Storage.
          t=t.replace('assert.equal(db.deleted.length,0);});\nawait check("direct commit is idempotent', 'assert.equal(db.deleted.length,0);assert.equal(db.events.some(x=>x.startsWith("storage:")),false);});\nawait check("direct commit is idempotent')
          t=t.replace('assert.equal(db.rows.has("groups/g1/messages/m1"),true);});', 'assert.equal(db.rows.has("groups/g1/messages/m1"),true);assert.equal(db.events.some(x=>x.startsWith("storage:")),false);});')
          # add explicit ordering proof.
          marker='await check("direct commit is idempotent when source already absent"'
          ordering='''await check("attachment Storage prefix is physically deleted before direct Firestore source",async()=>{const events=[],db=new FakeDb(directSeed,events),bucket=new FakeBucket(events),repo=repoFor(db,bucket);const state=await repo.readDirectPurgeState({conversationId:"c1",messageId:"m1"});await repo.commitDirectPurge({conversationId:"c1",messageId:"m1",expectedBasis:state.basis});assert.deepEqual(events,["storage:attachments/a/c1/m1/","firestore:conversations/c1/messages/m1"]);});\n'''
          if ordering not in t:t=t.replace(marker,ordering+marker)
          t=t.replace('assert.throws(()=>createDisappearingPurgeFirestoreAdminRepository({db:{}}),/Admin Firestore/);', 'assert.throws(()=>createDisappearingPurgeFirestoreAdminRepository({db:{},bucket:new FakeBucket()}),/Admin Firestore/);assert.throws(()=>createDisappearingPurgeFirestoreAdminRepository({db:new FakeDb(directSeed)}),/Admin Storage bucket/);')
