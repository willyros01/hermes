name: Group sender label build retry
on:
  push:
    paths:
      - '.github/workflows/group-sender-label-build2.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build bounded group sender-label candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('app.js'); t=app.read_text()
          old='''function renderBubble(m,c){\n  if(m.system) return `<div class="day-divider">${esc(m.text)} • ${esc(m.time)}</div>`;\n'''
          new='''function groupSenderDisplayName(m,c){\n  if(c?.type!=="group"&&!c?.cloudGroup)return "";\n  const senderUid=String(m?.senderUid||(m?.mine?firebaseUser?.uid:"")||"");\n  const member=(Array.isArray(c?.members)?c.members:[]).find(row=>String(row?.id||row?.uid||"")===senderUid);\n  return member?.name||m?.sender||(m?.mine?"You":"FIDUNIO member");\n}\n\nfunction renderBubble(m,c){\n  if(m.system) return `<div class="day-divider">${esc(m.text)} • ${esc(m.time)}</div>`;\n'''
          if old not in t: raise SystemExit('renderBubble anchor missing')
          t=t.replace(old,new,1)
          old2='''  return `<div class="msg-row ${m.mine?"mine":""} ${hasMessageAction?"pending-message-action":""}" ${hasMessageAction?`data-message-id="${esc(m.id)}" data-conversation-id="${esc(c.id)}" role="button" tabindex="0" aria-label="${label} message. Press and hold for actions."`:""}>\n    ${c.type==="group"&&!m.mine&&m.sender?`<div class="sender-label">${esc(m.sender)}</div>`:""}\n    <div class="bubble">\n'''
          new2='''  const groupSender=groupSenderDisplayName(m,c);\n  return `<div class="msg-row ${m.mine?"mine":""} ${hasMessageAction?"pending-message-action":""}" ${hasMessageAction?`data-message-id="${esc(m.id)}" data-conversation-id="${esc(c.id)}" role="button" tabindex="0" aria-label="${label} message. Press and hold for actions."`:""}>\n    ${groupSender?`<div class="sender-label">${esc(groupSender)}</div>`:""}\n    <div class="bubble">\n'''
          if old2 not in t: raise SystemExit('sender-label anchor missing')
          app.write_text(t.replace(old2,new2,1))
          Path('version.js').write_text('globalThis.FIDUNIO_RELEASE = Object.freeze({ version: "0.9.9.13" });\n')
          sw=Path('service-worker.js'); s=sw.read_text().replace('const SHELL_REVISION="0.9.9.12-disappearing-text-activation";','const SHELL_REVISION="0.9.9.13-group-sender-label";'); sw.write_text(s)
          test='''import assert from "node:assert/strict";\nimport {readFileSync} from "node:fs";\nconst app=readFileSync("app.js","utf8");\nconst groupConversation=readFileSync("e2ee-account-group-conversation.js","utf8");\nassert.ok(groupConversation.includes("senderUid:row.senderUid"),"group read projection must preserve senderUid");\nassert.ok(app.includes("function groupSenderDisplayName(m,c)"),"app must own one group sender-name resolver");\nassert.ok(app.includes('c?.type!=="group"&&!c?.cloudGroup'),"sender labels must be group-only");\nassert.ok(app.includes("Array.isArray(c?.members)"),"resolver must use existing group member projection");\nassert.ok(app.includes("row?.id||row?.uid"),"resolver must map sender UID to member identity");\nassert.ok(app.includes("const groupSender=groupSenderDisplayName(m,c)"),"renderBubble must consume resolver");\nassert.ok(app.includes('groupSender?`<div class="sender-label">'),"group bubbles must render sender label");\nassert.ok(!app.includes('c.type==="group"&&!m.mine&&m.sender'),"legacy incoming-only sender dependency must be removed");\nconsole.log("Group sender-label gate passed");\n'''
          Path('group-sender-label.test.mjs').write_text(test)
          wf=Path('.github/workflows/rebuild-baseline-security.yml'); w=wf.read_text(); anchor='      - {name: Group earlier-history admin UI, run: npm run test:group-history-admin-ui}\n'; ins='      - {name: Group sender display label, run: node group-sender-label.test.mjs}\n'+anchor
          if 'Group sender display label' not in w:
              if anchor not in w: raise SystemExit('baseline anchor missing')
              wf.write_text(w.replace(anchor,ins,1))
          readme=Path('README.md'); r=readme.read_text(); note='''### 0.9.9.13 group sender-name labels\n\n**Status: DEVICE CANDIDATE.**\n\n0.9.9.13 is a bounded group-chat presentation change. Every group-message row now resolves the sender UID against the already-owned group member projection and shows that member's FIDUNIO display name above the bubble. This includes incoming and outgoing group bubbles. Direct-message bubbles are unchanged. No Firebase schema/rules, group E2EE, receipt, Outbox, disappearing-message, attachment, PIN, or responsive-layout authority changes are included. A permanent baseline gate verifies that sender identity remains carried by the existing group conversation projection and that rendering is group-only. Device acceptance must confirm names on iPhone and iPad and verify direct chats remain unchanged.\n\n'''
          if '### 0.9.9.13 group sender-name labels' not in r: r=note+r
          r=r.replace('- Current checkpoint version: **0.9.9.9x**','- Current checkpoint version: **0.9.9.13**'); readme.write_text(r)
          cur=Path('CURRENT-REBUILD.md'); c=cur.read_text(); note2='''### GROUP SENDER LABEL CANDIDATE — 0.9.9.13\n\nGroup message rendering now resolves each message's existing `senderUid` against the current group member projection and displays that FIDUNIO member name above the bubble. The change is presentation-only and applies to group rows, including the local user's outgoing group rows. Direct-message bubble structure remains unchanged. No Firebase, E2EE, receipts, Outbox, disappearing-content, attachment, or group membership write path changed. Permanent regression coverage is included; iPhone/iPad device acceptance remains required.\n\n'''
          if '### GROUP SENDER LABEL CANDIDATE — 0.9.9.13' not in c: cur.write_text(note2+c)
          mem=Path('hermes-memory.txt'); m=mem.read_text(); mm='''GROUP SENDER LABEL CANDIDATE (0.9.9.13): Group bubbles now show the sender's FIDUNIO display name by resolving the existing group-message `senderUid` against the already-owned group member projection in `app.js`. This is presentation-only; no second Firebase/profile subscription or message authority was added. Incoming and outgoing group rows receive a label; direct-message bubbles remain unchanged. Permanent gate `group-sender-label.test.mjs` protects senderUid projection, group-only rendering, and removal of the old incoming-only/m.sender dependency. Device acceptance on iPhone/iPad is still required before closing this outstanding item.\n\n'''
          if 'GROUP SENDER LABEL CANDIDATE (0.9.9.13)' not in m: mem.write_text(mm+m)
          chk=Path('FIDUNIO-BUILD-CHECKLIST.md'); b=chk.read_text(); old="- [ ] **Group chat sender label:** show the sender's FIDUNIO display name on each group-message bubble; preserve direct-message bubble layout and existing group-message authority; add regression coverage and iPhone/iPad device acceptance."; new='- [ ] **Group chat sender label — 0.9.9.13 candidate:** implementation and permanent regression gate complete; sender UID resolves through the existing group member projection; direct-message bubbles unchanged. Pending iPhone/iPad device acceptance.'
          if old in b: b=b.replace(old,new,1)
          chk.write_text(b)
          bug=Path('BUG-LIST.md'); q=bug.read_text(); bn='''### 0.9.9.13 group sender name missing from bubbles\n\n- **Observed:** Group message bubbles do not reliably identify the sender because the renderer expected `m.sender`, while the account-authoritative group projection carries `senderUid`.\n- **Correction:** Resolve the existing `senderUid` against the current group member projection at render time and show the resulting FIDUNIO display name above every group bubble.\n- **Scope:** Presentation only. No direct-message, Firebase, E2EE, receipt, Outbox, membership, disappearing-content, or attachment authority changes.\n- **Status:** DEVICE CANDIDATE — repository gate and iPhone/iPad acceptance required.\n\n'''
          if '### 0.9.9.13 group sender name missing from bubbles' not in q: bug.write_text(bn+q)
          da=Path('DEVICE-ACCEPTANCE-BUGS.md'); d=da.read_text(); dn='''## Group chat sender labels — 0.9.9.13\n\n**Status: DEVICE CANDIDATE.**\n\nAcceptance: in an existing group, confirm incoming and outgoing bubbles show the correct FIDUNIO sender name on iPhone and iPad; send from at least two members if available; close/reopen and confirm labels persist; open a direct chat and confirm no sender label is added there.\n\n'''
          if '## Group chat sender labels — 0.9.9.13' not in d: da.write_text(d.split('\n',1)[0]+'\n\n'+dn+d.split('\n',1)[1].lstrip('\n'))
          PY
          node group-sender-label.test.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js version.js service-worker.js group-sender-label.test.mjs .github/workflows/rebuild-baseline-security.yml README.md CURRENT-REBUILD.md hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md BUG-LIST.md DEVICE-ACCEPTANCE-BUGS.md
          git commit -m "Add group sender-name labels"
          git push origin HEAD:main