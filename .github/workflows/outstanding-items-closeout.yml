name: Outstanding items closeout
on:
  push:
    paths:
      - '.github/workflows/outstanding-items-closeout.yml'
permissions:
  contents: write
jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record outstanding items
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cur = Path('CURRENT-REBUILD.md')
          t = cur.read_text()
          note = '''### OPEN FOLLOW-UP ITEMS — after 0.9.9.12\n\n1. **Disappearing attachments** — photos, files, audio, and video remain intentionally non-disappearing. Future activation must extend the binding `DISAPPEARING-PURGE-AUTHORITY.md` path to physically remove Firebase Storage manifests/chunks and every related durable trace before deleting the authoritative Firestore source message. No attachment disappearance may be enabled until the source-delete-last contract is implemented, permanently gated, live-deployed, and device accepted.\n2. **Group chat sender label** — group message bubbles must display the sender's current/displayed FIDUNIO name so recipients can identify who sent each message. This is a group-chat presentation change only; direct-message bubble layout and existing sender/message authority must remain unchanged.\n\n'''
          if '### OPEN FOLLOW-UP ITEMS — after 0.9.9.12' not in t:
              cur.write_text(note + t)

          mem = Path('hermes-memory.txt')
          t = mem.read_text()
          m = '''OUTSTANDING FOLLOW-UP ITEMS (2026-09-08): (1) Disappearing attachments for photos/files/audio/video are still OPEN. They must not be activated until server-side Firebase Storage manifest/chunk deletion and all related trace cleanup satisfy the binding `DISAPPEARING-PURGE-AUTHORITY.md` source-delete-last contract, with permanent tests, live deployment verification, and device acceptance. (2) Group chat sender labeling is OPEN: each group-message bubble must show the sender's FIDUNIO display name; direct-message bubble layout must remain unchanged. These items must remain visible in the durable checklist until separately built and accepted.\n\n'''
          if 'OUTSTANDING FOLLOW-UP ITEMS (2026-09-08)' not in t:
              mem.write_text(m + t)

          chk = Path('FIDUNIO-BUILD-CHECKLIST.md')
          t = chk.read_text()
          anchor = '# FIDUNIO Complete Rebuild — Authoritative Build Checklist\n\n'
          section = '''### Open follow-up items\n\n- [ ] **Disappearing attachments:** implement trace-free disappearance for photos/files/audio/video, including physical Firebase Storage manifest/chunk deletion and related-trace cleanup under `DISAPPEARING-PURGE-AUTHORITY.md`; preserve source-delete-last ordering; add permanent gates; deploy backend changes; complete direct/group/reopen device acceptance.\n- [ ] **Group chat sender label:** show the sender's FIDUNIO display name on each group-message bubble; preserve direct-message bubble layout and existing group-message authority; add regression coverage and iPhone/iPad device acceptance.\n\n'''
          if '### Open follow-up items' not in t:
              chk.write_text(t.replace(anchor, anchor + section, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CURRENT-REBUILD.md hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record outstanding follow-up items"
          git push origin HEAD:main
