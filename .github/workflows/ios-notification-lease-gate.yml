name: FIDUNIO Notification Lease Gate
on:
  push:
    branches: [ios]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run existing notification lease policy and Firestore-owner regression suites
        run: |
          node functions/notification/notification-lease-policy.test.mjs
          node functions/notification/notification-lease-firestore-admin.test.mjs
