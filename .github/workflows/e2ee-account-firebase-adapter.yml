name: E2EE Firebase Adapter Gate

on:
  push:
    branches: [main]
    paths:
      - 'firebase.js'
      - 'e2ee-account-firebase-adapter.js'
      - 'e2ee-account-firebase-adapter.test.mjs'
      - 'package.json'
      - '.github/workflows/e2ee-account-firebase-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Firebase adapter contract gate
        run: npm run test:firebase-e2ee-adapter
