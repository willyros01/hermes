name: Hermes Firebase backup and variance
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/hbk.yml
      - .github/scripts/fbk.mjs
      - .github/scripts/fbk.sh
permissions:
  contents: read
concurrency:
  group: hermes-daily-backup
  cancel-in-progress: false
jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check backup passphrase is configured (never print it)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ "${#BACKUP_PASSPHRASE}" -lt 16 ]; then
            echo "::error::Set Hermes repository secret BACKUP_PASSPHRASE (at least 16 characters). No database backup has been created."
            exit 1
          fi
      - name: Keyless Google sign-in as read-only database backup helper
        id: auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: projects/130339622893/locations/global/workloadIdentityPools/fidunio-backup/providers/nightly-backup
          service_account: fidunio-backup@fidunio-fef13.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 1800s
      - name: Read every Firestore document and subcollection plus sign-in account list
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT: fidunio-fef13
          BK_NO_QUOTA_HEADER: "1"
        run: node .github/scripts/fbk.mjs "$RUNNER_TEMP/backup.json"
      - name: Encrypt, reopen and compare, then store 30 days on backups branch
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: bash .github/scripts/fbk.sh "$RUNNER_TEMP/backup.json"
      - name: Remove plaintext
        if: always()
        run: rm -f "$RUNNER_TEMP/backup.json"
      - name: Keep nightly schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/hbk.yml/enable"
  variance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare exact main-3 and ios snapshots
        shell: python
        run: |
          import subprocess, pathlib, os, html, json
          from datetime import datetime, timezone
          def git(*args):
              return subprocess.check_output(["git", *args])
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "hvar"
          out.mkdir(parents=True, exist_ok=True)
          refs = {name: git("rev-parse", "refs/remotes/origin/" + name).decode().strip()
                  for name in ("main", "main-3", "ios")}
          left, right = refs["main-3"], refs["ios"]
          # Direct tree comparison, not GitHub's three-dot merge-base comparison.
          raw = git("diff", "--no-renames", "--name-status", "-z", left, right).split(b"\0")
          native, shared, docs = [], [], []
          for i in range(0, len(raw)-1, 2):
              status, path = raw[i].decode(), raw[i+1].decode("utf-8", "replace")
              row = (status, path)
              if path.startswith(("build/", "resources/", "ios/", "www/")) or path in (
                  "capacitor.config.json", "package.json", "package-lock.json"):
                  native.append(row)
              elif path.startswith((".github/", "test/", "tests/")) or path.endswith((".md", ".txt")):
                  docs.append(row)
              else:
                  shared.append(row)
          stamp = datetime.now(timezone.utc).isoformat()
          lines = ["# Hermes code variance", "", "Captured: " + stamp, "",
                   "Exact snapshots: main-3 -> ios (A = only in ios; D = only in main-3; M = changed).",
                   "Groups are review aids; native/build differences can also affect shared behavior.",
                   "This report measures source differences, not functional correctness.", ""]
          for name, sha in refs.items():
              lines.append("- " + name + ": " + sha)
          for title, rows in (("Shared/application candidates", shared),
                              ("Native/package/build candidates", native),
                              ("Documentation, tests and CI", docs)):
              lines.extend(["", "## " + title + " (" + str(len(rows)) + ")", ""])
              if not rows:
                  lines.append("No differences.")
              for status, path in rows:
                  lines.append("- " + status + ": " + path)
          lines.extend(["", "## Diff totals", "", git("diff", "--shortstat", left, right).decode().strip() or "Identical trees."])
          report = "\n".join(lines) + "\n"
          (out / "hvar.md").write_text(report)
          (out / "hvar.html").write_text('<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hermes variance</title><style>body{font:28px/1.6 system-ui;background:#fff;color:#111;margin:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}</style><body><pre>' + html.escape(report) + '</pre></body></html>')
          (out / "hvar.diff").write_bytes(git("diff", "--binary", "--no-ext-diff", left, right))
          (out / "meta.json").write_text(json.dumps({"captured_utc":stamp,"repository":os.environ["GITHUB_REPOSITORY"],"run_id":os.environ["GITHUB_RUN_ID"],"branches":refs}, indent=2)+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(report)
      - name: Store variance report for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: hvar-${{ github.run_id }}
          path: ${{ runner.temp }}/hvar/
          retention-days: 30
          if-no-files-found: error
