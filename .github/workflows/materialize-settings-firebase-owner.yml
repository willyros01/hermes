name: Materialize Settings Firebase Owner

on:
  push:
    branches: [fidunio-rebuild-baseline-2026-09-05]
    paths:
      - 'materialize-settings-firebase-owner.mjs'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Centralize Settings Firebase ownership
        run: node materialize-settings-firebase-owner.mjs
      - name: Validate Firebase and runtime ownership
        run: |
          node --check firebase.js
          node --check settings-lifecycle.js
          npm run test:firebase-e2ee-adapter
          npm run test:runtime-transform-anchors
          npm run test:runtime-authority
          ! grep -q 'gstatic.com/firebasejs/' settings-lifecycle.js
          git diff --check
      - name: Commit centralized Settings Firebase APIs
        run: |
          git config user.name 'willyros01'
          git config user.email 'willyros01@gmail.com'
          git add firebase.js settings-lifecycle.js runtime-authority-gate.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Centralize Settings Firebase ownership'
          git push
