name: Materialize Firebase Account E2EE API

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-firebase-account-e2ee-api.yml'
      - 'materialize-firebase-account-e2ee-api.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add bounded account E2EE API to firebase.js
        run: python materialize-firebase-account-e2ee-api.py
      - name: Commit central Firebase API
        run: |
          if git diff --quiet -- firebase.js; then
            echo 'No firebase.js change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firebase.js
          git commit -m 'Add account E2EE persistence API to central Firebase module'
          git push
