name: Package FIDUNIO 0.9.4.6 checkpoint
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/package-checkpoint-0.9.4.6.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build checkpoint ZIP
        shell: bash
        run: |
          rm -f hermes-ux-0.9.4.6.zip
          zip -r hermes-ux-0.9.4.6.zip . \
            -x '.git/*' \
               '.github/*' \
               'firebase-config.js' \
               'config-firestore.js' \
               '*/firebase-config.js' \
               '*/config-firestore.js' \
               'hermes-ux-0.9.4.6.zip'
      - name: Verify protected files excluded
        shell: bash
        run: |
          if unzip -l hermes-ux-0.9.4.6.zip | grep -Eq '(^|/)(firebase-config|config-firestore)\.js$'; then
            echo 'Protected config file found in ZIP'
            exit 1
          fi
      - name: Upload checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ux-0.9.4.6
          path: hermes-ux-0.9.4.6.zip
          if-no-files-found: error
