name: Package FIDUNIO 0.9.4.6 checkpoint
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/package-checkpoint-0.9.4.6.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build checkpoint ZIP
        shell: bash
        run: |
          rm -rf checkpoint
          mkdir checkpoint
          shopt -s dotglob
          for item in *; do
            case "$item" in
              .git|.github|firebase-config.js|config-firestore.js) continue ;;
            esac
            cp -R "$item" checkpoint/
          done
          find checkpoint -type f \( -name 'firebase-config.js' -o -name 'config-firestore.js' \) -delete
          cd checkpoint
          zip -r ../hermes-ux-0.9.4.6.zip .
      - name: Upload checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ux-0.9.4.6
          path: hermes-ux-0.9.4.6.zip
          if-no-files-found: error
