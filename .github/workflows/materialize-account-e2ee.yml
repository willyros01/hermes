name: Materialize Account E2EE Recovery

on:
  push:
    branches: [fidunio-rebuild-baseline-2026-09-05]
    paths: [.github/workflows/materialize-account-e2ee.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fidunio-rebuild-baseline-2026-09-05
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded source and documentation changes
        run: node materialize-account-e2ee.mjs
      - name: Run focused pure recovery client test
        run: npm run test:e2ee-account-recovery-client
      - name: Commit materialized result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire account E2EE recovery and enrollment lifecycle"
          git push
