name: Rebuild Baseline Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - {name: Checkout, uses: actions/checkout@v4}
      - name: Set up Node
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Set up Java
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - {name: Install test dependencies, run: npm install --ignore-scripts}
      - {name: Firestore E2EE rules gate, run: npm run emulator:test:e2ee-rules}
      - {name: Account direct-message rules gate, run: npm run emulator:test:account-message-rules}
      - {name: Group E2EE rules baseline gate, run: npm run emulator:test:group-e2ee-rules}
      - {name: Invitation lifecycle policy, run: npm run test:invitation-policy}
      - {name: Invitation enrollment rules gate, run: npm run emulator:test:invitation-rules}
      - {name: Invitation install coexistence closeout, run: npm run test:invitation-install-closeout}
      - {name: Account group-message crypto, run: npm run test:e2ee-account-group-crypto}
      - {name: Account group-history grant crypto, run: npm run test:e2ee-account-group-history-crypto}
      - {name: Account group-message runtime, run: npm run test:e2ee-account-group-runtime}
      - {name: Account group-message service ownership, run: npm run test:e2ee-account-group-service}
      - {name: Account group-message Outbox ownership, run: npm run test:e2ee-account-group-outbox}
      - {name: Account group-message conversation ownership, run: npm run test:e2ee-account-group-conversation}
      - {name: Account group-message app controller ownership, run: npm run test:e2ee-account-group-app-controller}
      - {name: Account group-message bounded app integration, run: npm run test:e2ee-account-group-app-integration}
      - {name: Attachment crypto foundation, run: npm run test:e2ee-account-attachment-crypto}
      - {name: Attachment transport and send owner, run: npm run test:attachment-send-service}
      - {name: Photo file audio video UI wiring, run: npm run test:attachment-ui-wiring}
      - {name: Attachment receive integrity and object lifecycle, run: npm run test:attachment-receive}
      - {name: Attachment offline and account isolation, run: npm run test:attachment-offline}
      - {name: Attachment receipt lifecycle, run: npm run test:attachment-lifecycle}
      - {name: Disappearing attachment purge plan, run: npm run test:disappearing-attachment-purge}
      - {name: Attachment phase closeout matrix, run: npm run test:attachment-phase-closeout}
      - {name: Firebase Storage deployment wiring, run: npm run test:storage-deployment-wiring}
      - {name: Disappearing content policy, run: npm run test:disappearing-content-policy}
      - {name: Disappearing first-read authority, run: npm run test:disappearing-read-authority}
      - {name: Disappearing message metadata authority, run: npm run test:disappearing-message-metadata-authority}
      - {name: Disappearing purge decision policy, run: npm run test:disappearing-purge-policy}
      - {name: Disappearing serialized purge executor, run: npm run test:disappearing-purge-executor}
      - {name: Disappearing group grant trace plan, run: npm run test:disappearing-group-grant-trace-plan}
      - {name: Disappearing Firestore purge repository, run: npm run test:disappearing-purge-firestore}
      - {name: Disappearing local convergence policy, run: npm run test:disappearing-local-convergence}
      - {name: Disappearing authoritative projection convergence, run: npm run test:disappearing-authoritative-projection}
      - {name: Disappearing local physical purge wiring, run: npm run test:disappearing-local-storage}
      - {name: Disappearing restart reconnect recovery, run: npm run test:disappearing-reconnect-recovery}
      - {name: Disappearing multi-device convergence, run: npm run test:disappearing-multi-device-convergence}
      - {name: Disappearing compose policy and UI wiring, run: npm run test:disappearing-compose-policy}
      - {name: Disappearing text end-to-end closeout, run: npm run test:disappearing-text-closeout}
      - {name: Disappearing text activation, run: npm run test:disappearing-activation}
      - {name: Disappearing attachment activation, run: npm run test:disappearing-attachment-activation}
      - {name: Disappearing Firestore index wiring, run: npm run test:disappearing-index-wiring}
      - {name: Group sender display label, run: node group-sender-label.test.mjs}
      - {name: Group date separators, run: node group-date-separator.test.mjs}
      - {name: Group sender time, run: node group-sender-time.test.mjs}
      - {name: Group earlier-history admin UI, run: npm run test:group-history-admin-ui}
      - {name: Receipt lifecycle stabilization, run: npm run test:receipt-lifecycle-stabilization}
      - {name: Group history-grant purge barrier, run: npm run test:group-history-grant-purge-barrier}
      - {name: Group history-copy purge barrier, run: npm run test:group-history-copy-purge-barrier}
      - {name: Group receipt purge barrier, run: npm run test:group-receipt-purge-barrier}
      - {name: Recovery server crypto, run: npm run test:recovery-crypto}
      - {name: Recovery session policy, run: npm run test:recovery-session}
      - {name: Recovery callable core, run: npm run test:recovery-callable-core}
      - {name: Recovery Firestore admin adapter, run: npm run test:recovery-firestore}
      - {name: Central Firebase E2EE adapter, run: npm run test:firebase-e2ee-adapter}
      - {name: Account E2EE auth lifecycle, run: npm run test:e2ee-account-lifecycle}
      - {name: Account E2EE recovery client, run: npm run test:e2ee-account-recovery-client}
      - {name: Account direct-message crypto, run: npm run test:e2ee-account-message-crypto}
      - {name: Account direct-message service, run: npm run test:e2ee-account-message-service}
      - {name: Firebase App Check client integration, run: npm run test:firebase-app-check}
      - {name: FCM N2 ownership foundation, run: npm run test:notification-n2-foundation}
      - {name: Notification device Firestore rules, run: npm run emulator:test:notification-rules}
      - {name: FCM N3 registration and Settings, run: npm run test:notification-n3}
      - {name: FCM N4 direct background notification, run: node functions/notification/direct-message-notification-core.test.mjs && node notification-n4.test.mjs}
      - {name: FCM N5 notification tap routing, run: npm run test:notification-n5}
      - {name: FCM N6 group notification fan-out and routing, run: node functions/notification/group-message-notification-core.test.mjs && node notification-n6.test.mjs}
      - {name: Installation-local pending notification inbox, run: node notification-pending-inbox.test.mjs}
      - {name: Activation and composer single-owner lifecycle, run: node activation-composer-ownership.test.mjs}
      - {name: Notification route and immediate message projection, run: npm run test:notification-route-projection}
      - {name: Notification priority semaphore delivery, run: npm run test:notification-priority-delivery}
      - {name: Cloud Functions recovery scaffold, run: npm run test:functions-scaffold}
      - {name: Runtime transform anchor gate, run: npm run test:runtime-transform-anchors}
      - {name: Runtime authority gate, run: npm run test:runtime-authority}
      - {name: 1.0 candidate UI and lifecycle gate, run: npm run test:release-candidate-ui}
      - {name: iPad RC stabilization gate, run: npm run test:ipad-rc-stabilization}
      - {name: Bounded Firebase Outbox reconciliation, run: npm run test:outbox-reconciliation-boundary}
      - {name: LTE optimistic outgoing-message visibility, run: npm run test:lte-optimistic-message}
      - {name: Issue 3 iPhone composer and video source, run: npm run test:issue3-iphone-ui}
      - {name: Audio source chooser and recorder, run: npm run test:audio-source-recorder}
      - {name: Startup and local PIN fail-closed resilience, run: npm run test:startup-auth-resilience}
      - {name: Pending encrypted-Outbox message deletion, run: npm run test:pending-message-delete}
      - {name: Controlled sender direct-message deletion, run: npm run test:message-delete-core}
      - {name: Single visible FIDUNIO PIN and hidden-key UX, run: npm run test:user-access-key-ux}
      - {name: Password change E2EE bridge and rollback, run: node password-change-integration.test.mjs}
      - {name: Forgot Password Firebase-to-E2EE recovery handoff, run: node forgot-password-recovery.test.mjs}
      - {name: Basic direct-message send and receive path, run: node direct-message-basic-path.test.mjs}
      - {name: Direct Read-receipt recovery, run: node direct-read-receipt.test.mjs}
