name: Materialize Rebuild Empty Runtime

on:
  push:
    branches: [fidunio-rebuild-baseline-2026-09-05]
    paths:
      - 'rebuild-empty-runtime.mjs'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize deterministic empty runtime
        run: node rebuild-empty-runtime.mjs
      - name: Validate syntax and removal invariants
        run: |
          node --check app.js
          node --check bootstrap.js
          ! grep -q 'Maria Santos' app.js
          ! grep -q 'John Cruz' app.js
          ! grep -q 'Family Group' app.js
          ! grep -q 'Sample local contacts' app.js
          ! grep -q 'MutationObserver' bootstrap.js
          grep -q 'conversations:\[\]' app.js
          grep -q 'messages:{}' app.js
          grep -q 'selectedId:null' app.js
          grep -q 'function renderNewGroup(){' app.js
          grep -q 'function renderGroupName(){' app.js
          grep -q 'function renderChat(){' app.js
          grep -q 'const cloud=!!c?.cloud;' app.js
          grep -q 'version: "0.9.6.0"' version.js
          git diff --check
      - name: Commit bounded runtime authority change
        run: |
          git config user.name 'willyros01'
          git config user.email 'willyros01@gmail.com'
          git add app.js bootstrap.js version.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Establish deterministic empty production runtime'
          git push
