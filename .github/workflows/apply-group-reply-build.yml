name: Apply Group Reply Build
on:
  push:
    branches: [main]
    paths:
      - apply-group-reply-build.py
      - .github/workflows/apply-group-reply-build.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded source patch
        run: python3 apply-group-reply-build.py
      - name: Validate group reply build
        run: |
          node --check app.js
          node --check group-reply-policy.js
          node group-reply-policy.test.mjs
          node message-reaction-policy.test.mjs
          node message-reaction-wiring.test.mjs
          git diff --check
      - name: Commit feature build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build FIDUNIO 1.1.54 group message replies"
          git push origin main
