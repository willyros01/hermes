name: FIDUNIO 0.9.8.5 Docs
on: {push: {branches: [fidunio-complete-rebuild], paths: [.fidunio-098-docs-trigger]}}
permissions: {contents: write}
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fidunio-complete-rebuild, fetch-depth: 0}
      - run: python .fidunio-098-docs.py
      - run: |
          git config user.name "FIDUNIO Build"
          git config user.email "actions@users.noreply.github.com"
          git add README.md hermes-memory.txt FIDUNIO-BUILD-CHECKLIST.md CURRENT-REBUILD.md RUNTIME-AUTHORITY-MAP.md architecture-ownership.txt DETERMINISTIC-UI-LIFECYCLE.md RUNTIME-TRANSFORM-INVENTORY.md ACCOUNT-E2EE-FIRESTORE-AUTHORITY.md FIRESTORE-E2EE-V1-RULES.md FIRESTORE-E2EE-V1-EMULATOR-TESTS.md BUG-LIST.md hermes-setup.txt quick-start.html
          git commit -m "Document validated FIDUNIO 0.9.8.0 through 0.9.8.5"
          git push origin HEAD:fidunio-complete-rebuild
