name: FIDUNIO 0.9.6.28 state doc fix
on:
  push:
    branches: [fidunio-complete-rebuild]
    paths: ['.fidunio-09627-docfix-trigger']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fidunio-complete-rebuild}
      - run: python .fidunio-09627-docfix.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add FIDUNIO-BUILD-CHECKLIST.md
          git commit -m "Mark FIDUNIO 0.9.6.28 current"
          git push
